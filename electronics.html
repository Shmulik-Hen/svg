<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Electronics</title>
        <style>
            :root { --pad: 18px; }
            html, body { height: 100%; margin: 0; font-family: system-ui, Arial, sans-serif; background:#0b0c10; color:#e8e8e8; }
            a { color: #79b8ff; }
            .screen { height: 100%; display: none; }
            .screen.active { display: flex; }
            #toc { flex-direction: column; padding: 2rem max(2rem, 6vw); gap: 1rem; overflow: auto; }
            #toc h1 { margin: 0 0 .5rem 0; font-size: clamp(1.4rem, 2.5vw, 2rem); }
            #toc p#hint { opacity: .7; font-size: .95rem; margin: 0 0 .75rem 0; }

            /* Collapsible numbered sections */
            details.section { border: 1px solid rgba(255,255,255,0.12); border-radius: .6rem; padding: .4rem .7rem; background: rgba(255,255,255,0.03); }
            details.section + details.section { margin-top: .7rem; }
            details.section[open] { background: rgba(255,255,255,0.05); }
            details.section summary { cursor: pointer; list-style: none; }
            details.section summary::-webkit-details-marker { display: none; }
            .section-title { display: flex; align-items: center; gap: .6rem; font-weight: 600; font-size: clamp(1.05rem, 1.8vw, 1.25rem); }
            .section-title .num { opacity: .8; }
            .chev { display:inline-block; transform: rotate(0deg); transition: transform .18s ease; opacity:.85; }
            details[open] .chev { transform: rotate(90deg); }

            ol.slides { list-style: none; margin: .4rem 0 .2rem 1.25rem; padding-left: 0; }
            ol.slides > li { line-height: 1.9; }
            ol.slides > li a { text-decoration: none; }
            ol.slides > li a .num { opacity: .8; margin-right: .4rem; }

            #viewer { flex-direction: column; min-height: 0; }
            #stageWrap { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
            #stage {
                width: 100%; height: 100%;
                display: flex; align-items: center; justify-content: center;
                padding: var(--pad); box-sizing: border-box;
            }
            #mediaHost { width: 100%; height: 100%; display: contents; }

            #controls { display: flex; gap: .5rem; padding: .5rem; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.04); border-top: 1px solid rgba(255,255,255,0.08); }
            .left, .right { display: flex; gap: .5rem; align-items: center; }
            button { background: rgba(255,255,255,0.08); color: #e8e8e8; border: 1px solid rgba(255,255,255,0.14); padding: .45rem .75rem; border-radius: .5rem; cursor: pointer; font-size: 0.95rem; }
            button:disabled { opacity: .45; cursor: not-allowed; }
            #title { opacity: .9; font-size: .95rem; }
            #backFloat { position: fixed; top: .75rem; left: .75rem; z-index: 10; display: none; }
            #viewer.active #backFloat { display: inline-block; }

            /* Media element styles */
            /* Raster images (PNG/JPG/WebP): don't upscale beyond native size */
            .media-image {
                max-width: 100%;
                max-height: 100%;
                object-fit: contain;
                background:#111;
                box-shadow: 0 0 0 1px rgba(255,255,255,.06) inset;
                display: block;
            }
            /* SVGs via <img> (fallback): fill */
            .media-svg {
                width: 100%;
                height: 100%;
                object-fit: contain;
            }
            /* Interactive SVGs via <object> */
            .media-object {
                width: 100%;
                height: 100%;
                border: 0;
                display: block;
                background:#111;
                box-shadow: 0 0 0 1px rgba(255,255,255,.06) inset;
            }
        </style>
    </head>

    <body>
        <!-- TOC SCREEN -->
        <section id="toc" class="screen active" aria-labelledby="tocTitle">
            <h1 id="tocTitle">Basic Electronics</h1>
            <p id="hint">Tip: click a section to expand/collapse. In slides: ←/→ stay within the current section; Next at the last slide returns to TOC. <kbd>B</kbd>/<kbd>Esc</kbd> to return, <kbd>F</kbd> for fullscreen.</p>
            <div id="tocSections"></div>
            <a href="https://ptable.com/#Properties/Series" target="_blank" rel="noopener">Periodic Table of Elements - Properties</a>
            <a href="https://ptable.com/#Electrons/Configuration" target="_blank" rel="noopener">Periodic Table of Elements - Electron Configurations</a>
        </section>

        <!-- VIEWER SCREEN -->
        <section id="viewer" class="screen" aria-labelledby="slideTitle">
            <button id="backFloat" title="Back to TOC (B / Esc)">Back</button>
            <div id="stageWrap">
                <div id="stage" aria-live="polite">
                    <div id="mediaHost"></div>
                </div>
            </div>
            <div id="controls">
                <div class="left">
                    <button id="backBtn" title="Back to TOC (B / Esc)">Back</button>
                    <button id="prevBtn" title="Previous (← / PageUp)">Prev</button>
                    <button id="nextBtn" title="Next (→ / Space / PageDown)">Next</button>
                </div>
                <div id="title" role="heading" aria-level="2"></div>
                <div class="right">
                    <button id="fsBtn" title="Fullscreen (F)">Fullscreen</button>
                </div>
            </div>
        </section>

        <script>
            /* ==== Your sections ==== */
            const sections = [
                {
                    title: "Common",
                    slides: [
                        { title: "Intro",                   file: "electronics/common/intro.svg" },
                        { title: "Electronics Terms (1)",   file: "electronics/common/electronics_terms1.svg" },
                        { title: "Electronics Terms (2)",   file: "electronics/common/electronics_terms2.svg" },
                        { title: "Diode Forwrd Bias",       file: "electronics/common/diode_example_fwd.svg" },
                        { title: "Diode Reverse Bias",      file: "electronics/common/diode_example_rev.svg" },
                        { title: "Diode V-I Curve",         file: "electronics/common/diode_v-i_curve.svg" },
                        { title: "Zener Circuit",           file: "electronics/common/zener_example_circuit.svg" },
                        { title: "Zener V-I Curve",         file: "electronics/common/zener_v-i_curve.svg" },
                        { title: "BJT NPN",                 file: "electronics/common/bjt_example_npn.svg" },
                        { title: "BJT PNP",                 file: "electronics/common/bjt_example_pnp.svg" },
                        { title: "BJT V-I Curves",          file: "electronics/common/bjt_v-i_curves.svg" },
                    ]
                },
                {
                    title: "Analog",
                    slides: [
                        { title: "Diode Half Rectifier",    file: "electronics/analog/diode_half_rect.svg" },
                        { title: "Diode Full Rectifier",    file: "electronics/analog/diode_full_rect.svg" },
                        { title: "Rectifier Circuit",       file: "electronics/analog/diode_example_circuit.svg" },
                        { title: "Amplifier Circuit",       file: "electronics/analog/bjt_example_circuit.svg" },
                    ]
                },
            ];

            /* ==== Build flat list & section bounds ==== */
            const flat = [];
            const sectionStarts = [];
            const sectionEnds = [];

            (function buildFlat(){
                let idx = 0;
                sections.forEach((sec, si) => {
                    sectionStarts[si] = idx;
                    sec.slides.forEach((sl, li) => {
                        flat.push({
                            file: sl.file,
                            title: sl.title,
                            secIndex: si,
                            slideIndex: li,
                            sectionTitle: sec.title,
                            number: (si + 1) + '.' + (li + 1),
                            interactive: sl.interactive // optional per-slide flag (unused here, default true for SVG)
                        });
                        idx++;
                    });
                    sectionEnds[si] = idx - 1;
                });
            })();

            /* ==== Elements ==== */
            const $ = sel => document.querySelector(sel);
            const toc = $('#toc'), viewer = $('#viewer');
            const tocSections = $('#tocSections');
            const mediaHost = $('#mediaHost'), titleEl = $('#title');
            const prevBtn = $('#prevBtn'), nextBtn = $('#nextBtn');
            const backBtn = $('#backBtn'), backFloat = $('#backFloat'), fsBtn = $('#fsBtn');

            let current = -1; // global index in flat[]

            /* ==== Build TOC (collapsed initially) ==== */
            function buildTOC() {
                tocSections.innerHTML = '';
                sections.forEach((sec, si) => {
                    const details = document.createElement('details');
                    details.className = 'section';
                    // collapsed by default (no details.open)

                    const summary = document.createElement('summary');
                    const titleRow = document.createElement('div');
                    titleRow.className = 'section-title';
                    const chev = document.createElement('span');
                    chev.className = 'chev';
                    chev.textContent = '▸';
                    const num = document.createElement('span');
                    num.className = 'num';
                    num.textContent = (si + 1) + '.';
                    titleRow.appendChild(chev);
                    titleRow.appendChild(num);
                    titleRow.appendChild(document.createTextNode(' ' + sec.title));
                    summary.appendChild(titleRow);
                    details.appendChild(summary);

                    const olSlides = document.createElement('ol');
                    olSlides.className = 'slides';

                    sec.slides.forEach((sl, li) => {
                        const liSlide = document.createElement('li');
                        const a = document.createElement('a');
                        const n = (si + 1) + '.' + (li + 1);
                        const globalIdx = sectionStarts[si] + li;
                        a.href = '#slide=' + globalIdx;
                        a.innerHTML = '<span class="num">' + n + '</span>' + (sl.title || sl.file);
                        a.addEventListener('click', (e) => { e.preventDefault(); showSlide(globalIdx); });
                        liSlide.appendChild(a);
                        olSlides.appendChild(liSlide);

                        // Preload (works for both SVG & rasters)
                        const link = document.createElement('link');
                        link.rel = 'preload'; link.as = 'image'; link.href = sl.file;
                        document.head.appendChild(link);
                    });

                    details.appendChild(olSlides);
                    tocSections.appendChild(details);
                });
            }

            /* ==== Viewer helpers ==== */
            function showTOC() {
                current = -1;
                mediaHost.innerHTML = '';
                toggleScreens('toc');
                history.replaceState(null, '', location.pathname + '#toc');
            }

            function isSvg(filename) {
                return /\.svg(\?.*)?$/i.test(filename);
            }

            // Decide if an SVG should be interactive (<object>) or not (<img>)
            function isInteractiveSlide(file, slideMeta = {}) {
                if (!isSvg(file)) return false;
                // default to interactive for SVGs unless explicitly disabled
                return slideMeta.interactive !== false;
            }

            function renderMedia(file, slideMeta = {}) {
                mediaHost.innerHTML = '';

                if (isInteractiveSlide(file, slideMeta)) {
                    // Use <object> so SVG's internal click handlers & scripts work
                    const obj = document.createElement('object');
                    obj.className = 'media-object';
                    obj.type = 'image/svg+xml';
                    obj.data = file;
                    obj.tabIndex = 0;
                    obj.setAttribute('aria-label', 'Slide viewer (interactive SVG)');

                    // Fallback to <img> if object fails to load (e.g., CORS or missing file)
                    obj.addEventListener('error', () => {
                        const img = document.createElement('img');
                        img.className = 'media-image media-svg';
                        img.src = file;
                        img.alt = '';
                        mediaHost.innerHTML = '';
                        mediaHost.appendChild(img);
                    });

                    mediaHost.appendChild(obj);
                    // Focus after a tick for keyboard users
                    setTimeout(() => obj.focus({ preventScroll: false }), 0);
                } else {
                    // Raster (or non-interactive SVG) as <img>
                    const img = document.createElement('img');
                    img.className = isSvg(file) ? 'media-image media-svg' : 'media-image';
                    img.src = file;
                    img.alt = '';
                    mediaHost.appendChild(img);
                    img.onload = () => img.focus?.({ preventScroll: false });
                }
            }

            function showSlide(idx) {
                if (idx < 0 || idx >= flat.length) return;
                current = idx;
                const s = flat[idx];
                renderMedia(s.file, s);
                titleEl.textContent = 'Slide ' + s.number + ' — ' + s.title + ' (' + s.sectionTitle + ')';
                toggleScreens('viewer');
                updateNavButtons();
                history.replaceState(null, '', '#slide=' + idx);

                // Auto-open the section containing this slide (visible upon return)
                const detailsList = Array.from(document.querySelectorAll('details.section'));
                const secEl = detailsList[s.secIndex];
                if (secEl && !secEl.open) secEl.open = true;
            }

            function toggleScreens(which) {
                toc.classList.toggle('active', which === 'toc');
                viewer.classList.toggle('active', which === 'viewer');
            }

            function getSectionBoundsByIndex(globalIdx){
                const sec = flat[globalIdx].secIndex;
                return { start: sectionStarts[sec], end: sectionEnds[sec] };
            }

            function nextSlide() {
                if (current < 0) return;
                const bounds = getSectionBoundsByIndex(current);
                if (current < bounds.end) showSlide(current + 1);
                else showTOC(); // last in section → back to TOC
            }

            function prevSlide() {
                if (current < 0) return;
                const bounds = getSectionBoundsByIndex(current);
                if (current > bounds.start) showSlide(current - 1);
                else showTOC(); // first in section → back to TOC
            }

            function updateNavButtons() {
                if (current < 0) { prevBtn.disabled = nextBtn.disabled = true; return; }
                const bounds = getSectionBoundsByIndex(current);
                prevBtn.disabled = (current <= bounds.start);
                nextBtn.disabled = (current >= bounds.end);
            }

            // Keyboard controls
            window.addEventListener('keydown', (e) => {
                const inViewer = viewer.classList.contains('active');
                const key = e.key;
                if (inViewer) {
                    if (key === 'ArrowRight' || key === 'PageDown' || key === ' ') { e.preventDefault(); nextSlide(); }
                    else if (key === 'ArrowLeft' || key === 'PageUp') { e.preventDefault(); prevSlide(); }
                    else if (key === 'Home' || key === 'End') { e.preventDefault(); showTOC(); }
                    else if (key === 'Escape' || key.toLowerCase() === 'b') { e.preventDefault(); showTOC(); }
                    else if (key.toLowerCase() === 'f') { e.preventDefault(); toggleFullscreen(); }
                } else {
                    // From TOC: Right arrow or Enter starts at first slide of first section
                    if (key === 'ArrowRight' || key === 'Enter') {
                        e.preventDefault();
                        const firstIdx = sectionStarts[0] ?? 0;
                        showSlide(firstIdx);
                    }
                }
            });

            // Buttons
            backBtn.addEventListener('click', showTOC);
            backFloat.addEventListener('click', showTOC);
            prevBtn.addEventListener('click', prevSlide);
            nextBtn.addEventListener('click', nextSlide);
            fsBtn.addEventListener('click', toggleFullscreen);

            // Fullscreen
            function toggleFullscreen() {
                const el = document.documentElement;
                if (!document.fullscreenElement) (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen)?.call(el);
                else (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen)?.call(el);
            }

            // Hash routing (#slide=NUM)
            function handleHash() {
                const hash = location.hash.startsWith('#') ? location.hash.slice(1) : location.hash;
                const params = new URLSearchParams(hash);
                const val = params.get('slide');
                const idx = val !== null ? Number(val) : NaN;
                if (!Number.isNaN(idx)) { showSlide(idx); return; }
                showTOC();
            }
            window.addEventListener('hashchange', handleHash);

            // Build UI & route
            buildTOC();
            handleHash();
        </script>
    </body>
</html>
