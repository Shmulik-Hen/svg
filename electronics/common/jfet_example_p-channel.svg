<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    id="svg1"
    version="1.1"
    viewBox="0 0 800 600"
    width="800"
    height="600"
    preserveAspectRatio="xMidYMid"
    fill-rule="evenodd"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:svg="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <marker
            id="arrow_head"
            style="overflow:visible"
            viewBox="0 0 4 6"
            markerWidth="4"
            markerHeight="6"
            refX="left"
            refY="center"
            orient="auto-start-reverse"
            preserveAspectRatio="xMidYMid">
            <path
                style="fill:none;stroke:context-stroke;stroke-width:1;stroke-linecap:butt"
                d="M -3,-3 L 0,0 L -3,3">
            </path>
        </marker>
        <text
            id="headline"
            font-family="Ubuntu"
            font-size="32"
            font-weight="bold"
            fill="#0000ff">
            <tspan>JFET Transistor P-Channel</tspan>
        </text>
        <text
            id="bottom_line"
            font-family="Ubuntu"
            font-size="22"
            font-weight="bold"
            fill="#000000">
            <tspan x="0" y="0">Vds &gt; Vgs</tspan>
            <tspan x="0" y="22">|Vgs| &lt; |Vp|</tspan>
        </text>
        <circle
            id="contact_point"
            cx="0"
            cy="0"
            r="5">
        </circle>
        <path
            id="direction"
            d="m -10,7 l 10,7 v -14 z"
            style="fill:#000000;stroke:none">
        </path>
        <g
            id="n_chan_symbol"
            style="fill:none;stroke:#000000">
            <path d="m 0,0 h 40 m 0,-38 v 76 m 0,-17 h 37 m 0,-40 h -37"></path>
            <use xlink:href="#direction" x="30" y="-7"></use>
            <text
                font-family="Ubuntu"
                font-size="14"
                font-weight="norm"
                fill="#000000"
                stroke-width="1">
                <tspan x="45" y="-23">D</tspan>
                <tspan x="15" y="-5">G</tspan>
                <tspan x="45" y="35">S</tspan>
            </text>
            <circle
                cx="40"
                cy="0"
                r="39"
                fill="none"
                stroke="#000000"
                stroke-width="1.5">
            </circle>
        </g>
        <path
            id="resistor_symbol"
            d="m 0,0 h 15
               l 2,-10 l 4,20 l 4,-20 l 4,20
               l 4,-20 l 4,20 l 4,-20 l 4,20
               l 4,-20 l 4,20 l 2,-10 h 15"
            transform="scale(1.2,1.2)"
            style="fill:none;stroke:#000000;stroke-width:3;stroke-opacity:1">
        </path>
        <g
            id="ps">
            <path
                d="m -30,0 h 60 m -50,10 h 40">
            </path>
            <text
                font-family="Ubuntu"
                font-size="36"
                font-weight="norm"
                fill="#000000"
                stroke-width="1">
                <tspan x="-30" y="-15">+</tspan>
                <tspan x="-30" y="20">_</tspan>
            </text>
        </g>
        <g
            id="circuit">
            <g
                style="fill:none;stroke:#000000;stroke-width:5;stroke-opacity:1">
                <path d="m 0,0 v 200 m 0,10 v 200"></path>
                <use xlink:href="#ps" x="0" y="200"></use>
                <path d="m 0,0 h 250 v 50 m 0,80 v 59.5"></path>
                <use xlink:href="#resistor_symbol" x="250" y="50" transform="rotate(90,250,50)"></use>
                <use xlink:href="#n_chan_symbol" x="172.5" y="206"></use>
                <path d="m 250,224.5 v 183 h -250"></path>
                <path d="m 100,405 v -90 m 0,-10 v -99 h 73"></path>
                <use xlink:href="#ps" x="100" y="305"></use>
                <path d="m 250,0 h 50"></path>
                <use xlink:href="#contact_point" x="303" y="0"></use>
            </g>
            <path
                d="m 85,350 l 30,-80"
                style="fill:none;stroke:#000000;stroke-width:2.5;stroke-opacity:1;marker-end:url(#arrow_head)">
            </path>
            <text
                font-family="Ubuntu"
                font-size="24"
                font-weight="norm"
                fill="#000000"
                stroke-width="1"
                style="fill:#000000;stroke:#000000;stroke-width:1">
                <tspan x="130" y="320">Vgs</tspan>
                <tspan x="-74" y="212">Vds</tspan>
                <tspan x="260" y="-10">Out</tspan>
            </text>
            <text
                font-family="monospace"
                font-size="24"
                font-weight="norm"
                stroke-width="1"
                style="fill:#0000ff;stroke:#0000ff;stroke-width:1">
                <tspan x="280" y="220">Id</tspan>
            </text>
            <path
                d="m 270,150 v 130"
                style="fill:none;stroke:#0000ff;stroke-width:2;marker-end:url(#arrow_head)">
            </path>
        </g>
    </defs>
    <g
        id="page1">
        <g
            id="layer1"
            style="display:inline">
            <rect
                x="0"
                y="0"
                width="800"
                height="600"
                fill="white">
            </rect>
        </g>
        <g
            id="layer2"
            style="display:inline">
            <use xlink:href="#headline" x="200" y="50"></use>
            <use xlink:href="#bottom_line" x="500" y="520"></use>
            <use xlink:href="#n_chan_symbol" x="50" y="175" stroke-width="3" transform="scale(1.8)"></use>
            <use xlink:href="#circuit" x="550" y="170" transform="scale(0.85)"></use>
            <path
                d="m 70,450 l 70,-120"
                style="fill:none;stroke:#000000;stroke-width:2.5;marker-end:url(#arrow_head)">
            </path>
            <text
                id="headline"
                font-family="Ubuntu"
                font-size="22"
                font-weight="bold"
                fill="#0000ff">
                <tspan x="30" y="470">Bias, Not Current Direction</tspan>
            </text>
        </g> <!--layer2-->
    </g> <!--page1-->
</svg>