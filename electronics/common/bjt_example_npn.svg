<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    id="svg1"
    version="1.1"
    viewBox="0 0 800 600"
    width="800"
    height="600"
    preserveAspectRatio="xMidYMid"
    fill-rule="evenodd"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:svg="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <marker
            id="arrow_head"
            style="overflow:visible"
            viewBox="0 0 4 6"
            markerWidth="4"
            markerHeight="6"
            refX="left"
            refY="center"
            orient="auto-start-reverse"
            preserveAspectRatio="xMidYMid">
            <path
                style="fill:none;stroke:context-stroke;stroke-width:1;stroke-linecap:butt"
                d="M -3,-3 L 0,0 L -3,3">
            </path>
        </marker>
        <text
            id="headline"
            font-family="Ubuntu"
            font-size="32"
            font-weight="bold"
            fill="#0000ff">
            <tspan>BJT Transistor NPN</tspan>
        </text>
        <text
            id="bottom_line"
            font-family="Ubuntu"
            font-size="22"
            font-weight="bold"
            fill="#000000">
            <tspan>(Vbb − Vee) ≥ 0.7v(Si) / 0.2v(Ge)</tspan>
        </text>
        <text
            id="bottom_line2"
            font-family="Ubuntu"
            font-size="22"
            font-weight="bold"
            fill="#000000">
            <tspan x="-50" y="0">Vce &gt; Vbe</tspan>
            <tspan x="-50" y="22">Vbe &gt; 0.7v(Si) / 0.2v(Ge)</tspan>
        </text>
        <text
            id="bottom_line3"
            font-family="monospace"
            font-size="22"
            font-weight="bold"
            fill="#000000">
            <tspan x="0" y="47">Ie = Ic + Ib</tspan>
        </text>
        <rect
            id="p_side"
            x="0"
            y="0"
            width="147.5"
            height="20"
            style="fill:#ff0000;fill-opacity:0.2;stroke:none">
        </rect>
        <rect
            id="n_side"
            x="0"
            y="0"
            width="147.5"
            height="138"
            style="fill:#00ffff;fill-opacity:0.2;stroke:none">
        </rect>
        <circle
            id="contact_point"
            cx="0"
            cy="0"
            r="5">
        </circle>
        <g
            id="transistor"
            style="fill:none;stroke:#000000;stroke-width:5;stroke-opacity:1">
            <g>
                <rect x="0" y="0" width="150" height="300"></rect>
                <path d="m 0,150 h -50"></path>
                <path d="m 75,0 v -50"></path>
                <path d="m 75,300 v 50"></path>
                <use xlink:href="#contact_point" x="-53" y="150"></use>
                <use xlink:href="#contact_point" x="75" y="-53"></use>
                <use xlink:href="#contact_point" x="75" y="353"></use>
            </g>
            <g
                style="fill:none;stroke:#000000;stroke-width:5;stroke-opacity:0.5;stroke-dasharray:4 4">
                <path d="m 0,140 h 150"></path>
                <path d="m 0,160 h 150"></path>
            </g>
            <use xlink:href="#n_side" x="2.5" y="2.5"></use>
            <use xlink:href="#p_side" x="2.5" y="140"></use>
            <use xlink:href="#n_side" x="2.5" y="160"></use>
            <g style="fill:none;stroke:#000000;stroke-width:1;font-family:Ubuntu;font-size:20;font-weight:norm">
                <text>
                    <tspan x="70" y="75">N</tspan>
                    <tspan x="70" y="156">P</tspan>
                    <tspan x="70" y="235">N</tspan>
                </text>
                <text>
                    <tspan x="80" y="-20">Collector - C</tspan>
                    <tspan x="-70" y="175">Base - B</tspan>
                    <tspan x="80" y="330">Emitter - E</tspan>
                </text>
                <text>
                    <tspan x="55" y="-65">Vcc</tspan>
                    <tspan x="-70" y="140">Vbb</tspan>
                    <tspan x="55" y="380">Vee</tspan>
                </text>
            </g>
        </g>
        <path
            id="direction"
            d="m 0,0 l 10,7 l -10,7 z"
            style="fill:#000000;stroke:none">
        </path>
        <g
            id="npn_symbol"
            style="fill:none;stroke:#000000">
            <path d="m 0,-25 v 50 m 0,-35 l 25,-15"></path>
            <path d="m 0,10 l 25,15"></path>
            <use xlink:href="#direction" x="21" y="11" transform="rotate(35,15,17)"></use>
            <text
                font-family="Ubuntu"
                font-size="14"
                font-weight="norm"
                fill="#000000"
                stroke-width="1">
                <tspan x="30" y="-20">C</tspan>
                <tspan x="-15" y="-5">B</tspan>
                <tspan x="30" y="30">E</tspan>
            </text>
        </g>
        <path
            id="resistor_symbol"
            d="m 0,0 h 15
               l 2,-10 l 4,20 l 4,-20 l 4,20
               l 4,-20 l 4,20 l 4,-20 l 4,20
               l 4,-20 l 4,20 l 2,-10 h 15"
            transform="scale(1.2,1.2)"
            style="fill:none;stroke:#000000;stroke-width:3;stroke-opacity:1">
        </path>
        <g
            id="ps">
            <path
                d="m -30,0 h 60 m -50,10 h 40">
            </path>
            <text
                font-family="Ubuntu"
                font-size="36"
                font-weight="norm"
                fill="#000000"
                stroke-width="1">
                <tspan x="-30" y="-15">+</tspan>
                <tspan x="-30" y="20">_</tspan>
            </text>
        </g>
        <g
            id="circuit">
            <g
                style="fill:none;stroke:#000000;stroke-width:5;stroke-opacity:1">
                <path d="m 0,0 v 200 m 0,10 v 200"></path>
                <use xlink:href="#ps" x="0" y="200"></use>
                <path d="m 0,0 h 200 v 50 m 0,80 v 53"></path>
                <use xlink:href="#resistor_symbol" x="200" y="50" transform="rotate(90,200,50)"></use>
                <use xlink:href="#npn_symbol" x="175.5" y="206"></use>
                <path d="m 200,233 v 40"></path>
                <use xlink:href="#resistor_symbol" x="200" y="267" transform="rotate(90,200,267)"></use>
                <path d="m 200,351 v 56.5 h -200"></path>
                <path d="m 70,405 v -90 m 0,-10 v -99 h 10"></path>
                <use xlink:href="#ps" x="70" y="305"></use>
                <use xlink:href="#resistor_symbol" x="80" y="206"></use>
                <path d="m 164,206 h 10"></path>
                <path d="m 200,242 h 50"></path>
                <use xlink:href="#contact_point" x="253" y="242"></use>
            </g>
            <path
                d="m 40,340 l 60,-60"
                style="fill:none;stroke:#000000;stroke-width:2.5;stroke-opacity:1;marker-end:url(#arrow_head)">
            </path>
            <text
                font-family="Ubuntu"
                font-size="24"
                font-weight="norm"
                fill="#000000"
                stroke-width="1"
                style="fill:#000000;stroke:#000000;stroke-width:1">
                <tspan x="105" y="320">Vbe</tspan>
                <tspan x="-74" y="212">Vce</tspan>
                <tspan x="240" y="230">Out</tspan>
            </text>
            <text
                font-family="monospace"
                font-size="24"
                font-weight="norm"
                stroke-width="1"
                style="fill:#0000ff;stroke:#0000ff;stroke-width:1">
                <tspan x="115" y="260">Ib</tspan>
                <tspan x="235" y="140">Ic</tspan>
                <tspan x="235" y="290">Ie</tspan>
            </text>
            <g
                style="fill:none;stroke:#0000ff;stroke-width:2;marker-end:url(#arrow_head)">
                <path d="m 85,230 h 70"></path>
                <path d="m 225,100 v 70"></path>
                <path d="m 225,250 v 70"></path>
            </g>
        </g>
    </defs>
    <g
        id="page1">
        <g
            id="layer1"
            style="display:inline">
            <rect
                x="0"
                y="0"
                width="800"
                height="600"
                fill="white">
            </rect>
        </g>
        <g
            id="layer2"
            style="display:inline">
            <use xlink:href="#headline" x="250" y="50"></use>
            <use xlink:href="#bottom_line" x="20" y="580"></use>
            <use xlink:href="#bottom_line2" x="580" y="535"></use>
            <use xlink:href="#bottom_line3" x="530" y="535"></use>
            <use xlink:href="#transistor" x="80" y="190" transform="scale(0.9)"></use>
            <use xlink:href="#npn_symbol" x="190" y="175" stroke-width="3" transform="scale(1.8)"></use>
            <use xlink:href="#circuit" x="645" y="170" transform="scale(0.85)"></use>
        </g> <!--layer2-->
    </g> <!--page1-->
</svg>