<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    id="svg1"
    version="1.1"
    viewBox="0 0 800 600"
    width="800"
    height="600"
    preserveAspectRatio="xMidYMid"
    fill-rule="evenodd"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:svg="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <marker
            id="arrow_head"
            style="overflow:visible"
            viewBox="0 0 4 6"
            markerWidth="4"
            markerHeight="6"
            refX="left"
            refY="center"
            orient="auto-start-reverse"
            preserveAspectRatio="xMidYMid">
            <path
                style="fill:none;stroke:context-stroke;stroke-width:1;stroke-linecap:butt"
                d="M -3,-3 L 0,0 L -3,3">
            </path>
        </marker>
        <text
            id="headline"
            font-family="Ubuntu"
            font-size="32"
            font-weight="bold"
            fill="#0000ff">
            <tspan>Diode in Reverse Bias</tspan>
        </text>
        <rect
            id="p_side"
            x="0"
            y="0"
            width="147.5"
            height="146"
            style="fill:#ff0000;fill-opacity:0.2;stroke:none">
        </rect>
        <rect
            id="n_side"
            x="4"
            y="0"
            width="147.5"
            height="146"
            style="fill:#00ffff;fill-opacity:0.2;stroke:none">
        </rect>
        <g
            id="diode">
            <rect
                x="0"
                y="0"
                width="300"
                height="150"
                style="fill:none;stroke:#000000;stroke-width:5">
            </rect>
            <path
                d="m 150,0 v 150"
                style="fill:none;stroke:#000000;stroke-width:5;stroke-opacity:0.5;stroke-dasharray:4 4">
            </path>
            <path
                d="m 0,75 h -50"
                style="fill:none;stroke:#000000;stroke-width:5;stroke-opacity:1">
            </path>
            <path
                d="m 300,75 h 50"
                style="fill:none;stroke:#000000;stroke-width:5;stroke-opacity:1">
            </path>
            <use xlink:href="#p_side" x="150" y="2.5"></use>
            <use xlink:href="#n_side" x="-1.5" y="2.5"></use>
            <use xlink:href="#contact_point" x="-53" y="75"></use>
            <use xlink:href="#contact_point" x="353" y="75"></use>
            <text
                font-family="Ubuntu"
                font-size="14"
                font-weight="norm"
                fill="#000000"
                stroke-width="1"
                style="fill:none;stroke:#000000;stroke-width:1">
                <tspan x="50" y="-10">Cathode</tspan>
                <tspan x="200" y="-10">Anode</tspan>
            </text>
            <text
                font-family="Ubuntu"
                font-size="20"
                font-weight="norm"
                fill="#000000"
                stroke-width="1"
                style="fill:none;stroke:#000000;stroke-width:1">
                <tspan x="70" y="75">N</tspan>
                <tspan x="220" y="75">P</tspan>
            </text>
            <text
                font-family="Ubuntu"
                font-size="36"
                font-weight="norm"
                fill="#000000"
                stroke-width="1"
                style="fill:#000000;stroke:#000000;stroke-width:1">
                <tspan x="-70" y="65">V₊</tspan>
                <tspan x="340" y="65">V₋</tspan>
            </text>
        </g>
        <g
            id="diode_symbol"
            style="fill:none;stroke:#000000;stroke-width:5">
            <polygon
                points="0,15 30,0 30,30">
            </polygon>
            <path d="m 0,-3 v 35"></path>
            <text
                font-family="Ubuntu"
                font-size="14"
                font-weight="norm"
                fill="#000000"
                stroke-width="1">
                <tspan x="40" y="5">Anode</tspan>
                <tspan x="-60" y="5">Cathode</tspan>
            </text>
        </g>
        <path
            id="resistor_symbol"
            d="m 0,0 h 15
               l 2,-10 l 4,20 l 4,-20 l 4,20
               l 4,-20 l 4,20 l 4,-20 l 4,20
               l 4,-20 l 4,20 l 2,-10 h 15"
            transform="rotate(90) scale(1.2,1.2)"
            style="fill:none;stroke:#000000;stroke-width:3;stroke-opacity:1">
        </path>
        <g
            id="circuit">
            <path
                d="m 0,0 v 80 m 0,60 v 50 m 0,60 v 50 m 0,60 v 80 h -150 v -200 m -20,0 h 40 m -50,-10 h 60 m -30,0 v -227.5 h 60 m 30,0 h 60"
                style="fill:none;stroke:#000000;stroke-width:5;stroke-opacity:1">
            </path>
            <text
                font-family="Ubuntu"
                font-size="36"
                font-weight="norm"
                fill="#000000"
                stroke-width="1">
                <tspan x="-180" y="220">+</tspan>
                <tspan x="-180" y="250">_</tspan>
            </text>
        </g>
        <circle
            id="contact_point"
            cx="0"
            cy="0"
            r="5"
            style="fill:none;stroke:#000000;stroke-width:5;stroke-opacity:1">
        </circle>
        <path
            id="contact_wire"
            d="m 0,0 l 0,40"
            style="fill:none;stroke:#000000;stroke-width:5;stroke-opacity:1">
        </path>
        <g
            id="contact">
            <use xlink:href="#contact_wire" x="0" y="0"></use>
            <use xlink:href="#contact_point" x="0" y="45"></use>
        </g>
        <g
            id="switch_closed">
            <use xlink:href="#contact_point" x="0" y="0"></use>
            <use xlink:href="#contact_point" x="0" y="50"></use>
            <use xlink:href="#contact" x="0" y="5"></use>
        </g>
        <g
            id="switch_open">
            <use xlink:href="#contact_point" x="0" y="0"></use>
            <use xlink:href="#contact_point" x="0" y="50"></use>
            <use xlink:href="#contact" x="0" y="5" transform="rotate(-45)"></use>
        </g>
        <g
            id="bulb_shape">
            <circle
                cx="0"
                cy="0"
                r="30"
                style="fill:none;stroke:#000000;stroke-width:5;stroke-opacity:1">
            </circle>
            <path
                d="m -20,-20 l 40,40 m -40,0 l 40,-40"
                style="fill:none;stroke:#000000;stroke-width:5;stroke-opacity:1">
            </path>
        </g>
        <circle
            id="bulb_light"
            cx="0"
            cy="0"
            r="40"
            style="fill:#e4f40b;fill-opacity:1;stroke:none">
        </circle>
        <g
            id="bulb_off">
            <use xlink:href="#bulb_shape" x="0" y="0"></use>
        </g>
        <circle
            id="button"
            cx="0"
            cy="0"
            r="20"
            style="fill:none;stroke:#000000;stroke-width:2;stroke-opacity:1">
        </circle>
        <g
            id="button_on">
            <use xlink:href="#button" x="0" y="0"></use>
            <text
                font-family="Ubuntu"
                font-size="20"
                font-weight="bold"
                fill="#000000">
                <tspan x="-13" y="6">On</tspan>
            </text>
        </g>
        <g
            id="button_off">
            <use xlink:href="#button" x="0" y="0"></use>
            <text
                font-family="Ubuntu"
                font-size="20"
                font-weight="bold"
                fill="#000000">
                <tspan x="-17" y="6">Off</tspan>
            </text>
        </g>
        <g
            id="current">
            <path
                d="m 0,0 l 100,0"
                style="fill:none;stroke:#000000;stroke-width:2;stroke-opacity:1;marker-end:url(#arrow_head)">
            </path>
            <path
                d="m 40,-10 l 20,20 m 0,-20 l -20,20"
                style="fill:none;stroke:#000000;stroke-width:5;stroke-opacity:1">
            </path>
            <text
                font-family="Ubuntu"
                font-size="20"
                font-weight="bold"
                fill="#000000">
                <tspan x="-5" y="30">No Current !</tspan>
            </text>
        </g>
    </defs>
    <g
        id="page1">
        <g
            id="layer1"
            style="display:inline">
            <rect
                x="0"
                y="0"
                width="800"
                height="600"
                fill="white">
            </rect>
        </g>
        <g
            id="layer2"
            style="display:inline">
            <use xlink:href="#headline" x="100" y="50"></use>
            <use xlink:href="#diode" x="80" y="230"></use>
            <use xlink:href="#circuit" x="700" y="130"></use>
            <use xlink:href="#diode_symbol" x="610" y="118"></use>
            <use xlink:href="#resistor_symbol" x="700" y="307"></use>
            <use xlink:href="#button_on" x="595" y="40"></use>
            <use xlink:href="#button_off" x="650" y="40"></use>
            <use xlink:href="#current" x="570" y="170"></use>
            <use xlink:href="#switch_closed" x="700" y="215" visibility="hidden">
                <animate
                    id="switch_closed_anim_on"
                    attributeName="visibility"
                    from="hidden"
                    to="visible"
                    begin="button_on.click"
                    dur="0.01s"
                    fill="freeze">
                </animate>
                <animate
                    id="switch_closed_anim_off"
                    attributeName="visibility"
                    from="visible"
                    to="hidden"
                    begin="button_off.click"
                    dur="0.01s"
                    fill="freeze">
                </animate>
            </use>
            <use xlink:href="#switch_open" x="700" y="215" visibility="visible">
                <animate
                    id="switch_open_anim_on"
                    attributeName="visibility"
                    from="visible"
                    to="hidden"
                    begin="switch_closed_anim_on.end"
                    dur="0.01s"
                    fill="freeze">
                </animate>
                <animate
                    id="switch_open_anim_off"
                    attributeName="visibility"
                    from="hidden"
                    to="visible"
                    begin="switch_closed_anim_off.end"
                    dur="0.01s"
                    fill="freeze">
                </animate>
            </use>
            <use xlink:href="#bulb_off" x="700" y="460"></use>
        </g> <!--layer2-->
    </g> <!--page1-->
</svg>