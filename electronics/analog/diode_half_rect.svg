<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    id="svg1"
    version="1.1"
    viewBox="0 0 800 600"
    width="800"
    height="600"
    preserveAspectRatio="xMidYMid"
    fill-rule="evenodd"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:svg="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <marker
            id="arrow_head"
            style="overflow:visible"
            viewBox="0 0 4 6"
            markerWidth="4"
            markerHeight="6"
            refX="left"
            refY="center"
            orient="auto-start-reverse"
            preserveAspectRatio="xMidYMid">
            <path
                style="fill:none;stroke:context-stroke;stroke-width:1;stroke-linecap:butt"
                d="M -3,-3 L 0,0 L -3,3">
            </path>
        </marker>
        <text
            id="headline"
            font-family="Ubuntu"
            font-size="32"
            font-weight="bold"
            fill="#0000ff">
            <tspan>Diode Usage - Half Rectification</tspan>
        </text>
        <g
            id="diode_symbol"
            style="fill:none;stroke:#000000;stroke-width:5">
            <polygon points="0,0 30,15 0,30"></polygon>
            <path d="m 32,-3 v 35"></path>
            <text
                font-family="Ubuntu"
                font-size="20"
                font-weight="norm"
                fill="#000000"
                stroke-width="1">
                <tspan x="-100" y="5">Vin</tspan>
                <tspan x="170" y="5">Vout</tspan>
            </text>
        </g>
        <path
            id="resistor_symbol"
            d="m 0,0 h 15
               l 2,-10 l 4,20 l 4,-20 l 4,20
               l 4,-20 l 4,20 l 4,-20 l 4,20
               l 4,-20 l 4,20 l 2,-10 h 15"
            transform="rotate(90) scale(1.2,1.2)"
            style="fill:none;stroke:#000000;stroke-width:3;stroke-opacity:1">
        </path>
        <circle
            id="contact_point"
            cx="0"
            cy="0"
            r="5"
            style="fill:none;stroke:#000000;stroke-width:5;stroke-opacity:1">
        </circle>
        <g
            id="circuit">
            <path
                d="m 0,3 h 80 m 30,0 h 150 m -90,0 v 80 m 0,60 v 80 m 90,0 h -260 m -3,5 v 20 m -20,0 h 40 m -35,10 h 30 m -25,10 h 20"
                style="fill:none;stroke:#000000;stroke-width:5;stroke-opacity:1">
            </path>
            <use xlink:href="#contact_point" x="-3" y="3"></use>
            <use xlink:href="#contact_point" x="265" y="3"></use>
            <use xlink:href="#contact_point" x="-3" y="222.5"></use>
            <use xlink:href="#contact_point" x="265" y="222.5"></use>
        </g>
        <g
            id="coordinate_system">
            <path
                d="M 25,100 H 375"
                style="fill:none;stroke:#000000;stroke-width:1.5;stroke-opacity:1;marker-end:url(#arrow_head)">
            </path>
            <path
                d="M 50,20 V 180"
                style="fill:none;stroke:#000000;stroke-width:1.5;stroke-opacity:1;marker-end:url(#arrow_head);marker-start:url(#arrow_head)">
            </path>
            <text
                x="25"
                y="115"
                font-family="Ubuntu"
                font-size="14"
                font-weight="norm"
                fill="#000000">
                <tspan>x</tspan>
            </text>
            <text
                x="40"
                y="55"
                font-family="Ubuntu"
                font-size="14"
                font-weight="norm"
                fill="#000000">
                <tspan>y</tspan>
            </text>
            <text
                x="380"
                y="105"
                font-family="Ubuntu"
                font-size="14"
                font-weight="norm"
                fill="#000000">
                <tspan>T</tspan>
            </text>
            <text
                x="10"
                y="105"
                font-family="Ubuntu"
                font-size="14"
                font-weight="norm"
                fill="#000000">
                <tspan>0</tspan>
            </text>
            <text
                x="10"
                y="30"
                font-family="Ubuntu"
                font-size="14"
                font-weight="norm"
                fill="#000000">
                <tspan>+</tspan>
            </text>
            <text
                x="10"
                y="180"
                font-family="Ubuntu"
                font-size="14"
                font-weight="norm"
                fill="#000000">
                <tspan>-</tspan>
            </text>
        </g><!-- coordinate_system -->
        <path
            id="voltage_wave"
            d="m 0,0
               c 20 -70, 30 -70, 50 0
               s 30 70, 50 0
               s 30 -70, 50 0
               s 30 70, 50 0
               s 30 -70, 50 0
               s 30 70, 50 0"
            style="fill:none;stroke:#000000;stroke-width:3;stroke-opacity:1">
        </path>
        <path
            id="reference_wave"
            d="m 0,0
                 c 20 -70, 30 -70, 50 0
                 s 30 70, 50 0
                 s 30 -70, 50 0
                 s 30 70, 50 0
                 s 30 -70, 50 0
                 s 30 70, 50 0"
            style="fill:none;stroke:#000000;stroke-width:1;stroke-opacity:1;stroke-dasharray:3, 3">
        </path>
        <path
            id="rectified_wave"
            d="m 0,0 c 20 -70, 30 -70, 50 0
               m 50,0 c 20 -70, 30 -70, 50 0
               m 50,0 c 20 -70, 30 -70, 50 0"
            style="fill:none;stroke:#000000;stroke-width:3;stroke-opacity:1">
        </path>
    </defs>
    <g
        id="page1">
        <g
            id="layer1"
            style="display:inline">
            <rect
                x="0"
                y="0"
                width="800"
                height="600"
                fill="white">
            </rect>
        </g>
        <g
            id="layer2"
            style="display:inline">
            <use xlink:href="#headline" x="150" y="50"></use>
            <use xlink:href="#circuit" x="50" y="200"></use>
            <use xlink:href="#diode_symbol" x="130" y="188"></use>
            <use xlink:href="#resistor_symbol" x="220" y="270"></use>
            <use xlink:href="#coordinate_system" x="400" y="100"></use>
            <text
                x="440"
                y="115"
                font-family="Ubuntu"
                font-size="14"
                font-weight="norm"
                fill="#000000">
                <tspan>Vin</tspan>
            </text>
            <use xlink:href="#voltage_wave" x="451" y="200"></use>
            <use xlink:href="#coordinate_system" x="400" y="300"></use>
            <text
                x="440"
                y="315"
                font-family="Ubuntu"
                font-size="14"
                font-weight="norm"
                fill="#000000">
                <tspan>Vout</tspan>
            </text>
            <use xlink:href="#reference_wave" x="451" y="400"></use>
            <use xlink:href="#rectified_wave" x="451" y="400"></use>
        </g>
    </g> <!--page1-->
</svg>