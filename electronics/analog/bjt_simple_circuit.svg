<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    id="svg1"
    version="1.1"
    viewBox="0 0 800 600"
    width="800"
    height="600"
    preserveAspectRatio="xMidYMid"
    fill-rule="evenodd"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:svg="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <marker
            id="arrow_head"
            style="overflow:visible"
            viewBox="0 0 4 6"
            markerWidth="4"
            markerHeight="6"
            refX="left"
            refY="center"
            orient="auto-start-reverse"
            preserveAspectRatio="xMidYMid">
            <path
                style="fill:none;stroke:context-stroke;stroke-width:1;stroke-linecap:butt"
                d="M -3,-3 L 0,0 L -3,3">
            </path>
        </marker>
        <text
            id="headline"
            font-family="Ubuntu"
            font-size="32"
            font-weight="bold"
            fill="#0000ff">
            <tspan>Simple BJT Circuit - Amplifier</tspan>
        </text>
        <text
            id="bottom_line"
            font-family="monospace"
            font-size="26"
            font-weight="bold"
            fill="#000000">
            <tspan>β(or Hfe)=Ic/Ib≈2</tspan>
        </text>
        <g
            id="coordinate_system">
            <path
                d="M 25,100 H 375"
                style="fill:none;stroke:#000000;stroke-width:1.5;stroke-opacity:1;marker-end:url(#arrow_head)">
            </path>
            <path
                d="M 50,20 V 180"
                style="fill:none;stroke:#000000;stroke-width:1.5;stroke-opacity:1;marker-end:url(#arrow_head);marker-start:url(#arrow_head)">
            </path>
            <text
                x="380"
                y="105"
                font-family="Ubuntu"
                font-size="14"
                font-weight="bold"
                fill="#000000">
                <tspan>T</tspan>
            </text>
            <text
                x="10"
                y="105"
                font-family="Ubuntu"
                font-size="14"
                font-weight="bold"
                fill="#000000">
                <tspan>0</tspan>
            </text>
        </g><!-- coordinate_system -->
        <path
            id="voltage_wave"
            d="m 0,0
               c 20 -70, 30 -70, 50 0
               s 30 70, 50 0
               s 30 -70, 50 0
               s 30 70, 50 0
               s 30 -70, 50 0
               s 30 70, 50 0"
            style="fill:none;stroke:#000000;stroke-width:3;stroke-opacity:1">
        </path>
        <path
            id="reference_wave"
            d="m 0,0
                 c 20 -70, 30 -70, 50 0
                 s 30 70, 50 0
                 s 30 -70, 50 0
                 s 30 70, 50 0
                 s 30 -70, 50 0
                 s 30 70, 50 0"
            style="fill:none;stroke:#000000;stroke-width:2;stroke-opacity:1;stroke-dasharray:3, 3">
        </path>
        <path
            id="direction"
            d="m 0,0 l 10,7 l -10,7 z"
            style="fill:#000000;stroke:none">
        </path>
        <g
            id="npn_symbol"
            transform="scale(0.8,0.8)"
            style="fill:none;stroke:#000000;stroke-width:5">
            <path d="m 0,-25 v 50 m 0,-35 l 25,-15"></path>
            <path d="m 0,10 l 25,15"></path>
            <use xlink:href="#direction" x="21" y="11" transform="rotate(35,15,17)"></use>
            <text
                font-family="Ubuntu"
                font-size="14"
                font-weight="norm"
                fill="#000000"
                stroke-width="1">
                <tspan x="30" y="-20">C</tspan>
                <tspan x="-15" y="-5">B</tspan>
                <tspan x="30" y="30">E</tspan>
            </text>
        </g>
        <g
            id="pnp_symbol"
            transform="scale(0.8,0.8)"
            style="fill:none;stroke:#000000;stroke-width:5">
            <path d="m 0,-25 v 50 m 0,-35 l 25,-15"></path>
            <path d="m 0,10 l 25,15"></path>
            <use xlink:href="#direction" x="13" y="-9" transform="rotate(155,13,-9)"></use>
            <text
                font-family="Ubuntu"
                font-size="14"
                font-weight="norm"
                fill="#000000"
                stroke-width="1">
                <tspan x="30" y="-20">C</tspan>
                <tspan x="-15" y="-5">B</tspan>
                <tspan x="30" y="30">E</tspan>
            </text>
        </g>
        <path
            id="resistor_symbol"
            d="m 0,0 h 15
               l 2,-10 l 4,20 l 4,-20 l 4,20
               l 4,-20 l 4,20 l 4,-20 l 4,20
               l 4,-20 l 4,20 l 2,-10 h 15"
            transform="scale(0.8,0.8)"
            style="fill:none;stroke:#000000;stroke-width:3;stroke-opacity:1">
        </path>
        <path
            id="capacitor_symbol"
            d="m 0,0 v 20 h -20 h 40 m -20,10 h -20 h 40 m -20,0 v 20"
            transform="scale(0.8,0.8)"
            style="fill:none;stroke:#000000;stroke-width:3;stroke-opacity:1">
        </path>
        <circle
            id="contact_point"
            cx="0"
            cy="0"
            r="5">
        </circle>
        <g
            id="wire">
            <use xlink:href="#contact_point" x="-5" y="0"></use>
            <path d="m 0,0 h 325"></path>
            <use xlink:href="#contact_point" x="331" y="0"></use>
            <use xlink:href="#contact_point" x="-5" y="400"></use>
            <path d="m -1,400 h 325"></path>
            <use xlink:href="#contact_point" x="331" y="400"></use>
            <path d="m 0,200 h 65"></path>
            <use xlink:href="#contact_point" x="-5" y="200"></use>
            <path d="m 295,0 v 30"></path>
            <path d="m 295,85 v 30"></path>
            <path d="m 295,150 v 100"></path>
            <path d="m 295,289 v 30"></path>
            <path d="m 295,370 v 30"></path>
            <path d="m 295,200 h 40"></path>
            <use xlink:href="#contact_point" x="338" y="200"></use>
            <path d="m 275,133 h -50 v 135 h 50"></path>
            <path d="m 225,200 h -50"></path>
            <path d="m 125,200 h -20"></path>
        </g>
        <g
            id="circuit"
            style="fill:none;stroke:#000000;stroke-width:5;stroke-opacity:1">
            <use xlink:href="#wire" x="0" y="0"></use>
            <use xlink:href="#resistor_symbol" x="295" y="30" transform="rotate(90,295,30)"></use>
            <use xlink:href="#pnp_symbol" x="276" y="133"></use>
            <use xlink:href="#npn_symbol" x="276" y="268"></use>
            <use xlink:href="#resistor_symbol" x="295" y="315" transform="rotate(90,295,315)"></use>
            <use xlink:href="#resistor_symbol" x="125" y="200"></use>
            <use xlink:href="#capacitor_symbol" x="105" y="200" transform="rotate(90,105,200)"></use>
            <text
                font-family="Ubuntu"
                font-size="22"
                font-weight="bold"
                fill="#000000"
                stroke-width="1">
                <tspan x="345" y="10">+Vcc</tspan>
                <tspan x="345" y="410">-Vee</tspan>
                <tspan x="-20" y="190">Input</tspan>
                <tspan x="350" y="210">Output</tspan>
            </text>
            <text
                font-family="monospace"
                font-size="24"
                font-weight="norm"
                stroke-width="1"
                style="fill:#0000ff;stroke:#0000ff;stroke-width:1">
                <tspan x="150" y="260">Ib</tspan>
                <tspan x="330" y="140">Ie</tspan>
                <tspan x="330" y="280">Ic</tspan>
                <tspan x="200" y="100">Icb</tspan>
                <tspan x="200" y="320">Ibe</tspan>
            </text>
            <path
                d="m 130,230 h 70"
                style="fill:none;stroke:#0000ff;stroke-width:2;marker-start:url(#arrow_head);marker-end:url(#arrow_head)">
            </path>
            <path
                d="m 310,80 c 0,100 30,100 90,100"
                style="fill:none;stroke:#0000ff;stroke-width:2;marker-end:url(#arrow_head)">
            </path>
            <path
                d="m 400,230 c -70,0 -90,10 -90,90"
                style="fill:none;stroke:#0000ff;stroke-width:2;marker-end:url(#arrow_head)">
            </path>
            <path
                d="m 280,50 c 0,80 -60,70 -70,70"
                style="fill:none;stroke:#0000ff;stroke-width:2;marker-end:url(#arrow_head)">
            </path>
            <path
                d="m 205,280 c 80,0 70,60 70,90"
                style="fill:none;stroke:#0000ff;stroke-width:2;marker-end:url(#arrow_head)">
            </path>
        </g>
    </defs>
    <g
        id="page1">
        <g
            id="layer1"
            style="display:inline">
            <rect
                x="0"
                y="0"
                width="800"
                height="600"
                fill="white">
            </rect>
        </g>
        <g
            id="layer2"
            style="display:inline">
            <use xlink:href="#headline" x="180" y="50"></use>
            <use xlink:href="#circuit" x="50" y="250" transform="scale(0.75)"></use>
            <use xlink:href="#bottom_line" x="100" y="540"></use>
            <use xlink:href="#coordinate_system" x="400" y="100"></use>
            <use xlink:href="#voltage_wave" x="451" y="400" transform="scale(1,0.5)"></use>
            <text
                font-family="Ubuntu"
                font-size="14"
                font-weight="bold"
                fill="#000000">
                <tspan x="430" y="115">Input</tspan>
                <tspan x="500" y="170">+/- 0.5v</tspan>
            </text>
            <use xlink:href="#coordinate_system" x="400" y="300"></use>
            <use xlink:href="#reference_wave" x="451" y="800" transform="scale(1,0.5)"></use>
            <use xlink:href="#voltage_wave" x="451" y="-400" transform="scale(1,-1)"></use>
            <text
                font-family="Ubuntu"
                font-size="14"
                font-weight="bold"
                fill="#000000">
                <tspan x="425" y="315">Output</tspan>
            </text>
            <text
                font-family="Ubuntu"
                font-size="14"
                font-weight="bold"
                fill="#000000">
                <tspan x="500" y="340">+/- 1v</tspan>
                <tspan x="710" y="340">PNP</tspan>
                <tspan x="660" y="470">NPN</tspan>
            </text>
        </g> <!--layer2-->
    </g> <!--page1-->
</svg>