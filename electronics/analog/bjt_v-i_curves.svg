<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    id="svg1"
    version="1.1"
    viewBox="0 0 800 600"
    width="800"
    height="600"
    preserveAspectRatio="xMidYMid"
    fill-rule="evenodd"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:svg="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <text
            id="headline"
            font-family="Ubuntu"
            font-size="30"
            font-weight="bold"
            fill="#0000ff">
            <tspan x="60" y="0">BJT NPN I-V Curve - Active, Non-Linear</tspan>
        </text>
        <text
            id="bottom_line"
            font-family="Ubuntu"
            font-size="22"
            font-weight="bold"
            fill="#000000">
            <tspan x="0" y="0">Cutoff</tspan>
            <tspan x="80" y="50">Active</tspan>
            <tspan x="200" y="0">Saturation</tspan>
        </text>
        <marker
            id="arrow_head"
            style="overflow:visible"
            viewBox="0 0 4 6"
            markerWidth="4"
            markerHeight="6"
            refX="left"
            refY="center"
            orient="auto-start-reverse"
            preserveAspectRatio="xMidYMid">
            <path
                style="fill:none;stroke:context-stroke;stroke-width:1;stroke-linecap:butt"
                d="M -3,-3 L 0,0 L -3,3">
            </path>
        </marker>
        <g
            id="coordinate_system">
            <path
                d="m 0,450 h 700"
                style="fill:none;stroke:#000000;stroke-width:3;stroke-opacity:1;marker-start:url(#arrow_head);marker-end:url(#arrow_head)">
            </path>
            <path
                d="m 100,50 v 500"
                style="fill:none;stroke:#000000;stroke-width:3;stroke-opacity:1;marker-end:url(#arrow_head);marker-start:url(#arrow_head)">
            </path>
            <text
                x="705"
                y="458"
                font-family="monospace"
                font-size="22"
                font-weight="norm"
                fill="#ff00ff">
                <tspan>Vbe</tspan>
            </text>
            <text
                x="90"
                y="45"
                font-family="monospace"
                font-size="22"
                font-weight="norm"
                fill="#ff00ff">
                <tspan>Ic</tspan>
            </text>
        </g>
        <g
            id="curves"
            style="fill:none;stroke:#0000ff;stroke-width:2.5;stroke-opacity:1">
            <g>
                <path d="m 0,0 l 75,-7"></path>
                <path d="m 75,-7 c 10,-2 12,-4 14,-14 l 50,-300"></path>
                <path d="m 139,-320 c 2,-13 4,-15 10,-16 h 260"></path>
                <path d="m 132,-280 c 2,-13 4,-15 10,-16 h 267"></path>
                <path d="m 125.5,-240 c 2,-13 4,-15 10,-16 h 275"></path>
                <path d="m 119,-200 c 2,-13 4,-15 10,-16 h 280"></path>
                <path d="m 112,-160 c 2,-13 4,-15 10,-16 h 287"></path>
                <path d="m 105.5,-120 c 2,-13 4,-15 10,-16 h 295"></path>
                <path d="m 99,-80 c 2,-13 4,-15 10,-16 h 300"></path>
                <path d="m 92,-40 c 2,-13 4,-15 10,-16 h 307"></path>
            </g>
            <g
                style="fill:#ff00ff;stroke:#ff00ff;stroke-width:1;font-family:monospace;font-size:18;font-weight:norm">
                <text x="420" y="-330">
                    <tspan>Ib=200μA</tspan>
                </text>
                <text x="420" y="-290">
                    <tspan>Ib=180μA</tspan>
                </text>
                <text x="420" y="-250">
                    <tspan>Ib=160μA</tspan>
                </text>
                <text x="420" y="-210">
                    <tspan>Ib=140μA</tspan>
                </text>
                <text x="420" y="-170">
                    <tspan>Ib=120μA</tspan>
                </text>
                <text x="420" y="-130">
                    <tspan>Ib=100μA</tspan>
                </text>
                <text x="420" y="-90">
                    <tspan>Ib=80μA</tspan>
                </text>
                <text x="420" y="-50">
                    <tspan>Ib=60μA</tspan>
                </text>
            </g>
        </g>
        <path
            id="guide"
            style="fill:none;stroke:#ff7f00;stroke-width:2;stroke-opacity:1;stroke-dasharray 2 2"
            d="m 0,0 v -450">
        </path>
    </defs>
    <g
        id="page1">
        <g
            id="layer1"
            style="display:inline">
            <rect
                x="0"
                y="0"
                width="800"
                height="600"
                fill="white">
            </rect>
        </g> <!--layer1-->
        <g
            id="layer2"
            style="display:inline">
            <use xlink:href="#headline" x="80" y="45"></use>
            <use xlink:href="#bottom_line" x="160" y="530"></use>
            <use xlink:href="#coordinate_system" x="50" y="40"></use>
            <use xlink:href="#curves" x="150" y="488"></use>
            <use xlink:href="#guide" x="240" y="550"></use>
            <use xlink:href="#guide" x="290" y="550"></use>
            <use xlink:href="#guide" x="550" y="550"></use>
        </g> <!--layer2-->
    </g> <!--page1-->
</svg>