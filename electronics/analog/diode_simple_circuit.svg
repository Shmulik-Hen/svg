<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    id="svg1"
    version="1.1"
    viewBox="0 0 800 600"
    width="800"
    height="600"
    preserveAspectRatio="xMidYMid"
    fill-rule="evenodd"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:svg="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <marker
            id="arrow_head"
            style="overflow:visible"
            viewBox="0 0 4 6"
            markerWidth="4"
            markerHeight="6"
            refX="left"
            refY="center"
            orient="auto-start-reverse"
            preserveAspectRatio="xMidYMid">
            <path
                style="fill:none;stroke:context-stroke;stroke-width:1;stroke-linecap:butt"
                d="M -3,-3 L 0,0 L -3,3">
            </path>
        </marker>
        <text
            id="headline"
            font-family="Ubuntu"
            font-size="32"
            font-weight="bold"
            fill="#0000ff">
            <tspan>Simple Circuit - Rectifier</tspan>
        </text>
        <g
            id="coordinate_system">
            <path
                d="M 25,100 H 375"
                style="fill:none;stroke:#000000;stroke-width:1.5;stroke-opacity:1;marker-end:url(#arrow_head)">
            </path>
            <path
                d="M 50,20 V 180"
                style="fill:none;stroke:#000000;stroke-width:1.5;stroke-opacity:1;marker-end:url(#arrow_head);marker-start:url(#arrow_head)">
            </path>
            <text
                x="380"
                y="105"
                font-family="Ubuntu"
                font-size="14"
                font-weight="bold"
                fill="#000000">
                <tspan>T</tspan>
            </text>
            <text
                x="10"
                y="105"
                font-family="Ubuntu"
                font-size="14"
                font-weight="bold"
                fill="#000000">
                <tspan>0</tspan>
            </text>
        </g><!-- coordinate_system -->
        <path
            id="voltage_wave"
            d="m 0,0
               c 20 -70, 30 -70, 50 0
               s 30 70, 50 0
               s 30 -70, 50 0
               s 30 70, 50 0
               s 30 -70, 50 0
               s 30 70, 50 0"
            style="fill:none;stroke:#000000;stroke-width:3;stroke-opacity:1">
        </path>
        <path
            id="reference_wave"
            d="m 0,0
                 c 20 -70, 30 -70, 50 0
                 s 30 70, 50 0
                 s 30 -70, 50 0
                 s 30 70, 50 0
                 s 30 -70, 50 0
                 s 30 70, 50 0"
            style="fill:none;stroke:#000000;stroke-width:1;stroke-opacity:1;stroke-dasharray:3, 3">
        </path>
        <path
            id="reference_wave2"
            d="m 0,0
               c 20 -70, 30 -70, 50 0
               c 20 -70, 30 -70, 50 0
               c 20 -70, 30 -70, 50 0
               c 20 -70, 30 -70, 50 0
               c 20 -70, 30 -70, 50 0
               c 20 -70, 30 -70, 50 0"
            style="fill:none;stroke:#000000;stroke-width:1;stroke-opacity:1;stroke-dasharray:3, 3">
        </path>
        <path
            id="average_dc"
            d="m 0,0 h 320"
            style="fill:none;stroke:#0080a0;stroke-width:3;stroke-opacity:1;stroke-dasharray:3, 2">
        </path>
        <path
            id="rectified_wave"
            d="m 0,0
               c 20 -70, 30 -70, 50 0
               c 20 -70, 30 -70, 50 0
               c 20 -70, 30 -70, 50 0
               c 20 -70, 30 -70, 50 0
               c 20 -70, 30 -70, 50 0
               c 20 -70, 30 -70, 50 0"
            style="fill:none;stroke:#000000;stroke-width:3;stroke-opacity:1">
        </path>
        <path
            id="regulated_wave"
            d="m -1,-50  l 18,3
               q 5 -9, 12 -5.5 m -1.4,-0.5 l 40,6
               q 5 -9, 12 -5.5 m -1.4,-0.5 l 40,6
               q 5 -9, 12 -5.5 m -1.4,-0.5 l 40,6
               q 5 -9, 12 -5.5 m -1.4,-0.5 l 40,6
               q 5 -9, 12 -5.5 m -1.4,-0.5 l 40,6
               q 5 -9, 12 -5.5 m -1.4,-0.5 l 40,6"
            style="fill:none;stroke:#000000;stroke-width:3;stroke-opacity:1">
        </path>
        <g
            id="diode_symbol">
            <path d="m 0,-19 v 38 m 3,-19 l 30,-15 v 30 z"></path>
        </g>
        <path
            id="resistor_symbol"
            d="m 0,0 h 15
               l 2,-10 l 4,20 l 4,-20 l 4,20
               l 4,-20 l 4,20 l 4,-20 l 4,20
               l 4,-20 l 4,20 l 2,-10 h 15"
            transform="rotate(90) scale(1.2,1.2)"
            style="fill:none;stroke:#000000;stroke-width:3;stroke-opacity:1">
        </path>
        <path
            id="capacitor_symbol"
            d="m 0,0 v 20 h -20 h 40 m -20,10 h -20 h 40 m -20,0 v 20">
        </path>
        <circle
            id="contact_point"
            cx="0"
            cy="0"
            r="5">
        </circle>
        <g
            id="diode_bridge">
            <path
                d="m 0,0 l 47,47 m 25,25 l 47,47 l -47,47 m -25,25
                   l -47,47 l -47,-47 m -25,-25 l -47,-47 l 47,-47
                   m 25,-25 l 47,-47">
            </path>
            <use xlink:href="#diode_symbol" x="78" y="70" transform="rotate(-135,75,72)"></use>
            <use xlink:href="#diode_symbol" x="70" y="163" transform="rotate(135,70,165)"></use>
            <use xlink:href="#diode_symbol" x="-42" y="193" transform="rotate(-135,-45,193)"></use>
            <use xlink:href="#diode_symbol" x="-48" y="44" transform="rotate(135,-48,46)"></use>
            <use xlink:href="#contact_point" x="-118" y="119"></use>
            <use xlink:href="#contact_point" x="118" y="119"></use>
        </g>
        <g
            id="transformer">
            <use xlink:href="#contact_point" x="-35" y="30"></use>
            <use xlink:href="#contact_point" x="-35" y="120"></use>
            <path d="m -32,30 h 30"></path>
            <path d="m -32,120 h 30"></path>
            <rect x="0" y="0" width="50" height="150"></rect>
            <path d="m 48,30 h 34"></path>
            <path d="m 48,120 h 34"></path>
        </g>
        <path
            id="jumper"
            d="m 0,0 a 10 10 0 0 1 20 0">
        </path>
        <g
            id="wire">
            <path d="m -3,117.5 v -107.5"></path>
            <path d="m -3,202.5 v 112.5"></path>
            <use xlink:href="#contact_point" x="-3" y="3"></use>
            <use xlink:href="#contact_point" x="-3" y="322"></use>
            <path d="m 0,3 h 27 m 84,0 h 22 v 80 m 0,162 v 78 h -132"></path>
            <path d="m 216,159 v -170 m 0,24 h 36"></path>
            <use xlink:href="#contact_point" x="216" y="-14"></use>
            <path d="m 336,13 h 25 v 125"></path>
            <path d="m 50,165 v 140 h 75 m 15,0 h 221 v -120.5"></path>
            <use xlink:href="#jumper" x="122.5" y="306"></use>
            <!-- <use xlink:href="#jumper" x="150.5" y="55" transform="rotate(90,155,55)"></use> -->
            <path d="m 361,13 h 25"></path>
            <path d="m 361,305 h 25"></path>
            <use xlink:href="#contact_point" x="389" y="13"></use>
            <use xlink:href="#contact_point" x="389" y="305"></use>
            <path d="m 389,308 v 25 m -30,0 h 60 m -50,10 h 42 m -34,10 h 28"></path>
        </g>
        <g
            id="circuit"
            style="fill:none;stroke:#000000;stroke-width:5;stroke-opacity:1">
            <use xlink:href="#wire" x="0" y="0"></use>
            <use xlink:href="#diode_bridge" x="190" y="115" transform="scale(0.7)"></use>
            <use xlink:href="#resistor_symbol" x="27" y="3" transform="rotate(-90,27,3)"></use>
            <use xlink:href="#resistor_symbol" x="252" y="13" transform="rotate(-90,252,13)"></use>
            <use xlink:href="#capacitor_symbol" x="361" y="137"></use>
            <use xlink:href="#transformer" x="-85" y="85"></use>
            <text
                font-family="Ubuntu"
                font-size="22"
                font-weight="bold"
                fill="#000000"
                stroke-width="1">
                <tspan x="-160" y="95">Vwall</tspan>
                <tspan x="-17" y="-10">Vin</tspan>
                <tspan x="200" y="-28">Vdc</tspan>
                <tspan x="365" y="-2">Vout</tspan>
            </text>
        </g>
    </defs>
    <g
        id="page1">
        <g
            id="layer1"
            style="display:inline">
            <rect
                x="0"
                y="0"
                width="800"
                height="600"
                fill="white">
            </rect>
        </g>
        <g
            id="layer2"
            style="display:inline">
            <use xlink:href="#headline" x="30" y="50"></use>
            <use xlink:href="#circuit" x="180" y="300" transform="scale(0.65)"></use>
            <use xlink:href="#coordinate_system" x="400" y="20"></use>
            <text
                font-family="Ubuntu"
                font-size="14"
                font-weight="bold"
                fill="#000000">
                <tspan x="440" y="35">Vin</tspan>
                <tspan x="500" y="75">12v AC</tspan>
            </text>
            <text
                font-family="Ubuntu"
                font-size="14"
                font-weight="bold"
                fill="#0080a0">
                <tspan x="690" y="65">average DC=0%</tspan>
            </text>
            <use xlink:href="#voltage_wave" x="451" y="120"></use>
            <use xlink:href="#average_dc" x="451" y="118"></use>
            <use xlink:href="#coordinate_system" x="400" y="210"></use>
            <text
                font-family="Ubuntu"
                font-size="14"
                font-weight="bold"
                fill="#000000">
                <tspan x="440" y="225">Vdc</tspan>
            </text>
            <text
                font-family="Ubuntu"
                font-size="14"
                font-weight="bold"
                fill="#0080a0">
                <tspan x="690" y="250">average DC=50%</tspan>
            </text>
            <use xlink:href="#reference_wave" x="451" y="310"></use>
            <use xlink:href="#rectified_wave" x="451" y="310"></use>
            <use xlink:href="#average_dc" x="451" y="285"></use>
            <use xlink:href="#coordinate_system" x="400" y="400"></use>
            <text
                font-family="Ubuntu"
                font-size="14"
                font-weight="bold"
                fill="#000000">
                <tspan x="440" y="415">Vout</tspan>
            </text>
            <text
                font-family="Ubuntu"
                font-size="14"
                font-weight="bold"
                fill="#0080a0">
                <tspan x="690" y="430">average DC=80%</tspan>
            </text>
            <use xlink:href="#reference_wave2" x="451" y="500"></use>
            <use xlink:href="#regulated_wave" x="451" y="500"></use>
            <use xlink:href="#average_dc" x="451" y="452"></use>
            <text
                font-family="Ubuntu"
                font-size="14"
                font-weight="bold"
                fill="#000000">
                <tspan x="5" y="350">220v AC</tspan>
            </text>
        </g>
    </g> <!--page1-->
</svg>