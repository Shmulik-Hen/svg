<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    id="svg1"
    version="1.1"
    viewBox="0 0 800 600"
    width="800"
    height="600"
    preserveAspectRatio="xMidYMid"
    fill-rule="evenodd"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:svg="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <marker
            id="arrow_head"
            style="overflow:visible"
            viewBox="0 0 4 6"
            markerWidth="4"
            markerHeight="6"
            refX="left"
            refY="center"
            orient="auto-start-reverse"
            preserveAspectRatio="xMidYMid">
            <path
                style="fill:none;stroke:context-stroke;stroke-width:1;stroke-linecap:butt"
                d="M -3,-3 L 0,0 L -3,3">
            </path>
        </marker>
        <text
            id="headline"
            font-family="Ubuntu"
            font-size="32"
            font-weight="bold"
            fill="#0000ff">
            <tspan>Zener Diode Circuit</tspan>
        </text>
        <text
            id="bottom_line"
            font-family="Ubuntu"
            font-size="32"
            font-weight="bold"
            fill="#000000">
            <tspan>Example: Vz = 3.6v</tspan>
        </text>
        <g
            id="zener_symbol"
            style="fill:none;stroke:#000000;stroke-opacity:1">
            <path d="m 0,0 l 30,-30 h 80 l 30,-30 m -70,32 l 70,120 h -140 z"></path>
        </g>
        <path
            id="resistor_symbol"
            d="m 0,0 h 15
               l 2,-10 l 4,20 l 4,-20 l 4,20
               l 4,-20 l 4,20 l 4,-20 l 4,20
               l 4,-20 l 4,20 l 2,-10 h 15"
            style="fill:none;stroke:#000000;stroke-width:3;stroke-opacity:1">
        </path>
        <circle
            id="contact_point"
            cx="0"
            cy="0"
            r="5">
        </circle>
        <path
            id="gnd"
            d="m 0,0 v 20 m -30,0 h 60 m -50,10 h 40 m -30,10 h 20">
        </path>
        <g
            id="ps">
            <path
                d="m -30,0 h 60 m -50,10 h 40">
            </path>
            <text
                font-family="Ubuntu"
                font-size="36"
                font-weight="norm"
                fill="#000000"
                stroke-width="1">
                <tspan x="-30" y="-15">+</tspan>
                <tspan x="-30" y="20">_</tspan>
            </text>
        </g>
        <g
            id="circuit">
            <g
                style="fill:none;stroke:#000000;stroke-width:7;stroke-opacity:1">
                <path d="m 0,0 h 400 m 0,410 h -400"></path>
                <path d="m 0,0 v 200 m 0,10 v 202.5"></path>
                <use xlink:href="#ps" x="" y="200"></use>
                <use xlink:href="#contact_point" x="407" y="0"></use>
                <use xlink:href="#contact_point" x="407" y="410"></use>
                <use xlink:href="#gnd" x="407" y="417"></use>
                <path d="m 200,0 v 50 m 0,80 v 150 m 0,49 v 80"></path>
                <use xlink:href="#resistor_symbol" x="40" y="-167" transform="rotate(90) scale(1.2,1.2)"></use>
                <use xlink:href="#zener_symbol" x="430" y="730" stroke-width="12" transform="scale(0.4)"></use>
                <path d="m 200,200 h 200"></path>
                <use xlink:href="#contact_point" x="407" y="200"></use>
            </g>
        </g>
        <g>
            <path
                id="current"
                d="m 0,0 l 100,0"
                style="fill:none;stroke:#ff00ff;stroke-width:3;stroke-opacity:1;marker-end:url(#arrow_head)">
            </path>
        </g>
    </defs>
    <g
        id="page1">
        <g
            id="layer1"
            style="display:inline">
            <rect
                x="0"
                y="0"
                width="800"
                height="600"
                fill="white">
            </rect>
        </g>
        <g
            id="layer2"
            style="display:inline">
            <use xlink:href="#headline" x="250" y="50"></use>
            <use xlink:href="#bottom_line" x="50" y="500"></use>
            <use xlink:href="#zener_symbol" stroke-width="7" x="100" y="270"></use>
            <use xlink:href="#circuit" x="600" y="230" transform="scale(0.7)"></use>
            <use xlink:href="#current" x="580" y="290"></use>
            <use xlink:href="#current" x="580" y="170" transform="rotate(90,580,170)"></use>
            <use xlink:href="#current" x="590" y="320" transform="rotate(90,590,320)"></use>
            <text
                font-family="Ubuntu"
                font-size="20"
                font-weight="norm"
                fill="#000000"
                stroke-width="1"
                style="fill:none;stroke:#000000;stroke-width:1">
                <tspan x="140" y="400">Anode</tspan>
                <tspan x="130" y="210">Cathode</tspan>
            </text>
            <text
                font-family="Ubuntu"
                font-size="20"
                font-weight="norm"
                fill="#000000"
                stroke-width="1"
                style="fill:none;stroke:#000000;stroke-width:1">
                <tspan x="680" y="280">Vout = 3.6v</tspan>
                <tspan x="680" y="380">Load</tspan>
            </text>
            <text
                font-family="monospace"
                font-size="20"
                font-weight="bold"
                fill="#ff00ff">
                <tspan x="610" y="280">Iout</tspan>
            </text>
            <text
                font-family="monospace"
                font-size="20"
                font-weight="bold"
                fill="#ff00ff">
                <tspan x="590" y="220">Itotal</tspan>
            </text>
            <text
                font-family="monospace"
                font-size="20"
                font-weight="bold"
                fill="#ff00ff">
                <tspan x="600" y="380">Iz</tspan>
            </text>
            <text
                font-family="monospace"
                font-size="24"
                font-weight="bold"
                fill="#000000">
                <tspan x="450" y="530">Iout = Itotal - Iz</tspan>
            </text>
        </g> <!--layer2-->
    </g> <!--page1-->
</svg>