<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    id="svg1"
    version="1.1"
    viewBox="0 0 800 600"
    width="800"
    height="600"
    preserveAspectRatio="xMidYMid"
    fill-rule="evenodd"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:svg="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
    </defs>
    <g
        id="page1">
        <g
            id="layer1"
            style="display:inline">
            <rect
                id="white_background"
                x="0"
                y="0"
                width="800"
                height="600"
                fill="white">
            </rect>
        </g> <!--layer1-->
        <g
            id="layer2"
            style="display:inline">
            <text
                font-family="Ubuntu"
                font-size="36"
                font-weight="bold"
                fill="#0000ff">
                <tspan x="30" y="60">Basic terms in Semi-Conductors (5)</tspan>
            </text>
            <text
                font-family="Ubuntu"
                font-size="29"
                font-weight="norm"
                fill="#0060a0">
                <tspan x="30" y="110" font-weight="bold">Diffusion</tspan>
                <tspan x="30" y="140">Due to the proximity of the two majority carrier types,</tspan>
                <tspan x="30" y="170">electrons from the N-side diffuse into the P-side, while</tspan>
                <tspan x="30" y="200">holes from the P-side diffuse into the N-side, creating</tspan>
                <tspan x="30" y="230">a concentration gradient. This leaves behind immobile</tspan>
                <tspan x="30" y="260">ions at the junction, locked in the lattice. The N-side is</tspan>
                <tspan x="30" y="290">left with a layer of positive ions, and the P-side is left</tspan>
                <tspan x="30" y="320">with a layer of negative ions. Since this area is void of</tspan>
                <tspan x="30" y="350">any charge carriers, it creates the</tspan>
                <tspan x="467" y="350" font-weight="bold">Depletion Region.</tspan>
                <tspan x="30" y="420" font-weight="bold">Potential Barrier</tspan>
                <tspan x="30" y="450">The fixed positive and negative ions on opposite sides of</tspan>
                <tspan x="30" y="480">the depletion region, create an internal electric field</tspan>
                <tspan x="30" y="510">pointing from the P-side to the N-side. This electric field</tspan>
                <tspan x="30" y="540">creates a potential difference, which opposes any further</tspan>
                <tspan x="30" y="570">diffusion of charge carriers.</tspan>
            </text>
        </g> <!--layer2-->
    </g> <!--page1-->
</svg>