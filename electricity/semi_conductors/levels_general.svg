<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    id="svg1"
    version="1.1"
    viewBox="0 0 800 600"
    width="800"
    height="600"
    preserveAspectRatio="xMidYMid"
    fill-rule="evenodd"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:svg="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <text
            id="headline"
            font-family="Ubuntu"
            font-size="28"
            font-weight="bold"
            fill="#000000">
            <tspan>Conduction - General</tspan>
        </text>
        <text
            id="cond_label"
            font-family="Ubuntu"
            font-size="20"
            font-weight="bold"
            fill="#000000">
            <tspan>Conduction band (3d)</tspan>
        </text>
        <text
            id="val_label"
            font-family="Ubuntu"
            font-size="20"
            font-weight="bold"
            fill="#000000">
            <tspan>Valence band (4s)</tspan>
        </text>
        <text
            id="gap_label"
            font-family="Ubuntu"
            font-size="20"
            font-weight="bold"
            fill="#000000">
            <tspan>Band gap</tspan>
        </text>
        <circle
            id="orbit"
            cx="0"
            cy="0"
            r="2000">
        </circle>
        <g
            id="conduction_band"
            style="fill:none;stroke:#ff0000;stroke-width:1">
            <use xlink:href="#orbit" x="400" y="00"></use>
            <use xlink:href="#orbit" x="400" y="05"></use>
            <use xlink:href="#orbit" x="400" y="10"></use>
            <use xlink:href="#orbit" x="400" y="15"></use>
            <use xlink:href="#orbit" x="400" y="20"></use>
            <use xlink:href="#orbit" x="400" y="25"></use>
            <use xlink:href="#orbit" x="400" y="30"></use>
            <use xlink:href="#orbit" x="400" y="35"></use>
            <use xlink:href="#orbit" x="400" y="40"></use>
            <use xlink:href="#orbit" x="400" y="45"></use>
            <use xlink:href="#orbit" x="400" y="50"></use>
            <use xlink:href="#orbit" x="400" y="55"></use>
            <use xlink:href="#orbit" x="400" y="60"></use>
            <use xlink:href="#orbit" x="400" y="65"></use>
            <use xlink:href="#orbit" x="400" y="70"></use>
            <use xlink:href="#orbit" x="400" y="75"></use>
            <use xlink:href="#orbit" x="400" y="80"></use>
            <use xlink:href="#orbit" x="400" y="85"></use>
            <use xlink:href="#orbit" x="400" y="90"></use>
            <use xlink:href="#orbit" x="400" y="95"></use>
        </g>
        <g
            id="valence_band"
            style="fill:none;stroke:#0000ff;stroke-width:1">
            <use xlink:href="#orbit" x="400" y="00"></use>
            <use xlink:href="#orbit" x="400" y="05"></use>
            <use xlink:href="#orbit" x="400" y="10"></use>
            <use xlink:href="#orbit" x="400" y="15"></use>
            <use xlink:href="#orbit" x="400" y="20"></use>
            <use xlink:href="#orbit" x="400" y="25"></use>
            <use xlink:href="#orbit" x="400" y="30"></use>
            <use xlink:href="#orbit" x="400" y="35"></use>
            <use xlink:href="#orbit" x="400" y="40"></use>
            <use xlink:href="#orbit" x="400" y="45"></use>
            <use xlink:href="#orbit" x="400" y="50"></use>
            <use xlink:href="#orbit" x="400" y="55"></use>
            <use xlink:href="#orbit" x="400" y="60"></use>
            <use xlink:href="#orbit" x="400" y="65"></use>
            <use xlink:href="#orbit" x="400" y="70"></use>
            <use xlink:href="#orbit" x="400" y="75"></use>
            <use xlink:href="#orbit" x="400" y="80"></use>
            <use xlink:href="#orbit" x="400" y="85"></use>
            <use xlink:href="#orbit" x="400" y="40"></use>
            <use xlink:href="#orbit" x="400" y="45"></use>
        </g>
        <g
            id="gap_size"
            style="fill:none;stroke:#000000;stroke-width:1">
            <path d="m 0,0 v 90 m -10,-90 h 20 m -20,90 h 20"></path>
        </g>
    </defs>
    <g
        id="page1">
        <g
            id="band1"
            style="display:inline">
            <rect
                id="white_background"
                x="0"
                y="0"
                width="800"
                height="600"
                fill="white">
            </rect>
        </g> <!--band1-->
        <g
            id="band2"
            style="display:inline">
            <use xlink:href="#headline" x="250" y="40"></use>
            <use xlink:href="#cond_label" x="290" y="95"></use>
            <use xlink:href="#gap_label" x="410" y="250"></use>
            <use xlink:href="#val_label" x="320" y="420"></use>
            <use xlink:href="#gap_size" x="400" y="203"></use>
            <use xlink:href="#conduction_band" y="2100"></use>
            <use xlink:href="#valence_band" y="2300"></use>
        </g> <!--band2-->
    </g> <!--page1-->
</svg>