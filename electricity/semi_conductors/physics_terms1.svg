<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    id="svg1"
    version="1.1"
    viewBox="0 0 800 600"
    width="800"
    height="600"
    preserveAspectRatio="xMidYMid"
    fill-rule="evenodd"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:svg="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
    </defs>
    <g
        id="page1">
        <g
            id="layer1"
            style="display:inline">
            <rect
                id="white_background"
                x="0"
                y="0"
                width="800"
                height="600"
                fill="white">
            </rect>
        </g> <!--layer1-->
        <g
            id="layer2"
            style="display:inline">
            <text
                font-family="Ubuntu"
                font-size="36"
                font-weight="bold"
                fill="#0000ff">
                <tspan x="30" y="60">Basic terms in Semi-Conductors (1)</tspan>
            </text>
            <text
                font-family="Ubuntu"
                font-size="29"
                font-weight="norm"
                fill="#0060a0">
                <tspan x="30" y="110" font-weight="bold">Intrinsic</tspan>
                <tspan x="30" y="140">Elements or compounds that can conduct electricity</tspan>
                <tspan x="30" y="170">without adding impurities. The conduction is low,</tspan>
                <tspan x="30" y="200">but it does exist.</tspan>
                <tspan x="30" y="230">Examples:</tspan>
                <tspan x="50" y="260">Gray tin (Sn), Gallium arsenide (GaAs),</tspan>
                <tspan x="50" y="290">Indium antimonide (InSb) and Boron arsenide (BAs).</tspan>
                <tspan x="30" y="335" font-weight="bold">Extrinsic</tspan>
                <tspan x="30" y="365">Elements or compounds that cannot conduct electricity</tspan>
                <tspan x="30" y="395">without adding impurities from outside.</tspan>
                <tspan x="30" y="425">Examples:</tspan>
                <tspan x="50" y="455">Silicon (Si) and Germanium (Ge)</tspan>
            </text>
        </g> <!--layer2-->
    </g> <!--page1-->
</svg>