<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    id="svg1"
    version="1.1"
    viewBox="0 0 800 600"
    width="800"
    height="600"
    preserveAspectRatio="xMidYMid"
    fill-rule="evenodd"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:svg="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
    </defs>
    <g
        id="page1">
        <g
            id="layer1"
            style="display:inline">
            <rect
                id="white_background"
                x="0"
                y="0"
                width="800"
                height="600"
                fill="white">
            </rect>
        </g> <!--layer1-->
        <g
            id="layer2"
            style="display:inline">
            <text
                font-family="Ubuntu"
                font-size="36"
                font-weight="bold"
                fill="#0000ff">
                <tspan x="30" y="60">Basic terms in Semi-Conductors (4)</tspan>
            </text>
            <text
                font-family="Ubuntu"
                font-size="29"
                font-weight="norm"
                fill="#0060a0">
                <tspan x="30" y="110" font-weight="bold">Holes (cont.)</tspan>
                <tspan x="30" y="140">They also appear to "move" through the lattice.</tspan>
                <tspan x="30" y="170">They are similar to Ions by being positively charged,</tspan>
                <tspan x="30" y="200">but not exactly the same.</tspan>
                <tspan x="30" y="240" font-weight="bold">Majority charge carriers</tspan>
                <tspan x="30" y="270">Carriers that participate in the main current conduction.</tspan>
                <tspan x="30" y="300">In N-type semiconductors, the majority carriers are</tspan>
                <tspan x="30" y="330">Electrons in P-type zone, Holes in N-type zone.</tspan>
                <tspan x="30" y="360">Usually around 10-20µA.</tspan>
                <tspan x="30" y="400" font-weight="bold">Minority charge carriers</tspan>
                <tspan x="30" y="430">Carriers that exist in the doped zones, but don't </tspan>
                <tspan x="30" y="460">participate in the main current conduction.</tspan>
                <tspan x="30" y="490">Electrons in N-type zone, Holes in P-type zone.</tspan>
                <tspan x="30" y="520">They contribute to leakage currents that are caused by.</tspan>
                <tspan x="30" y="550">thermal energy.</tspan>
                <tspan x="30" y="580">Between few pA to few nA (close to negligible).</tspan>
            </text>
        </g> <!--layer2-->
    </g> <!--page1-->
</svg>