<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    id="svg1"
    version="1.1"
    viewBox="0 0 800 600"
    width="800"
    height="600"
    preserveAspectRatio="xMidYMid"
    fill-rule="evenodd"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:svg="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
    </defs>
    <g
        id="page1">
        <g
            id="layer1"
            style="display:inline">
            <rect
                id="white_background"
                x="0"
                y="0"
                width="800"
                height="600"
                fill="white">
            </rect>
        </g> <!--layer1-->
        <g
            id="layer2"
            style="display:inline">
            <text
                font-family="Ubuntu"
                font-size="48"
                font-weight="bold"
                fill="#0000ff">
                <tspan x="280" y="160">Electricity</tspan>
            </text>
            <text
                font-family="Ubuntu"
                font-size="30"
                font-weight="norm"
                fill="#0060a0">
                <tspan x="60" y="240">Often compared to water flowing through a pipe,</tspan>
                <tspan x="60" y="280">where the</tspan>
                <tspan x="200" y="280" font-weight="bold">Voltage</tspan>
                <tspan x="320" y="280">acts as the</tspan>
                <tspan x="470" y="280" font-weight="bold">Water Pressure</tspan>
                <tspan x="685" y="280">,</tspan>
                <tspan x="60" y="320">the</tspan>
                <tspan x="110" y="320" font-weight="bold">Current</tspan>
                <tspan x="225" y="320">is the</tspan>
                <tspan x="305" y="320" font-weight="bold">Flow of water</tspan>
                <tspan x="495" y="320">,</tspan>
                <tspan x="60" y="360">and the</tspan>
                <tspan x="170" y="360" font-weight="bold">Conductance</tspan>
                <tspan x="360" y="360">is the</tspan>
                <tspan x="440" y="360" font-weight="bold">Size</tspan>
                <tspan x="505" y="360">of the pipe.</tspan>
            </text>
        </g> <!--layer2-->
    </g> <!--page1-->
</svg>