<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    id="svg1"
    version="1.1"
    viewBox="0 0 800 600"
    width="800"
    height="600"
    preserveAspectRatio="xMidYMid"
    fill-rule="evenodd"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:svg="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <path
            id="divider"
            d="m 0,40 v 600"
            style="fill:none;stroke:#000000;stroke-width:5;stroke-opacity:1;stroke-dasharray:5,5">
        </path>
        <g
            id="headline">
            <text
                font-family="Ubuntu"
                font-size="28"
                font-weight="bold"
                fill="#000000">
                <tspan x="0" y="0">Analogy: Switch </tspan>
            </text>
            <text
                font-family="Ubuntu"
                font-size="28"
                font-weight="bold"
                fill="#000000">
                <tspan x="220" y="0">=</tspan>
            </text>
            <text
                font-family="Ubuntu"
                font-size="28"
                font-weight="bold"
                fill="#000000">
                <tspan x="250" y="0">Water tap</tspan>
            </text>
        </g>
        <text
            id="pipe_text"
            font-family="Ubuntu"
            font-size="24"
            font-weight="bold"
            fill="#000000">
            <tspan>Pipe</tspan>
        </text>
        <text
            id="tap_text"
            font-family="Ubuntu"
            font-size="24"
            font-weight="bold"
            fill="#000000">
            <tspan>Tap</tspan>
        </text>
        <text
            id="wire_text"
            font-family="Ubuntu"
            font-size="24"
            font-weight="bold"
            fill="#000000">
            <tspan>Wire</tspan>
        </text>
        <text
            id="switch_text"
            font-family="Ubuntu"
            font-size="24"
            font-weight="bold"
            fill="#000000">
            <tspan>Switch</tspan>
        </text>
        <text
            id="bulb_text"
            font-family="Ubuntu"
            font-size="24"
            font-weight="bold"
            fill="#000000">
            <tspan>Bulb</tspan>
        </text>
        <g
            id="pipe">
            <path
                d="m 0,0 v 220"
                style="fill:none;stroke:#000000;stroke-width:5;stroke-opacity:1">
            </path>
            <path
                d="m 150,0 v 220"
                style="fill:none;stroke:#000000;stroke-width:5;stroke-opacity:1">
            </path>
        </g>
        <polyline
            id="water"
            points="2.5,0 147.5,0 147.5,220 2.5,220"
            style="fill:#0000ff;fill-opacity:0.4;stroke:none">
        </polyline>
        <g
            id="full_pipe_top">
            <use xlink:href="#pipe"></use>
            <use xlink:href="#water"></use>
        </g>
        <g
            id="full_pipe_bottom">
            <use xlink:href="#pipe"></use>
            <use id="water_bottom_anim" xlink:href="#water" visibility="visible">
                <animate
                    id="water_anim_1"
                    attributeName="visibility"
                    from="visible"
                    to="hidden"
                    begin="tap_2_anim.end"
                    dur="0.1s"
                    fill="freeze">
                </animate>
                <animate
                    id="water_anim_2"
                    attributeName="visibility"
                    from="hidden"
                    to="visible"
                    begin="tap_1_anim_2.end"
                    dur="0.1s"
                    fill="freeze">
                </animate>
            </use>
        </g>
        <g
            id="tap_open">
            <circle
                opacity="0.5"
                id="seal"
                cx="35"
                cy="30"
                r="72"
                style="fill:#7f7f7f;fill-opacity:1;stroke:none">
            </circle>
            <path
                id="axis"
                d="m 105,29 h 70"
                style="fill:none;stroke:#7f7f7f;stroke-width:10;stroke-opacity:1">
            </path>
            <circle
                id="handle"
                cx="177"
                cy="30"
                r="20"
                style="fill:#7f7f7f;fill-opacity:1;stroke:none">
            </circle>
        </g>
        <g
            id="tap_closed">
            <path
                id="seal"
                d="m 0,0 h 144"
                style="fill:none;stroke:#7f7f7f;stroke-width:15;stroke-opacity:1">
            </path>
            <path
                id="axis"
                d="m 144,0 h 70"
                style="fill:none;stroke:#7f7f7f;stroke-width:10;stroke-opacity:1">
            </path>
            <path
                id="handle"
                d="m 214,-72.5 v 150 m -20,0 h 40 m 0,-150 h -40"
                style="fill:none;stroke:#7f7f7f;stroke-width:7;stroke-opacity:1">
            </path>
        </g>
        <path
            id="circuit"
            d="m 0,0 v 110 m 0,60 v 110 m 0,60 v 110"
            style="fill:none;stroke:#000000;stroke-width:5;stroke-opacity:1">
        </path>
        <circle
            id="contact_point"
            cx="0"
            cy="0"
            r="5"
            style="fill:none;stroke:#000000;stroke-width:5;stroke-opacity:1">
        </circle>
        <path
            id="contact_wire"
            d="m 0,0 l 0,40"
            style="fill:none;stroke:#000000;stroke-width:5;stroke-opacity:1">
        </path>
        <g
            id="contact">
            <use xlink:href="#contact_wire" x="0" y="0"></use>
            <use xlink:href="#contact_point" x="0" y="45"></use>
        </g>
        <g
            id="switch_closed">
            <use xlink:href="#contact_point" x="0" y="0"></use>
            <use xlink:href="#contact_point" x="0" y="50"></use>
            <use xlink:href="#contact" x="0" y="5"></use>
        </g>
        <g
            id="switch_open">
            <use xlink:href="#contact_point" x="0" y="0"></use>
            <use xlink:href="#contact_point" x="0" y="50"></use>
            <use xlink:href="#contact" x="0" y="5" transform="rotate(-45)"></use>
        </g>
        <circle
            id="bulb_shape"
            cx="0"
            cy="0"
            r="30"
            style="fill:none;stroke:#000000;stroke-width:5;stroke-opacity:1">
        </circle>
        <circle
            id="bulb_light"
            cx="0"
            cy="0"
            r="40"
            style="fill:#e4f40b;fill-opacity:1;stroke:none">
        </circle>
        <path
            id="bulb_line"
            d="m 0,0 l 60,0"
            style="fill:none;stroke:#000000;stroke-width:5;stroke-opacity:1">
        </path>
        <g
            id="bulb_on">
            <use xlink:href="#bulb_light" x="0" y="0"></use>
            <use xlink:href="#bulb_shape" x="0" y="0"></use>
            <use xlink:href="#bulb_line" x="-30" y="0" transform="rotate(45)"></use>
            <use xlink:href="#bulb_line" x="-30" y="0" transform="rotate(-45)"></use>
        </g>
        <g
            id="bulb_off">
            <use xlink:href="#bulb_shape" x="0" y="0"></use>
            <use xlink:href="#bulb_line" x="-30" y="0" transform="rotate(45)"></use>
            <use xlink:href="#bulb_line" x="-30" y="0" transform="rotate(-45)"></use>
        </g>
        <circle
            id="button"
            cx="0"
            cy="0"
            r="20"
            style="fill:none;stroke:#000000;stroke-width:2;stroke-opacity:1">
        </circle>
        <g
            id="button_on">
            <use xlink:href="#button" x="0" y="0"></use>
            <text
                font-family="Ubuntu"
                font-size="20"
                font-weight="bold"
                fill="#000000">
                <tspan x="-13" y="6">On</tspan>
            </text>
        </g>
        <g
            id="button_off">
            <use xlink:href="#button" x="0" y="0"></use>
            <text
                font-family="Ubuntu"
                font-size="20"
                font-weight="bold"
                fill="#000000">
                <tspan x="-17" y="6">Off</tspan>
            </text>
        </g>
    </defs>
    <g
        id="page1">
        <g
            id="layer1"
            style="display:inline">
            <rect
                id="white_background"
                x="0"
                y="0"
                width="800"
                height="600"
                fill="white">
            </rect>
        </g>
        <g
            id="layer2"
            style="display:inline">
            <use xlink:href="#divider" x="400"></use>
            <use xlink:href="#headline" x="170" y="30"></use>
            <use xlink:href="#pipe_text" x="110" y="70"></use>
            <use xlink:href="#tap_text" x="330" y="300"></use>
            <use xlink:href="#wire_text" x="570" y="70"></use>
            <use xlink:href="#switch_text" x="500" y="240"></use>
            <use xlink:href="#bulb_text" x="500" y="420"></use>
            <use xlink:href="#full_pipe_top" x="90" y="80"></use>
            <use xlink:href="#full_pipe_bottom" x="90" y="300"></use>
            <use xlink:href="#circuit" x="600" y="100"></use>
            <use xlink:href="#button_on" x="700" y="40"></use>
            <use xlink:href="#button_off" x="750" y="40"></use>
            <use id="tap_off" xlink:href="#tap_closed" x="93" y="300" visibility="visible">
                <animate
                    id="tap_off_anim_on"
                    attributeName="visibility"
                    from="visible"
                    to="hidden"
                    begin="button_on.click"
                    dur="0.01s"
                    fill="freeze">
                </animate>
                <animate
                    id="tap_off_anim_off"
                    attributeName="visibility"
                    from="hidden"
                    to="visible"
                    begin="button_off.click"
                    dur="0.01s"
                    fill="freeze">
                </animate>
            </use>
            <use id="tap_on" xlink:href="#tap_open" x="130" y="271" visibility="hidden">
                <animate
                    id="tap_on_anim_on"
                    attributeName="visibility"
                    from="hidden"
                    to="visible"
                    begin="tap_off_anim_on.end"
                    dur="0.01s"
                    fill="freeze">
                </animate>
                <animate
                    id="tap_on_anim_off"
                    attributeName="visibility"
                    from="visible"
                    to="hidden"
                    begin="tap_off_anim_off.end"
                    dur="0.01s"
                    fill="freeze">
                </animate>
            </use>
            <use xlink:href="#switch_open" x="600" y="215" visibility="visible">
                <animate
                    id="switch_open_anim_on"
                    attributeName="visibility"
                    from="visible"
                    to="hidden"
                    begin="tap_on_anim_on.end"
                    dur="0.01s"
                    fill="freeze">
                </animate>
                <animate
                    id="switch_open_anim_off"
                    attributeName="visibility"
                    from="hidden"
                    to="visible"
                    begin="tap_on_anim_off.end"
                    dur="0.01s"
                    fill="freeze">
                </animate>
            </use>
            <use xlink:href="#switch_closed" x="600" y="215" visibility="hidden">
                <animate
                    id="switch_closed_anim_on"
                    attributeName="visibility"
                    from="hidden"
                    to="visible"
                    begin="switch_open_anim_on.end"
                    dur="0.01s"
                    fill="freeze">
                </animate>
                <animate
                    id="switch_closed_anim_off"
                    attributeName="visibility"
                    from="visible"
                    to="hidden"
                    begin="switch_open_anim_off.end"
                    dur="0.01s"
                    fill="freeze">
                </animate>
            </use>
            <use xlink:href="#bulb_off" x="600" y="410" visibility="visible">
                <animate
                    id="bulb_off_anim_on"
                    attributeName="visibility"
                    from="visible"
                    to="hidden"
                    begin="switch_closed_anim_on.end"
                    dur="0.01s"
                    fill="freeze">
                </animate>
                <animate
                    id="bulb_off_anim_off"
                    attributeName="visibility"
                    from="hidden"
                    to="visible"
                    begin="switch_closed_anim_off.end"
                    dur="0.01s"
                    fill="freeze">
                </animate>
            </use>
            <use xlink:href="#bulb_on" x="600" y="410" visibility="hidden">
                <animate
                    id="bulb_on_anim_on"
                    attributeName="visibility"
                    from="hidden"
                    to="visible"
                    begin="bulb_off_anim_on.end"
                    dur="0.01s"
                    fill="freeze">
                </animate>
                <animate
                    id="bulb_on_anim_off"
                    attributeName="visibility"
                    from="visible"
                    to="hidden"
                    begin="bulb_off_anim_off.end"
                    dur="0.01s"
                    fill="freeze">
                </animate>
            </use>
        </g> <!--layer2-->
    </g> <!--page1-->
</svg>