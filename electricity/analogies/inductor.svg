<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    id="svg1"
    version="1.1"
    viewBox="0 0 800 600"
    width="800"
    height="600"
    preserveAspectRatio="xMidYMid"
    fill-rule="evenodd"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:svg="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <path
            id="divider"
            d="m 0,40 v 600"
            style="fill:none;stroke:#000000;stroke-width:5;stroke-opacity:1;stroke-dasharray:5,5">
        </path>
        <g
            id="headline">
            <text
                font-family="Ubuntu"
                font-size="28"
                font-weight="bold"
                fill="#000000">
                <tspan x="0" y="0">Analogy: Inductor </tspan>
            </text>
            <text
                font-family="Ubuntu"
                font-size="28"
                font-weight="bold"
                fill="#000000">
                <tspan x="255" y="0">=</tspan>
            </text>
            <text
                font-family="Ubuntu"
                font-size="28"
                font-weight="bold"
                fill="#000000">
                <tspan x="280" y="0">Paddle wheel</tspan>
            </text>
        </g>
        <text
            id="pipe_text"
            font-family="Ubuntu"
            font-size="24"
            font-weight="bold"
            fill="#000000">
            <tspan>Pipe</tspan>
        </text>
        <text
            id="wheel_text"
            font-family="Ubuntu"
            font-size="24"
            font-weight="bold"
            fill="#000000">
            <tspan>Paddle</tspan>
            <tspan x="0" y="25">Wheel</tspan>
        </text>
        <text
            id="wire_text"
            font-family="Ubuntu"
            font-size="24"
            font-weight="bold"
            fill="#000000">
            <tspan>Wire</tspan>
        </text>
        <text
            id="inductor_text"
            font-family="Ubuntu"
            font-size="24"
            font-weight="bold"
            fill="#000000">
            <tspan>Inductor</tspan>
        </text>
        <text
            id="bulb_text"
            font-family="Ubuntu"
            font-size="24"
            font-weight="bold"
            fill="#000000">
            <tspan>Bulb</tspan>
        </text>
        <text
            id="waves_text"
            font-family="Ubuntu"
            font-size="24"
            font-weight="bold"
            fill="#000000">
            <tspan>Pressure</tspan>
            <tspan x="0" y="25">Waves</tspan>
        </text>
        <g
            id="pipe">
            <path
                d="m 0,0 v 220"
                style="fill:none;stroke:#000000;stroke-width:5;stroke-opacity:1">
            </path>
            <path
                d="m 150,0 v 220"
                style="fill:none;stroke:#000000;stroke-width:5;stroke-opacity:1">
            </path>
        </g>
        <polyline
            id="water"
            points="2.5,0 147.5,0 147.5,220 2.5,220"
            style="fill:#0000ff;fill-opacity:1;stroke:none">
        </polyline>
        <g
            id="full_pipe_top">
            <use xlink:href="#pipe"></use>
            <use xlink:href="#water" opacity="0.5"></use>
        </g>
        <g
            id="full_pipe_bottom"
            transform="scale(1,-1)">
            <use xlink:href="#pipe"></use>
            <use xlink:href="#water" opacity="0.5"></use>
        </g>
        <g
            id="paddle"
            style="fill:none;stroke:#754a3b;stroke-width:10;stroke-opacity:1;stroke-linecap:round">
            <path
                d="m 15,0 h 125">
            </path>
            <path
                d="m 140,0 l 10,-15 h 15 l 10,15"
                style="fill:none;stroke:#754a3b;stroke-width:10;stroke-opacity:1;stroke-linejoin:round">
            </path>
        </g>
        <g
            id="paddle_wheel"
            cx="0"
            cy="0"
            transform="scale(0.8,0.8)">
            <circle
                r="15"
                style="fill:#754a3b;fill-opacity:1;stroke:#000000;stroke-width:1;stroke-opacity:1">
            </circle>
            <circle
                r="90"
                style="fill:none;stroke:#754a3b;stroke-width:15;stroke-opacity:1">
            </circle>
            <use xlink:href="#paddle"></use>
            <use xlink:href="#paddle" transform="rotate(45)"></use>
            <use xlink:href="#paddle" transform="rotate(90)"></use>
            <use xlink:href="#paddle" transform="rotate(135)"></use>
            <use xlink:href="#paddle" transform="rotate(180)"></use>
            <use xlink:href="#paddle" transform="rotate(225)"></use>
            <use xlink:href="#paddle" transform="rotate(270)"></use>
            <use xlink:href="#paddle" transform="rotate(315)"></use>
        </g>
        <path
            id="wave"
            style="fill:#0000ff;fill-opacity:1;stroke:#000000;stroke-width:1;stroke-opacity:1"
            d="m 0,0 v 10 a 100,35 0 0 1 150,0 v -10 m -150,0 a 100,35 0 0 1 150,0"
            transform="scale(1,-1)">
        </path>
        <g
            id="waves">
            <use xlink:href="#wave" y="0"></use>
            <use xlink:href="#wave" y="25"></use>
            <use xlink:href="#wave" y="50"></use>
            <use xlink:href="#wave" y="75"></use>
            <use xlink:href="#wave" y="100"></use>
            <use xlink:href="#wave" x="75" y="600" opacity="0.3" transform="scale(0.5,0.5)"></use>
            <use xlink:href="#wave" x="75" y="650" opacity="0.3" transform="scale(0.5,0.5)"></use>
            <use xlink:href="#wave" x="75" y="700" opacity="0.3" transform="scale(0.5,0.5)"></use>
            <use xlink:href="#wave" x="75" y="750" opacity="0.3" transform="scale(0.5,0.5)"></use>
            <use xlink:href="#wave" x="75" y="800" opacity="0.3" transform="scale(0.5,0.5)"></use>
        </g>
        <path
            id="wire"
            d="m 0,0 v 90 m 0,100 v 90 m 0,60 v 110"
            style="fill:none;stroke:#000000;stroke-width:5;stroke-opacity:1">
        </path>
        <path
            id="wire"
            d="m 0,0 v 90 m 0,100 v 90 m 0,60 v 110"
            style="fill:none;stroke:#000000;stroke-width:5;stroke-opacity:1">
        </path>
        <circle
            id="contact_point"
            cx="0"
            cy="0"
            r="5"
            style="fill:none;stroke:#000000;stroke-width:5;stroke-opacity:1">
        </circle>
        <g
            id="circuit">
            <use xlink:href="#wire" x="0" y="0"></use>
            <use xlink:href="#contact_point" x="0" y="95"></use>
            <use xlink:href="#contact_point" x="0" y="185"></use>
        </g>
        <circle
            id="bulb_shape"
            cx="0"
            cy="0"
            r="30"
            style="fill:none;stroke:#000000;stroke-width:5;stroke-opacity:1">
        </circle>
        <circle
            id="bulb_light"
            cx="0"
            cy="0"
            r="40"
            style="fill:#e4f40b;fill-opacity:1;stroke:none">
        </circle>
        <path
            id="bulb_line"
            d="m 0,0 l 60,0"
            style="fill:none;stroke:#000000;stroke-width:5;stroke-opacity:1">
        </path>
        <g
            id="bulb">
            <use xlink:href="#bulb_shape" x="0" y="0"></use>
            <use xlink:href="#bulb_line" x="-30" y="0" transform="rotate(45)"></use>
            <use xlink:href="#bulb_line" x="-30" y="0" transform="rotate(-45)"></use>
        </g>
        <path
            id="symbol"
            d="m 0,0 h 15
               c 3 -12.5, 6 -12.5, 9 0
               c -1 12.5, -2 12.5, -3 0
               c 3 -12.5, 6 -12.5, 9 0
               c -1 12.5, -2 12.5, -3 0
               c 3 -12.5, 6 -12.5, 9 0
               c -1 12.5, -2 12.5, -3 0
               c 3 -12.5, 6 -12.5, 9 0
               c -1 12.5, -2 12.5, -3 0
               c 3 -12.5, 6 -12.5, 9 0
               c -1 12.5, -2 12.5, -3 0
               c 3 -12.5, 6 -12.5, 9 0
               c -1 12.5, -2 12.5, -3 0
               c 3 -12.5, 6 -12.5, 9 0
               h 10"
            transform="rotate(90) scale(1.2,1.2)"
            style="fill:none;stroke:#000000;stroke-width:2;stroke-opacity:1">
        </path>
        <text
            id="symbol_letter"
            font-family="Ubuntu"
            font-size="20"
            font-weight="bold"
            fill="#000000">
            <tspan>L</tspan>
        </text>
    </defs>
    <g
        id="page1">
        <g
            id="layer1"
            style="display:inline">
            <rect
                id="white_background"
                x="0"
                y="0"
                width="800"
                height="600"
                fill="white">
            </rect>
        </g>
        <g
            id="layer2"
            style="display:inline">
            <use xlink:href="#divider" x="400"></use>
            <use xlink:href="#headline" x="135" y="30"></use>
            <use xlink:href="#pipe_text" x="110" y="70"></use>
            <use xlink:href="#wheel_text" x="280" y="200"></use>
            <use xlink:href="#waves_text" x="240" y="110"></use>
            <use xlink:href="#wire_text" x="570" y="70"></use>
            <use xlink:href="#inductor_text" x="460" y="245"></use>
            <use xlink:href="#bulb_text" x="500" y="420"></use>
            <use xlink:href="#full_pipe_top" x="80" y="80"></use>
            <use xlink:href="#full_pipe_bottom" x="80" y="520"></use>
            <use xlink:href="#waves" x="80" y="100"></use>
            <use xlink:href="#paddle_wheel" x="230" y="300">
                <animateTransform
                    id="paddle_wheel_rotate_ccw"
                    attributeName="transform"
                    attributeType="XML"
                    type="rotate"
                    from="360 230 300"
                    to="0 230 300"
                    begin="0s"
                    dur="10s"
                    repeatCount="indefinite">
                </animateTransform>
            </use>
            <use xlink:href="#bulb" x="600" y="410"></use>
            <use xlink:href="#circuit" x="600" y="100"></use>
            <use xlink:href="#symbol" x="600" y="197"></use>
            <use xlink:href="#symbol_letter" x="625" y="245"></use>
        </g>
    </g> <!--page1-->
</svg>