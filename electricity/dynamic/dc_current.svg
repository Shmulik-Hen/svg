<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    id="svg1"
    version="1.1"
    viewBox="0 0 800 600"
    preserveAspectRatio="xMidYMid"
    fill-rule="evenodd"
    width="800"
    height="600"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:svg="http://www.w3.org/2000/svg">
    <g
        id="page1">
        <g
            id="layer1"
            style="display:inline">
            <rect
                id="white_background"
                x="0"
                y="0"
                width="800"
                height="600"
                fill="white">
            </rect>
            <!-- <path
                id="horiz guide"
                d="M 0,300 H 800"
                style="fill:none;stroke:#ff00ff;stroke-width:1;stroke-opacity:1">
            </path>
            <path
                id="vert guide"
                d="M 400,0 V 600"
                style="fill:none;stroke:#ff00ff;stroke-width:1;stroke-opacity:1">
            </path> -->
        </g>
        <g
            id="layer2"
            style="display:inline">
            <g
                id="wire">
                <text
                    id="wire_text"
                    x="30"
                    y="48"
                    font-family="Ubuntu"
                    font-size="25"
                    font-weight="bold"
                    fill="#000000">
                    <tspan>Wire</tspan>
                </text>
                <path
                    id="wire_horiz_top"
                    d="M 22.5,22.5 H 780.0"
                    style="fill:none;stroke:#000000;stroke-width:5.00001;stroke-miterlimit:4;stroke-dasharray:none;stroke-dashoffset:0;stroke-opacity:1">
                </path>
                <path
                    id="wire_horiz_bottom"
                    d="M 22.5,577.5 H 780.0"
                    style="fill:none;stroke:#000000;stroke-width:5.00001;stroke-miterlimit:4;stroke-dasharray:none;stroke-dashoffset:0;stroke-opacity:1">
                </path>
                <path
                    id="wire_vert_left_top"
                    d="M 25.0,25.0 V 290.5"
                    style="fill:#000080;fill-opacity:1;stroke:#000000;stroke-width:5;stroke-dasharray:none;stroke-dashoffset:0;stroke-opacity:1">
                </path>
                <path
                    id="wire_vert_left_bottom"
                    d="M 25.0,310.0 V 575.0"
                    style="fill:none;stroke:#000000;stroke-width:5;stroke-dasharray:none;stroke-dashoffset:0;stroke-opacity:1">
                </path>
                <path
                    id="wire_vert_right_top"
                    d="M 777.5,25.0 V 270.0"
                    style="fill:none;stroke:#000000;stroke-width:5;stroke-miterlimit:4;stroke-dasharray:none;stroke-dashoffset:0;stroke-opacity:1">
                </path>
                <path
                    id="wire_vert_right_bottom"
                    d="M 777.5,330.0 V 575.0"
                    style="display:inline;fill:none;stroke:#000000;stroke-width:5;stroke-miterlimit:4;stroke-dasharray:none;stroke-dashoffset:0;stroke-opacity:1">
                </path>
            </g> <!--wire-->
            <g
                id="load">
                <text
                    id="load_text"
                    x="710"
                    y="255"
                    font-family="Ubuntu"
                    font-size="25"
                    font-weight="bold"
                    fill="#000000">
                    <tspan>Load</tspan>
                </text>
                <rect
                    id="load_rect"
                    x="768.5"
                    y="270.0"
                    width="15"
                    height="60"
                    style="fill:none;stroke:#000000;stroke-width:3;stroke-dasharray:none;stroke-opacity:1">
                </rect>
            </g> <!--load-->
            <g
                id="power_source">
                <text
                    id="power_source_text"
                    x="30"
                    y="275"
                    font-family="Ubuntu"
                    font-size="25"
                    font-weight="bold"
                    fill="#000000">
                    <tspan>DC</tspan>
                </text>
                <path
                    id="cathode"
                    d="M 10.0,292.5 H 40.0"
                    style="fill:none;stroke:#000000;stroke-width:5;stroke-dasharray:none;stroke-dashoffset:0;stroke-opacity:1">
                </path>
                <path
                    id="anode"
                    d="M 15.0,307.5 H 35.0"
                    style="fill:none;stroke:#000000;stroke-width:5;stroke-dasharray:none;stroke-dashoffset:0;stroke-opacity:1">
                </path>
                <path
                    id="plus_horiz"
                    d="M 4.0,284.0 H 12.0"
                    style="fill:#000080;fill-opacity:1;stroke:#000000;stroke-width:2;stroke-dasharray:none;stroke-dashoffset:0;stroke-opacity:1">
                </path>
                <path
                    id="plus_vert"
                    d="M 8.0,280.0 V 288.0"
                    style="fill:#000080;fill-opacity:1;stroke:#000000;stroke-width:2;stroke-dasharray:none;stroke-dashoffset:0;stroke-opacity:1">
                </path>
                <path
                    id="minus"
                    d="M 4.0,316.0 H 12.0"
                    style="fill:#000080;fill-opacity:1;stroke:#000000;stroke-width:2;stroke-dasharray:none;stroke-dashoffset:0;stroke-opacity:1">
                </path>
            </g> <!--power_source-->
        </g> <!--layer2-->
        <g
            id="layer3"
            style="display:inline">
            <text
                id="neg_charge_carriers_text"
                font-family="Ubuntu"
                font-size="25"
                font-weight="bold"
                fill="#ff0000">
                <tspan x="240" y="150">Negative charge</tspan>
                <tspan x="240" y="170">carriers</tspan>
            </text>
            <circle
                id="neg_charge_carriers_circle"
                cx="400"
                cy="300"
                r="240"
                style="fill:none;stroke:#ff0000;stroke-opacity:1;stroke-width:3;stroke-dasharray:9, 9;stroke-dashoffset:0">
                <animateTransform
                    id="neg_charge_carriers_circle_rotate_ccw"
                    attributeName="transform"
                    attributeType="XML"
                    type="rotate"
                    from="360 400.0 300.0"
                    to="0 400.0 300.0"
                    begin="0s"
                    dur="20s"
                    repeatCount="indefinite">
                </animateTransform>
            </circle>
        </g> <!--layer3-->
        <g
            id="layer4"
            style="display:inline">
            <text
                id="pos_charge_carries_text"
                font-family="Ubuntu"
                font-size="25"
                font-weight="bold"
                fill="#0000ff">
                <tspan x="40" y="105">Positive charge</tspan>
                <tspan x="40" y="125">carriers</tspan>
            </text>
            <circle
                id="pos_charge_carries_circle"
                cx="400"
                cy="300"
                r="260"
                style="fill:none;stroke:#0000ff;stroke-opacity:1;stroke-width:3;stroke-dasharray:9, 9;stroke-dashoffset:0">
                <animateTransform
                    id="pos_charge_carries_rotate_cw"
                    attributeName="transform"
                    attributeType="XML"
                    type="rotate"
                    from="0 400.0 300.0"
                    to="360 400.0 300.0"
                    begin="0s"
                    dur="20s"
                    repeatCount="indefinite">
                </animateTransform>
            </circle>
        </g> <!--layer4-->
    </g> <!--page1-->
</svg>