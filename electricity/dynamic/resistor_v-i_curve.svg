<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    id="svg1"
    version="1.1"
    viewBox="0 0 800 600"
    width="800"
    height="600"
    preserveAspectRatio="xMidYMid"
    fill-rule="evenodd"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:svg="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <text
            id="headline"
            font-family="Ubuntu"
            font-size="30"
            font-weight="bold"
            fill="#0000ff">
            <tspan x="80" y="0">Resistor Characteristic Curve - Passive, Linear</tspan>
        </text>
        <marker
            id="arrow_head"
            style="overflow:visible"
            viewBox="0 0 4 6"
            markerWidth="4"
            markerHeight="6"
            refX="left"
            refY="center"
            orient="auto-start-reverse"
            preserveAspectRatio="xMidYMid">
            <path
                style="fill:none;stroke:context-stroke;stroke-width:1;stroke-linecap:butt"
                d="M -3,-3 L 0,0 L -3,3">
            </path>
        </marker>
        <g
            id="coordinate_system">
            <path
                d="m 0,300 h 700"
                style="fill:none;stroke:#000000;stroke-width:3;stroke-opacity:1;marker-start:url(#arrow_head);marker-end:url(#arrow_head)">
            </path>
            <path
                d="m 350,50 v 500"
                style="fill:none;stroke:#000000;stroke-width:3;stroke-opacity:1;marker-end:url(#arrow_head);marker-start:url(#arrow_head)">
            </path>
            <text
                x="700"
                y="307"
                font-family="monospace"
                font-size="22"
                font-weight="norm"
                fill="#ff00ff">
                <tspan>V</tspan>
            </text>
            <text
                x="343"
                y="45"
                font-family="monospace"
                font-size="22"
                font-weight="norm"
                fill="#ff00ff">
                <tspan>I</tspan>
            </text>
        </g>
        <path
            id="curve"
            d="m 0,0 l 400,-400"
            style="fill:none;stroke:#0000ff;stroke-width:2;stroke-opacity:1">
        </path>
    </defs>
    <g
        id="page1">
        <g
            id="layer1"
            style="display:inline">
            <rect
                x="0"
                y="0"
                width="800"
                height="600"
                fill="white">
            </rect>
        </g> <!--layer1-->
        <g
            id="layer2"
            style="display:inline">
            <use xlink:href="#headline" x="0" y="45"></use>
            <use xlink:href="#coordinate_system" x="50" y="40"></use>
            <use xlink:href="#curve" x="200" y="540"></use>
        </g> <!--layer2-->
    </g> <!--page1-->
</svg>