<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    id="svg1"
    version="1.1"
    viewBox="0 0 800 600"
    width="800"
    height="600"
    preserveAspectRatio="xMidYMid"
    fill-rule="evenodd"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:svg="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <text
            id="headline"
            font-family="Ubuntu"
            font-size="30"
            font-weight="bold"
            fill="#0000ff">
            <tspan x="0" y="0">Capacitor Characteristic Curve - Passive, Logarithimic</tspan>
        </text>
        <text
            id="headline2"
            font-family="Ubuntu"
            font-size="24"
            font-weight="bold"
            fill="#0000ff">
            <tspan x="0" y="0">Current leads Voltage</tspan>
        </text>
        <marker
            id="arrow_head"
            style="overflow:visible"
            viewBox="0 0 4 6"
            markerWidth="4"
            markerHeight="6"
            refX="left"
            refY="center"
            orient="auto-start-reverse"
            preserveAspectRatio="xMidYMid">
            <path
                style="fill:none;stroke:context-stroke;stroke-width:1;stroke-linecap:butt"
                d="M -3,-3 L 0,0 L -3,3">
            </path>
        </marker>
        <g
            id="coordinate_system">
            <path
                d="m 0,300 h 700"
                style="fill:none;stroke:#000000;stroke-width:3;stroke-opacity:1;marker-start:url(#arrow_head);marker-end:url(#arrow_head)">
            </path>
            <path
                d="m 350,50 v 500"
                style="fill:none;stroke:#000000;stroke-width:3;stroke-opacity:1;marker-end:url(#arrow_head);marker-start:url(#arrow_head)">
            </path>
            <text
                x="700"
                y="307"
                font-family="monospace"
                font-size="22"
                font-weight="norm"
                fill="#ff00ff">
                <tspan>V</tspan>
            </text>
            <text
                x="343"
                y="45"
                font-family="monospace"
                font-size="22"
                font-weight="norm"
                fill="#ff00ff">
                <tspan>I</tspan>
            </text>
        </g>
        <ellipse
            id="curve"
            cx="0"
            cy="0"
            rx="300"
            ry="150"
            style="fill:none;stroke:#0000ff;stroke-width:2;stroke-opacity:1">
        </ellipse>
        <circle
            id="point"
            cx="0"
            cy="0"
            r="7"
            style="fill:#ff0000;fill-opacity:1;stroke:none">
        </circle>
        <path
            id="direction"
            d="m 0,-1 l -10,-10 m 0,17 l 10,-10"
            style="fill:none;stroke:#ff0000;stroke-width:4;stroke-opacity:1">
        </path>
    </defs>
    <g
        id="page1">
        <g
            id="layer1"
            style="display:inline">
            <rect
                x="0"
                y="0"
                width="800"
                height="600"
                fill="white">
            </rect>
        </g> <!--layer1-->
        <g
            id="layer2"
            style="display:inline">
            <use xlink:href="#headline" x="15" y="40"></use>
            <use xlink:href="#headline2" x="40" y="100"></use>
            <use xlink:href="#coordinate_system" x="50" y="40"></use>
            <use xlink:href="#curve" x="400" y="340"></use>
            <use xlink:href="#point" x="400" y="190"></use>
            <use xlink:href="#direction" x="570" y="219" transform="rotate(18,570,219)"></use>
            <use xlink:href="#direction" x="570" y="461" transform="rotate(155,570,461)"></use>
            <use xlink:href="#direction" x="222" y="458" transform="rotate(197,222,458)"></use>
            <use xlink:href="#direction" x="222" y="222" transform="rotate(340,222,222)"></use>
            <text
                x="410"
                y="150"
                font-family="Ubuntu"
                font-size="22"
                font-weight="bold"
                fill="#000000">
                <tspan>Origin</tspan>
            </text>
            <text
                x="575"
                y="175"
                font-family="Ubuntu"
                font-size="22"
                font-weight="bold"
                fill="#000000">
                <tspan>Direction</tspan>
            </text>
            <path
                d="m 440,155 l -32,28"
                style="fill:none;stroke:#000000;stroke-width:1;stroke-opacity:1;marker-end:url(#arrow_head)">
            </path>
            <path
                d="m 620,177 l -50,32"
                style="fill:none;stroke:#000000;stroke-width:1;stroke-opacity:1;marker-end:url(#arrow_head)">
            </path>
        </g> <!--layer2-->
    </g> <!--page1-->
</svg>