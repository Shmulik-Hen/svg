<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    id="svg1"
    version="1.1"
    viewBox="0 0 800 600"
    width="800"
    height="600"
    preserveAspectRatio="xMidYMid"
    fill-rule="evenodd"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:svg="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <marker
            id="arrow_head"
            style="overflow:visible"
            viewBox="0 0 4 6"
            markerWidth="4"
            markerHeight="6"
            refX="left"
            refY="center"
            orient="auto-start-reverse"
            preserveAspectRatio="xMidYMid">
            <path
                style="fill:none;stroke:context-stroke;stroke-width:1;stroke-linecap:butt"
                d="M -3,-3 L 0,0 L -3,3"
                id="path5759">
            </path>
        </marker>
        <circle
            id="big_contact"
            cx="0" cy="0" r="4"
            style="fill:none;fill-opacity:1;stroke:#000000;stroke-width:1;stroke-opacity:1">
        </circle>
        <circle
            id="small_contact"
            cx="0" cy="0" r="2"
            style="fill:#000000;">
        </circle>
        <circle
            id="meter"
            cx="0" cy="0" r="20"
            style="fill:none;fill-opacity:1;stroke:#000000;stroke-width:1;stroke-opacity:1">
        </circle>
        <g
            id="coordinate_system">
            <path
                id="axis_x_line"
                d="M 25,100 H 375"
                style="fill:none;fill-opacity:1;stroke:#000000;stroke-width:1.5;stroke-opacity:1;marker-end:url(#arrow_head)">
            </path>
            <path
                id="axis_y_line"
                d="M 50,20 V 180"
                style="fill:none;fill-opacity:1;stroke:#000000;stroke-width:1.5;stroke-opacity:1;marker-end:url(#arrow_head);marker-start:url(#arrow_head)">
            </path>
            <text
                id="axis_x_text"
                x="25"
                y="115"
                font-family="Ubuntu"
                font-size="14"
                font-weight="norm"
                fill="#000000">
                <tspan>x</tspan>
            </text>
            <text
                id="axis_y_text"
                x="40"
                y="55"
                font-family="Ubuntu"
                font-size="14"
                font-weight="norm"
                fill="#000000">
                <tspan>y</tspan>
            </text>
            <text
                id="axis_x_unit"
                x="380"
                y="105"
                font-family="Ubuntu"
                font-size="14"
                font-weight="norm"
                fill="#000000">
                <tspan>T</tspan>
            </text>
            <text
                id="zero_value"
                x="10"
                y="105"
                font-family="Ubuntu"
                font-size="14"
                font-weight="norm"
                fill="#000000">
                <tspan>0</tspan>
            </text>
            <text
                id="plus_value"
                x="10"
                y="30"
                font-family="Ubuntu"
                font-size="14"
                font-weight="norm"
                fill="#000000">
                <tspan>+</tspan>
            </text>
            <text
                id="minus_value"
                x="10"
                y="180"
                font-family="Ubuntu"
                font-size="14"
                font-weight="norm"
                fill="#000000">
                <tspan>-</tspan>
            </text>
        </g><!-- coordinate_system -->
        <path
            id="reference_wave"
            d="m 1 0
               c 30 -70, 50 -70, 80 0
               s 50 70, 80 0
               s 50 -70, 80 0
               s 50 70, 80 0"
            style="fill:none;fill-opacity:1;stroke:#000000;stroke-width:1;stroke-opacity:1;stroke-dasharray:3, 3">
        </path>
        <g
            id="circuit_elements">
            <text
                id="load_text"
                x="200"
                y="200"
                font-family="Ubuntu"
                font-size="20"
                font-weight="norm"
                fill="#000000">
                <tspan>Load</tspan>
            </text>
            <rect
                id="load"
                x="262"
                y="164.5"
                width="25"
                height="75"
                style="fill:none;fill-opacity:1;stroke:#000000;stroke-width:1;stroke-opacity:1">
            </rect>
            <path
                id="conductors"
                d="M 4,100 h 85 m 70,0 h 115 v 65
                   m 0,75 v 50 h -115 m -40,0 h -115
                   M 55,100 v -50 h 50 m 40,0 h 50 v 50
                   M 275,125 h 50 v 50 m 0,40 v 50 h -50"
                style="fill:none;fill-opacity:1;stroke:#000000;stroke-width:1;stroke-opacity:1">
            </path> <!--conductors-->
            <g
                id="contact_points">
                <use xlink:href="#big_contact" x="0" y="100"></use>
                <use xlink:href="#big_contact" x="0" y="290"></use>
                <use xlink:href="#small_contact" x="55" y="100"></use>
                <use xlink:href="#small_contact" x="195" y="100"></use>
                <use xlink:href="#small_contact" x="274" y="125"></use>
                <use xlink:href="#small_contact" x="274" y="265"></use>
            </g> <!--contact_points-->
            <g
                id="meters">
                <use xlink:href="#meter" x="125" y="50"></use>
                <use xlink:href="#meter" x="325" y="195"></use>
                <use xlink:href="#meter" x="139" y="290"></use>
                <text
                    id="voltmeter1_letter"
                    x="118"
                    y="57"
                    font-family="Ubuntu"
                    font-size="20"
                    font-weight="norm"
                    fill="#0000ff">
                    <tspan>V</tspan>
                </text>
                <text
                    id="voltmeter2_letter"
                    x="318"
                    y="203"
                    font-family="Ubuntu"
                    font-size="20"
                    font-weight="norm"
                    fill="#00ff00">
                    <tspan>V</tspan>
                </text>
                <text
                    id="ampermeter_letter"
                    x="133"
                    y="296"
                    font-family="Ubuntu"
                    font-size="20"
                    font-weight="norm"
                    fill="#ff0000">
                    <tspan>A</tspan>
                </text>
            </g> <!--meters-->
        </g> <!--circuit_elements-->
    </defs>
    <g
        id="page1">
        <g
            id="layer1"
            style="display:inline">
            <rect
                id="white_background"
                x="0"
                y="0"
                width="800"
                height="600"
                fill="white">
            </rect>
            <path
                id="horiz guide 1"
                d="M 0,200 H 800"
                style="fill:none;fill-opacity:1;stroke:#ff00ff;stroke-width:1;stroke-opacity:1">
            </path>
            <path
                id="horiz guide 2"
                d="M 400,400 H 800"
                style="fill:none;fill-opacity:1;stroke:#ff00ff;stroke-width:1;stroke-opacity:1">
            </path>
            <path
                id="vert guide 1"
                d="M 400,0 V 600"
                style="fill:none;fill-opacity:1;stroke:#ff00ff;stroke-width:1;stroke-opacity:1">
            </path>
            <path
                id="vert guide 2"
                d="M 470,0 V 600"
                style="fill:none;fill-opacity:1;stroke:#ffc000;stroke-width:1;stroke-opacity:1">
            </path>
        </g> <!--layer1-->
        <g
            id="layer2"
            style="display:inline">
            <!-- Input Voltage -->
            <use xlink:href="#coordinate_system" x="0" y="0"></use>
            <text
                id="axis_y_unit"
                x="45"
                y="15"
                font-family="Ubuntu"
                font-size="14"
                font-weight="norm"
                fill="#000000">
                <tspan>V</tspan>
            </text>
        </g> <!--layer2-->
        <g
            id="layer3"
            style="display:inline">
            <!-- Element Voltage -->
            <use xlink:href="#coordinate_system" x="400" y="0"></use>
            <text
                id="axis_y_unit"
                x="445"
                y="15"
                font-family="Ubuntu"
                font-size="14"
                font-weight="norm"
                fill="#000000">
                <tspan>V</tspan>
            </text>
        </g> <!--layer3-->
        <g
            id="layer4"
            style="display:inline">
            <!-- Load voltage -->
            <use xlink:href="#coordinate_system" x="400" y="200"></use>
            <text
                id="axis_y_unit"
                x="445"
                y="215"
                font-family="Ubuntu"
                font-size="14"
                font-weight="norm"
                fill="#000000">
                <tspan>V</tspan>
            </text>
        </g> <!--layer4-->
        <g
            id="layer5"
            style="display:inline">
            <!-- Current -->
            <use xlink:href="#coordinate_system" x="400" y="400"></use>
            <text
                id="axis_y_unit"
                x="445"
                y="415"
                font-family="Ubuntu"
                font-size="14"
                font-weight="norm"
                fill="#000000">
                <tspan>A</tspan>
            </text>
        </g> <!--layer5-->
        <g
            id="layer6"
            style="display:inline">
            <!-- Input signal-->
            <text
                id="voltage_text"
                x="70"
                y="25"
                font-family="Ubuntu"
                font-size="14"
                font-weight="norm"
                fill="#000000">
                <tspan>Input</tspan>
            </text>
            <path
                id="voltage_wave"
                d="M 51,100
                   c 30 -70, 50 -70, 80 0
                   s 50 70, 80 0
                   s 50 -70, 80 0
                   s 50 70, 80 0"
                style="fill:none;fill-opacity:1;stroke:#000000;stroke-width:2;stroke-opacity:1">
            </path>
        </g> <!--layer6-->
        <g
            id="layer7"
            style="display:inline">
            <!-- Element Voltage -->
            <text
                id="voltage_text"
                x="470"
                y="25"
                font-family="Ubuntu"
                font-size="14"
                font-weight="norm"
                fill="#000000">
                <tspan>Capacitor</tspan>
            </text>
            <path
                id="voltage_wave"
                d="M 471,100
                   c 30 -40, 50 -40, 80 0
                   s 50 40, 80 0
                   s 50 -40, 80 0
                   s 50 40, 80 0"
                style="fill:none;fill-opacity:1;stroke:#0000ff;stroke-width:2;stroke-opacity:1">
            </path>
            <use xlink:href="#reference_wave" x="450" y="100"></use>
        </g> <!--layer7-->
        <g
            id="layer8"
            style="display:inline">
            <!-- Load voltage -->
            <text
                id="voltage_text"
                x="470"
                y="225"
                font-family="Ubuntu"
                font-size="14"
                font-weight="norm"
                fill="#000000">
                <tspan>Load</tspan>
            </text>
            <path
                id="voltage_wave"
                d="M 431,300
                   c 30 -40, 50 -40, 80 0
                   s 50 40, 80 0
                   s 50 -40, 80 0
                   s 50 40, 80 0"
                style="fill:none;fill-opacity:1;stroke:#00ff00;stroke-width:2;stroke-opacity:1">
            </path>
            <use xlink:href="#reference_wave" x="450" y="300"></use>
        </g> <!--layer8-->
        <g
            id="layer9"
            style="display:inline">
            <!-- Current -->
            <text
                id="current_text"
                x="470"
                y="425"
                font-family="Ubuntu"
                font-size="14"
                font-weight="norm"
                fill="#000000">
                <tspan>Current (scaled)</tspan>
            </text>
            <path
                id="current_wave"
                d="M 431,500
                   c 30 -65, 50 -65, 80 0
                   s 50 65, 80 0
                   s 50 -65, 80 0
                   s 50 65, 80 0"
                style="fill:none;fill-opacity:1;stroke:#ff0000;stroke-width:2;stroke-opacity:1">
            </path>
            <use xlink:href="#reference_wave" x="450" y="500"></use>
        </g> <!--layer9-->
        <g
            id="layer10"
            style="display:inline">
            <!-- Circuit -->
            <use xlink:href="#circuit_elements" x="30" y="250"></use>
            <text
                id="circuit_text"
                x="150"
                y="225"
                font-family="Ubuntu"
                font-size="20"
                font-weight="norm"
                fill="#000000">
                <tspan>Capacitor</tspan>
            </text>
            <path
                id="symbol"
                d="M 119,350 h 30 m 0,-10 v 20 m 10,-20 v 20 m 0,-10 h 30"
                style="fill:none;fill-opacity:1;stroke:#000000;stroke-width:1;stroke-opacity:1">
            </path> <!--symbol-->
            <text
                id="symbol_letter"
                x="147"
                y="380"
                font-family="Ubuntu"
                font-size="20"
                font-weight="norm"
                fill="#000000">
                <tspan>C</tspan>
            </text>
        </g> <!--layer10-->
    </g> <!--page1-->
</svg>