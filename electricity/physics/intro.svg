<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    id="svg1"
    version="1.1"
    viewBox="0 0 800 600"
    width="800"
    height="600"
    preserveAspectRatio="xMidYMid"
    fill-rule="evenodd"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:svg="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
    </defs>
    <g
        id="page1">
        <g
            id="layer1"
            style="display:inline">
            <rect
                id="white_background"
                x="0"
                y="0"
                width="800"
                height="600"
                fill="white">
            </rect>
        </g> <!--layer1-->
        <g
            id="layer2"
            style="display:inline">
            <text
                font-family="Ubuntu"
                font-size="40"
                font-weight="bold"
                fill="#0000ff">
                <tspan x="80" y="80">Basic physics behind Electricity</tspan>
            </text>
            <text
                font-family="Ubuntu"
                font-size="29"
                font-weight="norm"
                fill="#0060a0">
                <tspan x="30" y="130">Since ancient times, people wanted to understand</tspan>
                <tspan x="30" y="160">what materials are made of and why different</tspan>
                <tspan x="30" y="190">elements have different properties. At some point,</tspan>
                <tspan x="30" y="220">a concept of tiny particles called "atoms" was born,</tspan>
                <tspan x="30" y="250">which were supposed to contain the properties of</tspan>
                <tspan x="30" y="280">each element. The term "Atom" comes from the</tspan>
                <tspan x="30" y="310">greek word "a-tomus", meaning "Un-Cutable".</tspan>
                <tspan x="30" y="340">Over the years, different theories were devised to</tspan>
                <tspan x="30" y="370">try and explain what those atoms were, and how they</tspan>
                <tspan x="30" y="400">behave and interact.</tspan>
                <tspan x="30" y="430">Since the beginnig of the </tspan>
                <tspan x="360" y="430" font-weight="bold">Age of Enlightment</tspan>
                <tspan x="625" y="430">, more</tspan>
                <tspan x="30" y="460">and more scientists ran more and more experiments,</tspan>
                <tspan x="30" y="490">discovering the</tspan>
                <tspan x="235" y="490" font-weight="bold">Periodic table</tspan>
                <tspan x="425" y="490">, </tspan>
                <tspan x="435" y="490" font-weight="bold">Magnetism</tspan>
                <tspan x="585" y="490">, </tspan>
                <tspan x="600" y="490" font-weight="bold">Electricity</tspan>
                <tspan x="740" y="490">,</tspan>
                <tspan x="30" y="520">and the</tspan>
                <tspan x="135" y="520" font-weight="bold">Structure of Atoms</tspan>
                <tspan x="400" y="520">.</tspan>
            </text>
        </g> <!--layer2-->
    </g> <!--page1-->
</svg>