<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    id="svg1"
    version="1.1"
    viewBox="0 0 800 600"
    width="800"
    height="600"
    preserveAspectRatio="xMidYMid"
    fill-rule="evenodd"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:svg="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <text
            id="headline"
            font-family="Ubuntu"
            font-size="28"
            font-weight="bold"
            fill="#000000">
            <tspan>Conduction - Insulator</tspan>
        </text>
        <text
            id="cond_label"
            font-family="Ubuntu"
            font-size="20"
            font-weight="bold"
            fill="#000000">
            <tspan>Conduction band</tspan>
        </text>
        <text
            id="val_label"
            font-family="Ubuntu"
            font-size="20"
            font-weight="bold"
            fill="#000000">
            <tspan>Valence band</tspan>
        </text>
        <text
            id="gap_label"
            font-family="Ubuntu"
            font-size="20"
            font-weight="bold"
            fill="#000000">
            <tspan>Band gap</tspan>
        </text>
        <text
            id="fermi_label"
            font-family="Ubuntu"
            font-size="20"
            font-weight="bold"
            fill="#000000">
            <tspan>Fermi level (Fe)</tspan>
        </text>
        <circle
            id="orbit"
            cx="0"
            cy="0"
            r="2000">
        </circle>
        <g
            id="conduction_band"
            style="fill:none;stroke:#ff0000;stroke-width:1">
            <use xlink:href="#orbit" x="400" y="00"></use>
            <use xlink:href="#orbit" x="400" y="05"></use>
            <use xlink:href="#orbit" x="400" y="10"></use>
            <use xlink:href="#orbit" x="400" y="15"></use>
            <use xlink:href="#orbit" x="400" y="20"></use>
            <use xlink:href="#orbit" x="400" y="25"></use>
            <use xlink:href="#orbit" x="400" y="30"></use>
            <use xlink:href="#orbit" x="400" y="35"></use>
            <use xlink:href="#orbit" x="400" y="40"></use>
            <use xlink:href="#orbit" x="400" y="45"></use>
            <use xlink:href="#orbit" x="400" y="50"></use>
            <use xlink:href="#orbit" x="400" y="55"></use>
            <use xlink:href="#orbit" x="400" y="60"></use>
            <use xlink:href="#orbit" x="400" y="65"></use>
            <use xlink:href="#orbit" x="400" y="70"></use>
            <use xlink:href="#orbit" x="400" y="75"></use>
            <use xlink:href="#orbit" x="400" y="80"></use>
            <use xlink:href="#orbit" x="400" y="85"></use>
            <use xlink:href="#orbit" x="400" y="90"></use>
            <use xlink:href="#orbit" x="400" y="95"></use>
        </g>
        <g
            id="valence_band"
            style="fill:none;stroke:#0000ff;stroke-width:1">
            <use xlink:href="#orbit" x="400" y="00"></use>
            <use xlink:href="#orbit" x="400" y="05"></use>
            <use xlink:href="#orbit" x="400" y="10"></use>
            <use xlink:href="#orbit" x="400" y="15"></use>
            <use xlink:href="#orbit" x="400" y="20"></use>
            <use xlink:href="#orbit" x="400" y="25"></use>
            <use xlink:href="#orbit" x="400" y="30"></use>
            <use xlink:href="#orbit" x="400" y="35"></use>
            <use xlink:href="#orbit" x="400" y="40"></use>
            <use xlink:href="#orbit" x="400" y="45"></use>
            <use xlink:href="#orbit" x="400" y="50"></use>
            <use xlink:href="#orbit" x="400" y="55"></use>
            <use xlink:href="#orbit" x="400" y="60"></use>
            <use xlink:href="#orbit" x="400" y="65"></use>
            <use xlink:href="#orbit" x="400" y="70"></use>
            <use xlink:href="#orbit" x="400" y="75"></use>
            <use xlink:href="#orbit" x="400" y="80"></use>
            <use xlink:href="#orbit" x="400" y="85"></use>
            <use xlink:href="#orbit" x="400" y="40"></use>
            <use xlink:href="#orbit" x="400" y="45"></use>
        </g>
        <g
            id="fermi_level"
            style="fill:none;stroke:#000000;stroke-width:2">
            <use xlink:href="#orbit" x="400" y="00"></use>
        </g>
        <g
            id="gap_size"
            style="fill:none;stroke:#000000;stroke-width:1">
            <path d="m 0,0 v 240 m -10,-240 h 20 m -20,240 h 20"></path>
        </g>
    </defs>
    <g
        id="page1">
        <g
            id="band1"
            style="display:inline">
            <rect
                id="white_background"
                x="0"
                y="0"
                width="800"
                height="600"
                fill="white">
            </rect>
        </g> <!--band1-->
        <g
            id="band2"
            style="display:inline">
            <use xlink:href="#headline" x="220" y="40"></use>
            <use xlink:href="#cond_label" x="290" y="95"></use>
            <use xlink:href="#gap_label" x="400" y="350"></use>
            <use xlink:href="#val_label" x="320" y="560"></use>
            <use xlink:href="#fermi_label" x="120" y="320"></use>
            <use xlink:href="#gap_size" x="390" y="203"></use>
            <use xlink:href="#conduction_band" y="2100"></use>
            <use xlink:href="#valence_band" y="2450"></use>
            <use xlink:href="#fermi_level" y="2320"></use>
        </g> <!--band2-->
    </g> <!--page1-->
</svg>