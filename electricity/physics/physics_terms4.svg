<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    id="svg1"
    version="1.1"
    viewBox="0 0 800 600"
    width="800"
    height="600"
    preserveAspectRatio="xMidYMid"
    fill-rule="evenodd"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:svg="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
    </defs>
    <g
        id="page1">
        <g
            id="layer1"
            style="display:inline">
            <rect
                id="white_background"
                x="0"
                y="0"
                width="800"
                height="600"
                fill="white">
            </rect>
        </g> <!--layer1-->
        <g
            id="layer2"
            style="display:inline">
            <text
                font-family="Ubuntu"
                font-size="36"
                font-weight="bold"
                fill="#0000ff">
                <tspan x="30" y="60">Basic terms in Physics (4)</tspan>
            </text>
            <path d="M195 80 V570" stroke="#000000" stroke-width="2"></path>
            <path d="M310 80 V570" stroke="#000000" stroke-width="2"></path>
            <path d="M30 120 H770" stroke="#000000" stroke-width="2"></path>
            <path d="M30 245 H770" stroke="#000000" stroke-width="2"></path>
            <path d="M30 398 H770" stroke="#000000" stroke-width="2"></path>
            <text
                font-family="Ubuntu"
                font-size="29"
                font-weight="norm"
                fill="#0060a0">
                <tspan x="30" y="110" font-weight="bold">Term</tspan>
                <tspan x="200" y="110" font-weight="bold">Unit of</tspan>
                <tspan x="320" y="110" font-weight="bold">Description.</tspan>
                <tspan x="30" y="147">Electronvolt</tspan>
                <tspan x="200" y="147">Energy</tspan>
                <tspan x="320" y="147">The energy gained by an electron</tspan>
                <tspan x="320" y="177">accelerated through a potential</tspan>
                <tspan x="320" y="207">difference of 1V.</tspan>
                <tspan x="320" y="237">1eV=1.6⋅10⁻¹⁹ J.</tspan>
                <tspan x="30" y="272">Fermi level</tspan>
                <tspan x="200" y="272">Energy</tspan>
                <tspan x="320" y="272">Ef. The total energy required to</tspan>
                <tspan x="320" y="302">add or remove one electron to a</tspan>
                <tspan x="320" y="332">solid-state body (atom/molecule)</tspan>
                <tspan x="320" y="362">Calculated per element and</tspan>
                <tspan x="320" y="392">Measured in electronvolts (eV).</tspan>
            </text>
        </g> <!--layer2-->
    </g> <!--page1-->
</svg>