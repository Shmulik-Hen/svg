<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    id="svg1"
    version="1.1"
    viewBox="0 0 800 600"
    width="800"
    height="600"
    preserveAspectRatio="xMidYMid"
    fill-rule="evenodd"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:svg="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
    </defs>
    <g
        id="page1">
        <g
            id="layer1"
            style="display:inline">
            <rect
                id="white_background"
                x="0"
                y="0"
                width="800"
                height="600"
                fill="white">
            </rect>
        </g> <!--layer1-->
        <g
            id="layer2"
            style="display:inline">
            <text
                font-family="Ubuntu"
                font-size="36"
                font-weight="bold"
                fill="#0000ff">
                <tspan x="30" y="60">Basic terms in Physics (4)</tspan>
            </text>
            <text
                font-family="Ubuntu"
                font-size="29"
                font-weight="norm"
                fill="#0060a0">
                <tspan x="30" y="110" font-weight="bold">Electronvolt</tspan>
                <tspan x="30" y="140">eV. The energy gained by an electron accelerated through</tspan>
                <tspan x="30" y="170">a potential difference of 1V.</tspan>
                <tspan x="30" y="200">1eV=1.6⋅10⁻¹⁹ J.</tspan>
                <tspan x="30" y="235" font-weight="bold">Fermi level</tspan>
                <tspan x="30" y="265">Ef. The total energy required to add or remove one</tspan>
                <tspan x="30" y="295">electron to a solid-state body (atom/molecule).</tspan>
                <tspan x="30" y="325">Calculated per element and Measured in electronvolts.</tspan>
                <tspan x="30" y="360" font-weight="bold">Quantum numbers</tspan>
                <tspan x="30" y="390">A set of four numbers that describe the unique state of an</tspan>
                <tspan x="30" y="425">electron in an atom, specifying its energy level, the shape</tspan>
                <tspan x="30" y="455">of its orbital, its orientation in space, and its spin.</tspan>
                <tspan x="30" y="485">These numbers include the principal quantum number (n),</tspan>
                <tspan x="30" y="515">the angular quantum number (l), the magnetic quantum</tspan>
                <tspan x="30" y="545">number (mₗ), and the spin quantum number (mₛ).</tspan>
            </text>
        </g> <!--layer2-->
    </g> <!--page1-->
</svg>