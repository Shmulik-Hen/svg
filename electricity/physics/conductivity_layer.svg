<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    id="svg1"
    version="1.1"
    viewBox="0 0 800 600"
    width="800"
    height="600"
    preserveAspectRatio="xMidYMid"
    fill-rule="evenodd"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:svg="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <text
            id="headline"
            font-family="Ubuntu"
            font-size="28"
            font-weight="bold"
            fill="#000000">
            <tspan>Conductivity layer</tspan>
        </text>
        <text
            id="cond_label"
            font-family="Ubuntu"
            font-size="20"
            font-weight="bold"
            fill="#000000">
            <tspan>Conductivity band</tspan>
        </text>
        <text
            id="val_label"
            font-family="Ubuntu"
            font-size="20"
            font-weight="bold"
            fill="#000000">
            <tspan>Valence band</tspan>
        </text>
        <text
            id="gap_label"
            font-family="Ubuntu"
            font-size="20"
            font-weight="bold"
            fill="#000000">
            <tspan>Band gap</tspan>
        </text>
        <circle
            id="orbit"
            cx="0"
            cy="0"
            r="2000">
        </circle>
        <g
            id="conductivity_layer"
            style="fill:none;stroke:#ff0000;stroke-width:1">
            <use xlink:href="#orbit" x="400" y="2100"></use>
            <use xlink:href="#orbit" x="400" y="2105"></use>
            <use xlink:href="#orbit" x="400" y="2110"></use>
            <use xlink:href="#orbit" x="400" y="2115"></use>
            <use xlink:href="#orbit" x="400" y="2120"></use>
            <use xlink:href="#orbit" x="400" y="2125"></use>
            <use xlink:href="#orbit" x="400" y="2130"></use>
            <use xlink:href="#orbit" x="400" y="2135"></use>
            <use xlink:href="#orbit" x="400" y="2140"></use>
            <use xlink:href="#orbit" x="400" y="2145"></use>
        </g>
        <g
            id="valence_layer"
            style="fill:none;stroke:#0000ff;stroke-width:1">
            <use xlink:href="#orbit" x="400" y="2200"></use>
            <use xlink:href="#orbit" x="400" y="2205"></use>
            <use xlink:href="#orbit" x="400" y="2210"></use>
            <use xlink:href="#orbit" x="400" y="2215"></use>
            <use xlink:href="#orbit" x="400" y="2220"></use>
            <use xlink:href="#orbit" x="400" y="2225"></use>
            <use xlink:href="#orbit" x="400" y="2230"></use>
            <use xlink:href="#orbit" x="400" y="2235"></use>
            <use xlink:href="#orbit" x="400" y="2240"></use>
            <use xlink:href="#orbit" x="400" y="2245"></use>
        </g>
        <g
            id="gap_size"
            style="fill:none;stroke:#000000;stroke-width:1">
            <path d="m 0,0 v 45 m -5,-45 h 10 m -10,45 h 10"></path>
        </g>
    </defs>
    <g
        id="page1">
        <g
            id="layer1"
            style="display:inline">
            <rect
                id="white_background"
                x="0"
                y="0"
                width="800"
                height="600"
                fill="white">
            </rect>
        </g> <!--layer1-->
        <g
            id="layer2"
            style="display:inline">
            <use xlink:href="#headline" x="250" y="40"></use>
            <use xlink:href="#cond_label" x="290" y="95"></use>
            <use xlink:href="#val_label" x="320" y="270"></use>
            <use xlink:href="#gap_label" x="340" y="180"></use>
            <use xlink:href="#gap_size" x="330" y="152"></use>
            <use xlink:href="#conductivity_layer"></use>
            <use xlink:href="#valence_layer"></use>
        </g> <!--layer2-->
    </g> <!--page1-->
</svg>