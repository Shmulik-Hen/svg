<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    id="svg1"
    version="1.1"
    viewBox="0 0 800 600"
    width="800"
    height="600"
    preserveAspectRatio="xMidYMid"
    fill-rule="evenodd"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:svg="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
    </defs>
    <g
        id="page1">
        <g
            id="layer1"
            style="display:inline">
            <rect
                id="white_background"
                x="0"
                y="0"
                width="800"
                height="600"
                fill="white">
            </rect>
        </g> <!--layer1-->
        <g
            id="layer2"
            style="display:inline">
            <text
                font-family="Ubuntu"
                font-size="40"
                font-weight="bold"
                fill="#0000ff">
                <tspan x="80" y="80">Basic physics behind Electricity</tspan>
            </text>
            <text
                font-family="Ubuntu"
                font-size="29"
                font-weight="norm"
                fill="#0060a0">
                <tspan x="30" y="130">Since ancient times, people wanted to understand</tspan>
                <tspan x="30" y="160">what materials are made of and why different</tspan>
                <tspan x="30" y="190">elements have different properties. At some point,</tspan>
                <tspan x="30" y="220">a concept of tiny particles called "atoms" was born,</tspan>
                <tspan x="30" y="250">which were supposed to contain the properties of</tspan>
                <tspan x="30" y="280">each element. The term "Atom" comes from the</tspan>
                <tspan x="30" y="310">greek word "a-tomus", meaning "Un-Cutable".</tspan>

                <tspan x="30" y="350">Over the years, different theories were devised to</tspan>
                <tspan x="30" y="380">try and explain what those atoms were, and how they</tspan>
                <tspan x="30" y="410">behave and interact.</tspan>

                <tspan x="30" y="450">Up until the 17th century, the ruling science was</tspan>
                <tspan x="30" y="480">Alchemy, and the basic idea was that the Atoms were</tspan>
                <tspan x="30" y="510">simply tiny chunks of matter, made up of four elements: </tspan>
                <tspan x="30" y="540">Earth, Water, Air, and Fire, and that they didn't have</tspan>
                <tspan x="30" y="570">any internal structure.</tspan>

                <tspan x="670" y="590" font-size="22">continued.</tspan>
            </text>
        </g> <!--layer2-->
    </g> <!--page1-->
</svg>