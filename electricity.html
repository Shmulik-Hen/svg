<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Electricity</title>
        <style>
            :root { --pad: 18px; }
            html, body { height: 100%; margin: 0; font-family: system-ui, Arial, sans-serif; background:#0b0c10; color:#e8e8e8; }
            a { color: #79b8ff; }
            .screen { height: 100%; display: none; }
            .screen.active { display: flex; }
            #toc { flex-direction: column; padding: 2rem max(2rem, 6vw); gap: 1rem; overflow: auto; }
            #toc h1 { margin: 0 0 .5rem 0; font-size: clamp(1.4rem, 2.5vw, 2rem); }
            #toc p#hint { opacity: .7; font-size: .95rem; margin: 0 0 .75rem 0; }

            /* Collapsible numbered sections */
            details.section { border: 1px solid rgba(255,255,255,0.12); border-radius: .6rem; padding: .4rem .7rem; background: rgba(255,255,255,0.03); }
            details.section + details.section { margin-top: .7rem; }
            details.section[open] { background: rgba(255,255,255,0.05); }
            details.section summary { cursor: pointer; list-style: none; }
            details.section summary::-webkit-details-marker { display: none; }
            .section-title { display: flex; align-items: center; gap: .6rem; font-weight: 600; font-size: clamp(1.05rem, 1.8vw, 1.25rem); }
            .section-title .num { opacity: .8; }
            .chev { display:inline-block; transform: rotate(-90deg); transition: transform .18s ease; opacity:.85; }
            details[open] .chev { transform: rotate(0deg); }

            ol.slides { counter-reset: slide; list-style: none; margin: .4rem 0 .2rem 1.25rem; padding-left: 0; }
            ol.slides > li { counter-increment: slide; line-height: 1.9; }
            ol.slides > li a { text-decoration: none; }
            ol.slides > li a .num { opacity: .8; margin-right: .4rem; }

            #viewer { flex-direction: column; min-height: 0; }
            #stageWrap { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
            #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: var(--pad); box-sizing: border-box; }
            #mediaHost { width: 100%; height: 100%; display: contents; }

            #controls { display: flex; gap: .5rem; padding: .5rem; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.04); border-top: 1px solid rgba(255,255,255,0.08); }
            .left, .right { display: flex; gap: .5rem; align-items: center; }
            button { background: rgba(255,255,255,0.08); color: #e8e8e8; border: 1px solid rgba(255,255,255,0.14); padding: .45rem .75rem; border-radius: .5rem; cursor: pointer; font-size: 0.95rem; }
            button:disabled { opacity: .45; cursor: not-allowed; }
            #title { opacity: .9; font-size: .95rem; }
            #backFloat { position: fixed; top: .75rem; left: .75rem; z-index: 10; display: none; }
            #viewer.active #backFloat { display: inline-block; }

            /* Media element styles */
            /* Default for rasters: do NOT upscale (stay sharp) */
            .media-image {
                max-width: 100%;
                max-height: 100%;
                object-fit: contain;
                background:#111;
                box-shadow: 0 0 0 1px rgba(255,255,255,.06) inset;
                display: block;
            }
            /* SVGs: fill the stage (contained) */
            .media-svg {
                width: 100%;
                height: 100%;
                object-fit: contain;
            }
        </style>
    </head>

    <body>
        <!-- TOC SCREEN -->
        <section id="toc" class="screen active" aria-labelledby="tocTitle">
            <h1 id="tocTitle">Basic Electricity</h1>
            <p id="hint">Tip: click a section to expand/collapse. In slides: ←/→ stay within the current section; Next at the last slide returns to TOC. <kbd>B</kbd>/<kbd>Esc</kbd> to return, <kbd>F</kbd> for fullscreen.</p>
            <div id="tocSections"></div>
            <a href="https://ptable.com/#Properties/Series" target="_blank" rel="noopener">Periodic Table of Elements - Properties</a>
            <a href="https://ptable.com/#Electrons/Configuration" target="_blank" rel="noopener">Periodic Table of Elements - Electron Configurations</a>
        </section>

        <!-- VIEWER SCREEN -->
        <section id="viewer" class="screen" aria-labelledby="slideTitle">
            <button id="backFloat" title="Back to TOC (B / Esc)">Back</button>
            <div id="stageWrap">
                <div id="stage" aria-live="polite">
                    <div id="mediaHost"></div>
                </div>
            </div>
            <div id="controls">
                <div class="left">
                    <button id="backBtn" title="Back to TOC (B / Esc)">Back</button>
                    <button id="prevBtn" title="Previous (← / PageUp)">Prev</button>
                    <button id="nextBtn" title="Next (→ / Space / PageDown)">Next</button>
                </div>
                <div id="title" role="heading" aria-level="2"></div>
                <div class="right">
                    <button id="fsBtn" title="Fullscreen (F)">Fullscreen</button>
                </div>
            </div>
        </section>

        <script>
            /*
            * Sections & slides (you can mix .svg, .png, .jpg, .gif, .webp, etc.)
            * 1) DEFINE YOUR SECTIONS & SLIDES (hierarchical)
            * Each section has a title and a list of slides (file + title).
            * Numbering like 1., 1.1, 1.2 is generated automatically.
            */
            const sections = [
                {
                    title: "Analogies",
                    slides: [
                        { title: "Intro",                   file: "electricity/analogies/intro.svg" },
                        { title: "Voltage",                 file: "electricity/analogies/voltage.svg" },
                        { title: "Current",                 file: "electricity/analogies/current.svg" },
                        { title: "Conductor (water)",       file: "electricity/analogies/conductor_water.svg" },
                        { title: "Conductor (electricity)", file: "electricity/analogies/conductor_elec.svg" },
                        { title: "Insulator (electricity)", file: "electricity/analogies/insulator_elec.svg" },
                        { title: "Resistor (electricity)",  file: "electricity/analogies/resistor_elec.svg" },
                        { title: "Switch",                  file: "electricity/analogies/switch.svg" },
                        { title: "Resistor",                file: "electricity/analogies/resistor.svg" },
                        { title: "Capacitor",               file: "electricity/analogies/capacitor.svg" },
                        { title: "Inductor",                file: "electricity/analogies/inductor.svg" },
                    ]
                },
                {
                    title: "Static electricity",
                    slides: [
                        { title: "Intro",       file: "electricity/static/intro.svg" },
                        { title: "Amber",       file: "electricity/static/amber.svg" },
                        { title: "Lightning",   file: "electricity/static/lightning.svg" },
                    ]
                },
                {
                    title: "Dynamic electricity",
                    slides: [
                        { title: "Intro",                   file: "electricity/dynamic/intro.svg" },
                        { title: "Direct current",          file: "electricity/dynamic/dc_current.svg" },
                        { title: "Alternating current",     file: "electricity/dynamic/ac_current.svg" },
                        { title: "Resistor DC",             file: "electricity/dynamic/resistor_dc.svg" },
                        { title: "Resistor AC",             file: "electricity/dynamic/resistor_ac.svg" },
                        { title: "Resistor square wave",    file: "electricity/dynamic/resistor_square.svg" },
                        { title: "Capacitor DC",            file: "electricity/dynamic/capacitor_dc.svg" },
                        { title: "Capacitor AC",            file: "electricity/dynamic/capacitor_ac.svg" },
                        { title: "Capacitor square wave",   file: "electricity/dynamic/capacitor_square.svg" },
                        { title: "Inductor DC",             file: "electricity/dynamic/inductor_dc.svg" },
                        { title: "Inductor AC",             file: "electricity/dynamic/inductor_ac.svg" },
                        { title: "Inductor square wave",    file: "electricity/dynamic/inductor_square.svg" },
                    ]
                },
                {
                    title: "Physics of Electricity",
                    slides: [
                        { title: "Intro (1)",                       file: "electricity/physics/intro1.svg" },
                        { title: "Intro (2)",                       file: "electricity/physics/intro2.svg" },
                        { title: "Intro (3)",                       file: "electricity/physics/intro3.svg" },
                        { title: "Physics terms (1)",               file: "electricity/physics/physics_terms1.svg" },
                        { title: "Physics terms (2)",               file: "electricity/physics/physics_terms2.svg" },
                        { title: "Physics terms (3)",               file: "electricity/physics/physics_terms3.svg" },
                        { title: "Physics terms (4)",               file: "electricity/physics/physics_terms4.svg" },
                        { title: "Physics terms (5)",               file: "electricity/physics/physics_terms5.svg" },
                        { title: "Physics terms (6)",               file: "electricity/physics/physics_terms6.svg" },
                        { title: "Electrical terms (1)",            file: "electricity/physics/electric_terms1.svg" },
                        { title: "Initial model",                   file: "electricity/physics/initial_model.svg" },
                        { title: "Thomson's model",                 file: "electricity/physics/thomsons_model.png" },
                        { title: "Planetary model",                 file: "electricity/physics/planetary_model.png" },
                        { title: "Orbitals model",                  file: "electricity/physics/orbitals_model.png" },
                    ]
                },
                {
                    title: "Physics of Semi-Conductors",
                    slides: [
                        { title: "Energy levels",                   file: "electricity/semi_conductors/energy_levels.png" },
                        { title: "Energy bands",                    file: "electricity/semi_conductors/levels_general.svg" },
                        { title: "Levels in a conductor",           file: "electricity/semi_conductors/levels_conductor.svg" },
                        { title: "Levels in an insulator",          file: "electricity/semi_conductors/levels_insulator.svg" },
                        { title: "Levels in a semi-conductor (1)",  file: "electricity/semi_conductors/levels_intrinsic.svg" },
                        { title: "Levels in a semi-conductor (2)",  file: "electricity/semi_conductors/levels_ntype.svg" },
                        { title: "Levels in a semi-conductor (3)",  file: "electricity/semi_conductors/levels_ptype.svg" },
                        { title: "Physics terms (1)",               file: "electricity/semi_conductors/physics_terms1.svg" },
                        { title: "Physics terms (2)",               file: "electricity/semi_conductors/physics_terms2.svg" },
                        { title: "Physics terms (3)",               file: "electricity/semi_conductors/physics_terms3.svg" },
                        { title: "Physics terms (4)",               file: "electricity/semi_conductors/physics_terms4.svg" },
                        { title: "Physics terms (5)",               file: "electricity/semi_conductors/physics_terms5.svg" },
                    ]
                },
            ];

            // Build flat list + section bounds
            const flat = [];
            const sectionStarts = [];
            const sectionEnds = [];
            (function buildFlat(){
                let idx = 0;
                sections.forEach((sec, si) => {
                    sectionStarts[si] = idx;
                    sec.slides.forEach((sl, li) => {
                        flat.push({
                            file: sl.file,
                            title: sl.title,
                            secIndex: si,
                            slideIndex: li,
                            sectionTitle: sec.title,
                            number: (si + 1) + '.' + (li + 1)
                        });
                        idx++;
                    });
                    sectionEnds[si] = idx - 1;
                });
            })();

            // --- Elements ---
            const $ = sel => document.querySelector(sel);
            const toc = $('#toc'), viewer = $('#viewer');
            const tocSections = $('#tocSections');
            const mediaHost = $('#mediaHost'), titleEl = $('#title');
            const prevBtn = $('#prevBtn'), nextBtn = $('#nextBtn');
            const backBtn = $('#backBtn'), backFloat = $('#backFloat'), fsBtn = $('#fsBtn');

            let current = -1; // global index in flat[]

            function buildTOC() {
                tocSections.innerHTML = '';
                sections.forEach((sec, si) => {
                    const details = document.createElement('details');
                    details.className = 'section';
                    // Default collapsed: do NOT set details.open = true
                    const summary = document.createElement('summary');
                    const titleRow = document.createElement('div');
                    titleRow.className = 'section-title';
                    const chev = document.createElement('span');
                    chev.className = 'chev';
                    chev.textContent = '▸';
                    const num = document.createElement('span');
                    num.className = 'num';
                    num.textContent = (si + 1) + '.';
                    const text = document.createTextNode(' ' + sec.title);
                    titleRow.appendChild(chev);
                    titleRow.appendChild(num);
                    titleRow.appendChild(text);
                    summary.appendChild(titleRow);
                    details.appendChild(summary);

                    // Slides list inside this section
                    const olSlides = document.createElement('ol');
                    olSlides.className = 'slides';

                    sec.slides.forEach((sl, li) => {
                        const liSlide = document.createElement('li');
                        const a = document.createElement('a');
                        const n = (si + 1) + '.' + (li + 1);
                        const globalIdx = sectionStarts[si] + li;
                        a.href = '#slide=' + globalIdx;
                        a.innerHTML = '<span class="num">' + n + '</span>' + (sl.title || sl.file);
                        a.addEventListener('click', (e) => { e.preventDefault(); showSlide(globalIdx); });
                        liSlide.appendChild(a);
                        olSlides.appendChild(liSlide);

                        // Preload (works for both SVG and raster)
                        const link = document.createElement('link');
                        link.rel = 'preload'; link.as = 'image'; link.href = sl.file;
                        document.head.appendChild(link);
                    });

                    details.appendChild(olSlides);
                    tocSections.appendChild(details);
                });
            }

            function showTOC() {
                current = -1;
                mediaHost.innerHTML = ''; // clear any media
                toggleScreens('toc');
                history.replaceState(null, '', location.pathname + '#toc');
            }

            function isSvg(filename) {
                return /\.svg(\?.*)?$/i.test(filename);
            }

            // Option B rendering: SVG fills, rasters don't upscale beyond native size
            function renderMedia(file) {
                mediaHost.innerHTML = '';
                const img = document.createElement('img');
                img.src = file;
                img.alt = '';

                if (isSvg(file)) {
                    img.className = 'media-image media-svg';
                } else {
                    img.className = 'media-image';
                }

                mediaHost.appendChild(img);
                img.onload = () => img.focus?.({ preventScroll: false });
            }

            function showSlide(idx) {
                if (idx < 0 || idx >= flat.length) return;
                current = idx;
                const s = flat[idx];
                renderMedia(s.file);
                titleEl.textContent = 'Slide ' + s.number + ' — ' + s.title + ' (' + s.sectionTitle + ')';
                toggleScreens('viewer');
                updateNavButtons();
                history.replaceState(null, '', '#slide=' + idx);

                // Optional nicety: auto-open the section containing this slide in the TOC (when user goes back)
                const detailsList = Array.from(document.querySelectorAll('details.section'));
                const secEl = detailsList[s.secIndex];
                if (secEl && !secEl.open) secEl.open = true;
            }

            function toggleScreens(which) {
                toc.classList.toggle('active', which === 'toc');
                viewer.classList.toggle('active', which === 'viewer');
            }

            function getSectionBoundsByIndex(globalIdx){
                const sec = flat[globalIdx].secIndex;
                return { start: sectionStarts[sec], end: sectionEnds[sec] };
            }

            function nextSlide() {
                if (current < 0) return;
                const bounds = getSectionBoundsByIndex(current);
                if (current < bounds.end) showSlide(current + 1);
                else showTOC(); // last in section → back to TOC
            }

            function prevSlide() {
                if (current < 0) return;
                const bounds = getSectionBoundsByIndex(current);
                if (current > bounds.start) showSlide(current - 1);
                else showTOC(); // first in section → back to TOC
            }

            function updateNavButtons() {
                if (current < 0) { prevBtn.disabled = nextBtn.disabled = true; return; }
                const bounds = getSectionBoundsByIndex(current);
                prevBtn.disabled = (current <= bounds.start);
                nextBtn.disabled = (current >= bounds.end);
            }

            // Keyboard controls
            window.addEventListener('keydown', (e) => {
                const inViewer = viewer.classList.contains('active');
                const key = e.key;
                if (inViewer) {
                    if (key === 'ArrowRight' || key === 'PageDown' || key === ' ') { e.preventDefault(); nextSlide(); }
                    else if (key === 'ArrowLeft' || key === 'PageUp') { e.preventDefault(); prevSlide(); }
                    else if (key === 'Home' || key === 'End') { e.preventDefault(); showTOC(); }
                    else if (key === 'Escape' || key.toLowerCase() === 'b') { e.preventDefault(); showTOC(); }
                    else if (key.toLowerCase() === 'f') { e.preventDefault(); toggleFullscreen(); }
                } else {
                    // From TOC: right arrow or Enter goes to first slide
                    if (key === 'ArrowRight' || key === 'Enter') {
                        e.preventDefault();
                        const detailsList = Array.from(document.querySelectorAll('details.section'));
                        const firstOpen = detailsList.find(d => d.open) ?? detailsList[0];
                        const firstIdx = firstOpen ? sectionStarts[detailsList.indexOf(firstOpen)] : 0;
                        showSlide(firstIdx);
                    }
                }
            });

            // Buttons
            backBtn.addEventListener('click', showTOC);
            backFloat.addEventListener('click', showTOC);
            prevBtn.addEventListener('click', prevSlide);
            nextBtn.addEventListener('click', nextSlide);
            fsBtn.addEventListener('click', toggleFullscreen);

            // Fullscreen
            function toggleFullscreen() {
                const el = document.documentElement;
                if (!document.fullscreenElement) (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen)?.call(el);
                else (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen)?.call(document);
            }

            // Hash routing (#slide=NUM)
            function handleHash() {
                const hash = location.hash.startsWith('#') ? location.hash.slice(1) : location.hash;
                const params = new URLSearchParams(hash);
                const val = params.get('slide');
                const idx = val !== null ? Number(val) : NaN;
                if (!Number.isNaN(idx)) { showSlide(idx); return; }
                showTOC();
            }

            window.addEventListener('hashchange', handleHash);

            // Build UI & route
            buildTOC();
            handleHash();
        </script>
    </body>
</html>
