<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Electricity</title>
        <style>
            :root { --pad: 18px; }
            html, body { height: 100%; margin: 0; font-family: system-ui, Arial, sans-serif; background:#0b0c10; color:#e8e8e8; }
            a { color: #79b8ff; }
            .screen { height: 100%; display: none; }
            .screen.active { display: flex; }
            #toc { flex-direction: column; padding: 2rem max(2rem, 6vw); gap: 1rem; overflow: auto; }
            #toc h1 { margin: 0 0 .5rem 0; font-size: clamp(1.4rem, 2.5vw, 2rem); }
            #toc p#hint { opacity: .7; font-size: .95rem; margin: 0 0 .75rem 0; }
            /* Numbered, multi-level list */
            #toc ol.sections { counter-reset: section; list-style: none; margin: 0; padding: 0; }
            #toc ol.sections > li { counter-increment: section; margin: .75rem 0; }
            #toc .section-title { font-weight: 600; font-size: clamp(1.05rem, 1.8vw, 1.25rem); }
            #toc .section-title .num { opacity: .8; margin-right: .4rem; }
            #toc ol.slides { counter-reset: slide; list-style: none; margin: .4rem 0 .2rem 1.25rem; padding-left: 0; }
            #toc ol.slides > li { counter-increment: slide; line-height: 1.9; }
            #toc ol.slides > li a { text-decoration: none; }
            #toc ol.slides > li a .num { opacity: .8; margin-right: .4rem; }

            #viewer { flex-direction: column; min-height: 0; }
            #stageWrap { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
            #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: var(--pad); box-sizing: border-box; }
            #slideObj { width: 100%; height: 100%; border: 0; background:#111; box-shadow: 0 0 0 1px rgba(255,255,255,.06) inset; }

            #controls { display: flex; gap: .5rem; padding: .5rem; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.04); border-top: 1px solid rgba(255,255,255,0.08); }
            .left, .right { display: flex; gap: .5rem; align-items: center; }
            button { background: rgba(255,255,255,0.08); color: #e8e8e8; border: 1px solid rgba(255,255,255,0.14); padding: .45rem .75rem; border-radius: .5rem; cursor: pointer; font-size: 0.95rem; }
            button:disabled { opacity: .45; cursor: not-allowed; }
            #title { opacity: .9; font-size: .95rem; }
            #hint2 { opacity: .6; font-size: .85rem; }
            #backFloat { position: fixed; top: .75rem; left: .75rem; z-index: 10; display: none; }
            #viewer.active #backFloat { display: inline-block; }
        </style>
    </head>

    <body>
        <!-- TOC SCREEN -->
        <section id="toc" class="screen active" aria-labelledby="tocTitle">
            <h1 id="tocTitle">Basic Electricity</h1>
            <p id="hint">Tip: use ← / → to navigate slides, <kbd>Home</kbd>/<kbd>End</kbd> to jump, <kbd>B</kbd> or <kbd>Esc</kbd> to return here, <kbd>F</kbd> for fullscreen.</p>
            <ol id="tocSections" class="sections"></ol>
        </section>

        <!-- VIEWER SCREEN -->
        <section id="viewer" class="screen" aria-labelledby="slideTitle">
            <button id="backFloat" title="Back to TOC (B / Esc)">Back</button>
            <div id="stageWrap">
                <div id="stage" aria-live="polite">
                    <object id="slideObj" type="image/svg+xml" data="" tabindex="0" aria-label="Slide viewer"></object>
                </div>
            </div>
            <div id="controls">
                <div class="left">
                    <button id="backBtn" title="Back to TOC (B / Esc)">Back</button>
                    <button id="prevBtn" title="Previous (← / PageUp)">Prev</button>
                    <button id="nextBtn" title="Next (→ / Space / PageDown)">Next</button>
                </div>
                <div id="title" role="heading" aria-level="2"></div>
                <div class="right">
                    <button id="fsBtn" title="Fullscreen (F)">Fullscreen</button>
                </div>
            </div>
        </section>

        <script>
            /*
            * 1) DEFINE YOUR SECTIONS & SLIDES (hierarchical)
            * Each section has a title and a list of slides (file + title).
            * Numbering like 1., 1.1, 1.2 is generated automatically.
            */
            const sections = [
                {
                    title: "Analogies",
                    slides: [
                        { title: "Intro",                   file: "electricity/analogies/intro.svg" },
                        { title: "Voltage",                 file: "electricity/analogies/voltage.svg" },
                        { title: "Current",                 file: "electricity/analogies/current.svg" },
                        { title: "Conductor (water)",       file: "electricity/analogies/conductor_water.svg" },
                        { title: "Conductor (electricity)", file: "electricity/analogies/conductor_elec.svg" },
                        { title: "Insulator (electricity)", file: "electricity/analogies/insulator_elec.svg" },
                        { title: "Switch",                  file: "electricity/analogies/switch.svg" },
                        { title: "Resistor",                file: "electricity/analogies/resistor.svg" },
                        { title: "Capacitor",               file: "electricity/analogies/capacitor.svg" },
                        { title: "Inductor",                file: "electricity/analogies/inductor.svg" },
                    ]
                },
                {
                    title: "Static electricity",
                    slides: [
                        { title: "Intro",       file: "electricity/static/intro.svg" },
                        { title: "Amber",       file: "electricity/static/amber.svg" },
                        { title: "Lightning",   file: "electricity/static/lightning.svg" },
                    ]
                },
                {
                    title: "Dynamic electricity",
                    slides: [
                        { title: "Intro",                   file: "electricity/dynamic/intro.svg" },
                        { title: "Direct current",          file: "electricity/dynamic/dc_current.svg" },
                        { title: "Alternating current",     file: "electricity/dynamic/ac_current.svg" },
                        { title: "Resistor DC",             file: "electricity/dynamic/resistor_dc.svg" },
                        { title: "Resistor AC",             file: "electricity/dynamic/resistor_ac.svg" },
                        { title: "Resistor square wave",    file: "electricity/dynamic/resistor_square.svg" },
                        { title: "Capacitor DC",            file: "electricity/dynamic/capacitor_dc.svg" },
                        { title: "Capacitor AC",            file: "electricity/dynamic/capacitor_ac.svg" },
                        { title: "Capacitor square wave",   file: "electricity/dynamic/capacitor_square.svg" },
                        { title: "Inductor DC",             file: "electricity/dynamic/inductor_dc.svg" },
                        { title: "Inductor AC",             file: "electricity/dynamic/inductor_ac.svg" },
                        { title: "Inductor square wave",    file: "electricity/dynamic/inductor_square.svg" },
                    ]
                }
            ];

            // --- Build a flattened list of slides for linear navigation ---
            const flat = [];
            sections.forEach((sec, si) => {
                const sectionNumber = si + 1;
                sec.slides.forEach((sl, li) => {
                    flat.push({
                        file: sl.file,
                        title: sl.title,
                        secIndex: si,
                        slideIndex: li,
                        sectionTitle: sec.title,
                        sectionNumber,
                        number: `${sectionNumber}.${li + 1}`
                    });
                });
            });

            // --- Elements ---
            const $ = sel => document.querySelector(sel);
            const toc = $("#toc"), viewer = $("#viewer");
            const tocSections = $("#tocSections");
            const slideObj = $("#slideObj"), titleEl = $("#title");
            const prevBtn = $("#prevBtn"), nextBtn = $("#nextBtn");
            const backBtn = $("#backBtn"), backFloat = $("#backFloat"), fsBtn = $("#fsBtn");

            let current = -1; // global index in flat[]

            function buildTOC() {
                tocSections.innerHTML = "";

                sections.forEach((sec, si) => {
                    const liSection = document.createElement("li");
                    const sectionNumber = si + 1;

                    // Section title row: "1. Static electricity"
                    const header = document.createElement("div");
                    header.className = "section-title";
                    const num = document.createElement("span");
                    num.className = "num";
                    num.textContent = sectionNumber + ".";
                    header.appendChild(num);
                    header.appendChild(document.createTextNode(" " + sec.title));
                    liSection.appendChild(header);

                    // Slides list inside this section
                    const olSlides = document.createElement("ol");
                    olSlides.className = "slides";

                    sec.slides.forEach((sl, li) => {
                        const liSlide = document.createElement("li");
                        const a = document.createElement("a");
                        const n = `${sectionNumber}.${li + 1}`;
                        a.href = `#slide=${indexFromPair(si, li)}`;
                        a.innerHTML = `<span class="num">${n}</span>${sl.title || sl.file}`;
                        a.addEventListener("click", (e) => { e.preventDefault(); showSlide(indexFromPair(si, li)); });
                        liSlide.appendChild(a);
                        olSlides.appendChild(liSlide);

                        // Preload helpful for smoother transitions
                        const link = document.createElement("link");
                        link.rel = "preload"; link.as = "image"; link.href = sl.file;
                        document.head.appendChild(link);
                    });

                    liSection.appendChild(olSlides);
                    tocSections.appendChild(liSection);
                });
            }

            // Helper: map (section, slide) -> flat index
            function indexFromPair(secIndex, slideIndex) {
                let sum = 0;
                for (let i = 0; i < sections.length; i++) {
                    if (i < secIndex) sum += sections[i].slides.length;
                }
                return sum + slideIndex;
            }

            function showTOC() {
                current = -1;
                slideObj.removeAttribute("data"); // some browsers
                slideObj.data = ""; // others
                toggleScreens("toc");
                history.replaceState(null, "", location.pathname + "#toc");
            }

            function showSlide(idx) {
                if (idx < 0 || idx >= flat.length) return;
                current = idx;
                const s = flat[idx];
                slideObj.data = s.file;
                titleEl.textContent = `Slide ${idx + 1}/${flat.length} — ${s.number} ${s.title} (${s.sectionTitle})`;
                toggleScreens("viewer");
                updateNavButtons();
                history.replaceState(null, "", `#slide=${idx}`);
                // focus for keyboard users
                slideObj.focus({ preventScroll: false });
            }

            function toggleScreens(which) {
                toc.classList.toggle("active", which === "toc");
                viewer.classList.toggle("active", which === "viewer");
            }

            function updateNavButtons() {
                prevBtn.disabled = (current <= 0);
                nextBtn.disabled = (current >= flat.length - 1);
            }

            function nextSlide() { if (current < flat.length - 1) showSlide(current + 1); }
            function prevSlide() { if (current > 0) showSlide(current - 1); }

            // Keyboard controls
            window.addEventListener("keydown", (e) => {
                const inViewer = viewer.classList.contains("active");
                const key = e.key;
                if (inViewer) {
                    if (key === "ArrowRight" || key === "PageDown" || key === " ") { e.preventDefault(); nextSlide(); }
                    else if (key === "ArrowLeft" || key === "PageUp") { e.preventDefault(); prevSlide(); }
                    else if (key === "Home") { e.preventDefault(); showSlide(0); }
                    else if (key === "End") { e.preventDefault(); showSlide(flat.length - 1); }
                    else if (key === "Escape" || key.toLowerCase() === "b") { e.preventDefault(); showTOC(); }
                    else if (key.toLowerCase() === "f") { e.preventDefault(); toggleFullscreen(); }
                } else {
                    // From TOC: right arrow or Enter goes to first slide
                    if (key === "ArrowRight" || key === "Enter") { e.preventDefault(); showSlide(0); }
                }
            });

            // Buttons
            backBtn.addEventListener("click", showTOC);
            backFloat.addEventListener("click", showTOC);
            prevBtn.addEventListener("click", prevSlide);
            nextBtn.addEventListener("click", nextSlide);
            fsBtn.addEventListener("click", toggleFullscreen);

            // Fullscreen
            function toggleFullscreen() {
                const el = document.documentElement;
                if (!document.fullscreenElement) {
                    (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen)?.call(el);
                } else {
                    (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen)?.call(document);
                }
            }

            // Hash routing
            function handleHash() {
                const m = location.hash.match(/#slide=(\d+)/);
                if (m) {
                    const idx = parseInt(m[1], 10);
                    if (!Number.isNaN(idx)) { showSlide(idx); return; }
                }
                showTOC();
            }

            window.addEventListener("hashchange", handleHash);

            // Build UI & route
            buildTOC();
            handleHash();
        </script>
    </body>
</html>
