                fill="#0060a0">
                <tspan x="30" y="110" font-weight="bold">Insulators</tspan>
                <tspan x="30" y="140">Range: 0 ≤ ℧ ≤ 1⋅10⁻¹⁸ MS/m.</tspan>
                <tspan x="30" y="170">Groups: Nobel gases, Nonmetals (excluding C, P).</tspan>
                <tspan x="30" y="210" font-weight="bold">Conductors</tspan>
                <tspan x="30" y="240">Range: 1 ≤ ℧ ≤ 1⋅10² MS/m.</tspan>
                <tspan x="30" y="270">Groups: Alkali metals, Alkaline earth metals, Transition</tspan>
                <tspan x="140" y="300">metals, Post-transition metals, Lanthanides(some),</tspan>
                <tspan x="140" y="330">Actinides(few).</tspan>
                <tspan x="30" y="370" font-weight="bold">Semi-Conductors</tspan>
                <tspan x="30" y="400">Range: 1⋅10⁻³ ≤ ℧ ≤ 1⋅10⁻¹ MS/m.</tspan>
                <tspan x="30" y="430">Groups: Metalloids(some), Nonmetals(few).</tspan>
