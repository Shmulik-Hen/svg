<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    id="svg1"
    version="1.1"
    viewBox="0 0 800 600"
    width="800"
    height="600"
    preserveAspectRatio="xMidYMid"
    fill-rule="evenodd"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:svg="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
    </defs>
    <g
        id="page1">
        <g
            id="layer1"
            style="display:inline">
            <rect
                id="white_background"
                x="0"
                y="0"
                width="800"
                height="600"
                fill="white">
            </rect>
        </g>
        <g
            id="layer2"
            style="display:inline">
            <text
                font-family="Ubuntu"
                font-size="40"
                font-weight="bold"
                fill="#0000ff">
                <tspan x="80" y="80">basic Physics behind Electricity (2)</tspan>
            </text>
            <text
                font-family="Ubuntu"
                font-size="29"
                font-weight="norm"
                fill="#0060a0">
                <tspan x="30" y="130">The </tspan>
                <tspan x="85" y="130" font-weight="bold">Age of Enlightment</tspan>
                <tspan x="355" y="130">(late 17th century), brought</tspan>
                <tspan x="30" y="160">more and more scientists to conduct more and more</tspan>
                <tspan x="30" y="190">experiments, to log their findings, and to share them</tspan>
                <tspan x="30" y="220">with other scientists for review and expansion.</tspan>

                <tspan x="30" y="260">This led to the Development of new sciences, like</tspan>
                <tspan x="30" y="290" font-weight="bold">Physics</tspan>
                <tspan x="130" y="290">,</tspan>
                <tspan x="140" y="290" font-weight="bold">Chemistry</tspan>
                <tspan x="280" y="290">,</tspan>
                <tspan x="290" y="290" font-weight="bold">Electricity</tspan>
                <tspan x="440" y="290">and</tspan>
                <tspan x="500" y="290" font-weight="bold">Magnetism</tspan>
                <tspan x="650" y="290">.</tspan>

                <tspan x="30" y="330">It also led to the Discovery of the</tspan>
                <tspan x="465" y="330" font-weight="bold">Periodic table</tspan>
                <tspan x="655" y="330">, </tspan>
                <tspan x="30" y="360" font-weight="bold">Structure of Atoms</tspan>
                <tspan x="292" y="360">, </tspan>
                <tspan x="305" y="360" font-weight="bold">Radiation</tspan>
                <tspan x="435" y="360">, and of the</tspan>
                <tspan x="590" y="360" font-weight="bold">Nucleus</tspan>
                <tspan x="700" y="360">, </tspan>
                <tspan x="30" y="390" font-weight="bold">Electron</tspan>
                <tspan x="145" y="390">, </tspan>
                <tspan x="155" y="390" font-weight="bold">Proton</tspan>
                <tspan x="250" y="390">, and</tspan>
                <tspan x="315" y="390" font-weight="bold">Neutron</tspan>
                <tspan x="430" y="390">.</tspan>

                <tspan x="30" y="430">Another important areas were the Invention of the</tspan>
                <tspan x="30" y="460" font-weight="bold">Electric battery</tspan>
                <tspan x="242" y="460">, </tspan>
                <tspan x="250" y="460" font-weight="bold">Light Bulb</tspan>
                <tspan x="390" y="460">, </tspan>
                <tspan x="400" y="460" font-weight="bold">Electric Motor</tspan>
                <tspan x="590" y="460">, and</tspan>
                <tspan x="30" y="490" font-weight="bold">Generator</tspan>
                <tspan x="170" y="490">.</tspan>
            </text>
        </g> <!--layer2-->
    </g> <!--page1-->
</svg>