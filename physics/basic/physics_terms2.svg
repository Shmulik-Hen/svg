<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    id="svg1"
    version="1.1"
    viewBox="0 0 800 600"
    width="800"
    height="600"
    preserveAspectRatio="xMidYMid"
    fill-rule="evenodd"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:svg="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
    </defs>
    <g
        id="page1">
        <g
            id="layer1"
            style="display:inline">
            <rect
                id="white_background"
                x="0"
                y="0"
                width="800"
                height="600"
                fill="white">
            </rect>
        </g>
        <g
            id="layer2"
            style="display:inline">
            <text
                font-family="Ubuntu"
                font-size="36"
                font-weight="bold"
                fill="#0000ff">
                <tspan x="30" y="60">Basic terms in Physics (2)</tspan>
            </text>
            <text
                font-family="Ubuntu"
                font-size="29"
                font-weight="norm"
                fill="#0060a0">
                <tspan x="30" y="110" font-weight="bold">Maximum electrons</tspan>
                <tspan x="30" y="140">Each shell has a maximum number of electrons it can hold.</tspan>
                <tspan x="30" y="170">By the formula 2n², where n is the shell level (1..7),</tspan>
                <tspan x="30" y="200">giving a maximum of 2,8,18,32,50,72,98,...</tspan>
                <tspan x="30" y="230">Oganesson (Og, atomic no 118), the heaviest known</tspan>
                <tspan x="30" y="260">element, has the configuration 2,8,18,32,32,18,8.</tspan>
                <tspan x="30" y="295" font-weight="bold">Valence band</tspan>
                <tspan x="30" y="325">The outermost shell of an atom, containing the valence</tspan>
                <tspan x="30" y="355">electrons (1..8). These electrons determine almost all the</tspan>
                <tspan x="30" y="385">element's properties, chemical bonding and reactions.</tspan>
                <tspan x="30" y="420" font-weight="bold">Conduction band</tspan>
                <tspan x="30" y="450">This band is formed by the d orbitals of the highest layer,</tspan>
                <tspan x="30" y="480">which contains electrons that can be freed relatively easy.</tspan>
                <tspan x="30" y="510">They can move and conduct electricity. It is typically empty</tspan>
                <tspan x="30" y="540">in insulators, and partially filled in conductors and</tspan>
                <tspan x="30" y="570">semi-conductors.</tspan>
            </text>
        </g>
    </g> <!--page1-->
</svg>