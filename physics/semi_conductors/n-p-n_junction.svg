<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    id="svg1"
    version="1.1"
    viewBox="0 0 800 600"
    width="800"
    height="600"
    preserveAspectRatio="xMidYMid"
    fill-rule="evenodd"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:svg="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <marker
            id="arrow_head"
            style="overflow:visible"
            viewBox="0 0 4 6"
            markerWidth="4"
            markerHeight="6"
            refX="left"
            refY="center"
            orient="auto-start-reverse"
            preserveAspectRatio="xMidYMid">
            <path
                style="fill:none;stroke:context-stroke;stroke-width:1;stroke-linecap:butt"
                d="M -3,-3 L 0,0 L -3,3">
            </path>
        </marker>
        <text
            id="headline"
            font-family="Ubuntu"
            font-size="28"
            font-weight="bold"
            fill="#000000">
            <tspan>Bipolar Junction Transistor (BJT) - NPN</tspan>
        </text>
        <text
            id="title_1"
            font-family="Ubuntu"
            font-size="18"
            font-weight="bold"
            fill="#000000">
            <tspan x="25" y="0">Collector</tspan>
            <tspan x="0" y="20">Moderate doping</tspan>
            <tspan x="330" y="0">Base</tspan>
            <tspan x="300" y="20">Light doping</tspan>
            <tspan x="565" y="0">Emitter</tspan>
            <tspan x="550" y="20">Heavy doping</tspan>
        </text>
        <text
            id="title_2"
            font-family="Ubuntu"
            font-size="24"
            font-weight="bold"
            fill="#000000">
            <tspan x="0" y="0">Vce</tspan>
            <tspan x="275" y="15">Vbe</tspan>
        </text>
        <circle
            id="hole"
            cx="0"
            cy="0"
            r="5"
            style="fill:#0000ff;fill-opacity:1;stroke:none">
        </circle>
        <circle
            id="electron"
            cx="0"
            cy="0"
            r="5"
            style="fill:#ff0000;fill-opacity:1;stroke:none">
        </circle>
        <text
            id="neutral_atom_label"
            font-family="Ubuntu"
            font-size="18"
            font-weight="norm"
            fill="#000000">
            <tspan x="-5" y="6">0</tspan>
        </text>
        <g
            id="neutral_atom">
            <use xlink:href="#ion"></use>
            <use xlink:href="#neutral_atom_label"></use>
        </g>
        <circle
            id="ion"
            cx="0"
            cy="0"
            r="15"
            style="fill:none;stroke:#000000;stroke-width:2;stroke-opacity:1">
        </circle>
        <path
            id="pos_charge"
            d="m 0,-5 v 10 m -5,-5 h 10"
            style="fill:none;stroke:#0000ff;stroke-width:2;stroke-opacity:1">
        </path>
        <path
            id="neg_charge"
            d="m -5,0 h 10"
            style="fill:none;stroke:#ff0000;stroke-width:2;stroke-opacity:1">
        </path>
        <g
            id="pos_ion">
            <use xlink:href="#ion"></use>
            <use xlink:href="#pos_charge"></use>
        </g>
        <g
            id="neg_ion">
            <use xlink:href="#ion"></use>
            <use xlink:href="#neg_charge"></use>
        </g>
        <rect
            id="box"
            x="4"
            y="4"
            width="780"
            height="350"
            style="fill:none;stroke:#000000;stroke-width:8">
        </rect>
        <rect
            id="terminal"
            x="0"
            y="0"
            width="30"
            height="10"
            style="fill:#000000;stroke:#000000;stroke-width:5;stroke-linecap:round;stroke-linejoin:round">
        </rect>
        <rect
            id="n_side"
            x="4"
            y="0"
            width="302"
            height="346"
            style="fill:#00ffff;fill-opacity:0.2;stroke:none">
        </rect>
        <rect
            id="p_side"
            x="0"
            y="0"
            width="100"
            height="346"
            style="fill:#ff0000;fill-opacity:0.2;stroke:none">
        </rect>
        <rect
            id="depletion_zone"
            x="0"
            y="0"
            width="34"
            height="346"
            style="fill:#ffff00;fill-opacity:0.3;stroke:none">
        </rect>
        <g
            id="potential_rev">
            <path
                d="m 0,0 v -30 h 40 m 0,-20 v 40 m 10,-30 v 20 m 0,-10 h 40 v 30"
                style="fill:none;stroke:#000000;stroke-width:5;stroke-opacity:1;stroke-dasharray:2 2">
            </path>
            <use xlink:href="#pos_charge" x="25" y="-40"></use>
            <use xlink:href="#neg_charge" x="65" y="-40"></use>
        </g>
        <g
            id="potential_fwd">
            <path
                d="m 0,0 v -30 h 40 m 0,-10 v 20 m 10,-30 v 40 m 0,-20 h 40 v 30"
                style="fill:none;stroke:#000000;stroke-width:5;stroke-opacity:1;stroke-dasharray:2 2">
            </path>
            <use xlink:href="#neg_charge" x="25" y="-40"></use>
            <use xlink:href="#pos_charge" x="65" y="-40"></use>
        </g>
        <g
            id="circuit_small">
            <path
                d="m 0,0 v -60 h 100 m 0,-20 v 40 m 10,-30 v 20 m 0,-10 h 120 v 60"
                style="fill:none;stroke:#000000;stroke-width:3">
            </path>
            <use xlink:href="#pos_charge" x="90" y="-80"></use>
            <use xlink:href="#neg_charge" x="120" y="-80"></use>
        </g>
        <g
            id="circuit_large">
            <path
                d="m 0,0 v -100 h 150 m 0,-20 v 40 m 10,-30 v 20 m 0,-10 h 300 v 100"
                style="fill:none;stroke:#000000;stroke-width:3">
            </path>
            <use xlink:href="#pos_charge" x="140" y="-110"></use>
            <use xlink:href="#neg_charge" x="170" y="-110"></use>
        </g>
        <g
            id="body">
            <use xlink:href="#box" x="0" y="0"></use>
            <use xlink:href="#n_side" x="4" y="8"></use>
            <use xlink:href="#depletion_zone" x="310" y="8"></use>
            <use xlink:href="#p_side" x="344" y="8"></use>
            <use xlink:href="#depletion_zone" x="444" y="8"></use>
            <use xlink:href="#n_side" x="474" y="8"></use>
            <use xlink:href="#potential_fwd" x="280" y="0"></use>
            <use xlink:href="#potential_rev" x="420" y="0"></use>
            <use xlink:href="#terminal" x="150" y="-10"></use>
            <use xlink:href="#terminal" x="380" y="-10"></use>
            <use xlink:href="#terminal" x="610" y="-10"></use>
            <use xlink:href="#circuit_small" x="395" y="0"></use>
            <use xlink:href="#circuit_large" x="165" y="0"></use>
            <use xlink:href="#electron" x="50" y="60"></use>
            <use xlink:href="#electron" x="80" y="60"></use>
            <use xlink:href="#electron" x="110" y="60"></use>
            <use xlink:href="#electron" x="140" y="60"></use>
            <use xlink:href="#electron" x="170" y="60"></use>
            <use xlink:href="#electron" x="570" y="60"></use>
            <use xlink:href="#electron" x="585" y="60"></use>
            <use xlink:href="#electron" x="600" y="60"></use>
            <use xlink:href="#electron" x="615" y="60"></use>
            <use xlink:href="#electron" x="630" y="60"></use>
            <use xlink:href="#electron" x="645" y="60"></use>
            <use xlink:href="#electron" x="660" y="60"></use>
            <use xlink:href="#electron" x="675" y="60"></use>
            <use xlink:href="#electron" x="690" y="60"></use>
            <use xlink:href="#electron" x="705" y="60"></use>
            <use xlink:href="#electron" x="720" y="60"></use>
            <use xlink:href="#electron" x="735" y="60"></use>
            <use xlink:href="#hole" x="360" y="60"></use>
            <use xlink:href="#hole" x="390" y="60"></use>
            <use xlink:href="#hole" x="420" y="60"></use>
            <path d="M 400 100 L 650 100" style="stroke:#0000ff;stroke-width:8;marker-end:url(#arrow_head)"></path>
            <path d="M 650 200 L 420 200" style="stroke:#ff0000;stroke-width:20;marker-end:url(#arrow_head)"></path>
            <path d="M 380 200 L 150 200" style="stroke:#ff0000;stroke-width:15;marker-end:url(#arrow_head)"></path>
            <path d="M 420 280 L 650 280" style="stroke:#0000ff;stroke-width:15;marker-end:url(#arrow_head)"></path>
            <path d="M 150 280 L 380 280" style="stroke:#0000ff;stroke-width:15;marker-end:url(#arrow_head)"></path>
        </g>
        <rect
            id="leg_p_side"
            x="0"
            y="0"
            width="30"
            height="30"
            style="fill:#ff0000;fill-opacity:0.2;stroke:none">
        </rect>
        <rect
            id="leg_n_side"
            x="0"
            y="0"
            width="30"
            height="30"
            style="fill:#00ffff;fill-opacity:0.2;stroke:none">
        </rect>
        <rect
            id="leg_dep_zone"
            x="0"
            y="0"
            width="30"
            height="30"
            style="fill:#ffff00;fill-opacity:0.5;stroke:none">
        </rect>
        <g
            id="legend">
            <use xlink:href="#leg_p_side" x="8" y="35"></use>
            <use xlink:href="#leg_n_side" x="88" y="35"></use>
            <use xlink:href="#leg_dep_zone" x="159" y="35"></use>
            <use xlink:href="#neutral_atom" x="270" y="50"></use>
            <use xlink:href="#pos_ion" x="360" y="50"></use>
            <use xlink:href="#neg_ion" x="450" y="50"></use>
            <use xlink:href="#hole" x="540" y="50"></use>
            <use xlink:href="#electron" x="620" y="50"></use>
            <text
                font-family="Ubuntu"
                font-size="12"
                font-weight="norm"
                fill="#000000">
                <tspan x="35" y="55">P-type</tspan>
                <tspan x="115" y="55">N-type</tspan>
                <tspan x="190" y="50">Depletion</tspan>
                <tspan x="200" y="63">Zone</tspan>
                <tspan x="290" y="50">Neutral</tspan>
                <tspan x="295" y="63">Atom</tspan>
                <tspan x="380" y="50">Positive</tspan>
                <tspan x="395" y="63">Ion</tspan>
                <tspan x="470" y="50">Negative</tspan>
                <tspan x="485" y="63">Ion</tspan>
                <tspan x="550" y="55">Hole</tspan>
                <tspan x="640" y="50">Free</tspan>
                <tspan x="630" y="63">Electron</tspan>
            </text>
        </g>
    </defs>
    <g
        id="page1">
        <g
            id="layer1"
            style="display:inline">
            <rect
                x="0"
                y="0"
                width="800"
                height="600"
                fill="white">
            </rect>
        </g>
        <g
            id="layer2"
            style="display:inline">
            <use xlink:href="#headline" x="150" y="40"></use>
            <use xlink:href="#body" x="6" y="170"></use>
            <use xlink:href="#title_1" x="50" y="200"></use>
            <use xlink:href="#title_2" x="260" y="90"></use>
            <use xlink:href="#legend" x="30" y="510"></use>
        </g>
    </g> <!--page1-->
</svg>