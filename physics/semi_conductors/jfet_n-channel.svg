<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    id="svg1"
    version="1.1"
    viewBox="0 0 800 600"
    width="800"
    height="600"
    preserveAspectRatio="xMidYMid"
    fill-rule="evenodd"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:svg="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <marker
            id="arrow_head"
            style="overflow:visible"
            viewBox="0 0 4 6"
            markerWidth="4"
            markerHeight="6"
            refX="left"
            refY="center"
            orient="auto-start-reverse"
            preserveAspectRatio="xMidYMid">
            <path
                style="fill:context-fill;stroke:context-stroke"
                d="M -6,-2 L 0,0 L -6,2">
            </path>
        </marker>
        <text
            id="headline"
            font-family="Ubuntu"
            font-size="28"
            font-weight="bold"
            fill="#000000">
            <tspan x="0" y="0">Junction Field Effect Transistor</tspan>
            <tspan x="100" y="30">JFET N-channel</tspan>
        </text>
        <text
            id="title_1"
            font-family="Ubuntu"
            font-size="22"
            font-weight="bold"
            fill="#000000">
            <tspan x="55" y="50">Source</tspan>
            <tspan x="325" y="50">Gate</tspan>
            <tspan x="325" y="310">Gate</tspan>
            <tspan x="585" y="50">Drain</tspan>
            <tspan x="530" y="210">Pinch-Off</tspan>
            <tspan x="550" y="230">Point</tspan>
        </text>
        <text
            id="title_2"
            font-family="Ubuntu"
            font-size="24"
            font-weight="bold"
            fill="#000000">
            <tspan x="-75" y="65">Vgs</tspan>
            <tspan x="160" y="12">Vds</tspan>
        </text>
        <circle
            id="point"
            cx="0"
            cy="0"
            r="5"
            style="fill-opacity:1;stroke:none">
        </circle>
        <text
            id="neutral_atom_label"
            font-family="Ubuntu"
            font-size="18"
            font-weight="norm"
            fill="#000000">
            <tspan x="-5" y="6">0</tspan>
        </text>
        <g
            id="neutral_atom">
            <use xlink:href="#ion"></use>
            <use xlink:href="#neutral_atom_label"></use>
        </g>
        <circle
            id="ion"
            cx="0"
            cy="0"
            r="15"
            style="fill:none;stroke:#000000;stroke-width:2;stroke-opacity:1">
        </circle>
        <path
            id="pos_charge"
            d="m 0,-5 v 10 m -5,-5 h 10"
            style="fill:none;stroke:#0000ff;stroke-width:2;stroke-opacity:1">
        </path>
        <path
            id="neg_charge"
            d="m -5,0 h 10"
            style="fill:none;stroke:#ff0000;stroke-width:2;stroke-opacity:1">
        </path>
        <g
            id="pos_ion">
            <use xlink:href="#ion"></use>
            <use xlink:href="#pos_charge"></use>
        </g>
        <g
            id="neg_ion">
            <use xlink:href="#ion"></use>
            <use xlink:href="#neg_charge"></use>
        </g>
        <rect
            id="box"
            x="4"
            y="4"
            width="780"
            height="300"
            style="fill:none;stroke:#000000;stroke-width:8">
        </rect>
        <rect
            id="terminal"
            x="0"
            y="0"
            width="30"
            height="10"
            style="fill:#000000;stroke:#000000;stroke-width:5;stroke-linecap:round;stroke-linejoin:round">
        </rect>
        <rect
            id="n_side1"
            x="0"
            y="0"
            width="300"
            height="50"
            style="fill:#ff0000;fill-opacity:0.2;stroke:none">
        </rect>
        <polygon
            id="n_side2"
            x="0"
            y="0"
            width="300"
            height="50"
            points="0,0 50,0 50,250 730,250 730,0 780,0 780,292 0,292"
            style="fill:#ff0000;fill-opacity:0.2;stroke:none">
        </polygon>
        <path
            id="p_side"
            d="m 50,0 h 151.5 c 0,70 40,80.5 80,80.5 h 200 c 40,0 81,-10 81,-80.5 h 166.9 c -50,80 -100,200 -679.5,249.5 z"
            style="fill:#00ffff;fill-opacity:0.2;stroke:none">
        </path>
        <path
            id="depletion_zone1"
            style="fill:#ffff00;fill-opacity:0.2;stroke:none"
            d="m 0,0 c 0,70 40,80 80,80 h 200 c 40,0 80,-10 80,-80 h -29.5 v 50.5 h -301 v -50.5 z">
        </path>
        <path
            id="depletion_zone2"
            style="fill:#ffff00;fill-opacity:0.2;stroke:none"
            d="m 0,0 c -50,80 -100,200 -680,250 h 680 z">
        </path>
        <path
            id="dep_inc1"
            style="fill:none;stroke:#000000;stroke-width:1.5;stroke-opacity:0.5;stroke-dasharray:4 2"
            d="m 0,0 c 0,70 40,80 80,80 h 200 c 40,0 80,-10 80,-80">
        </path>
        <path
            id="dep_inc2"
            style="fill:none;stroke:#000000;stroke-width:1.5;stroke-opacity:0.5;stroke-dasharray:4 2"
            d="m 0,0 c -50,80 -100,200 -680,250">
        </path>
        <g
            id="ps">
            <path d="m 0,0 h 60 m -50,10 h 40"></path>
            <text
                font-family="Ubuntu"
                font-size="36"
                font-weight="norm"
                fill="#000000"
                stroke-width="1">
                <tspan x="35" y="-10">+</tspan>
                <tspan x="35" y="20">_</tspan>
            </text>
        </g>
        <g
            id="circuit_small">
            <g
                style="fill:none;stroke:#000000;stroke-width:3">
                <path d="m 0,0 v -55 h 125 m 10,0 h 125 v 55"></path>
                <use xlink:href="#ps" x="95" y="-55" transform="rotate(-90,125,-55)"></use>
            </g>
            <path
                d="m 150,-25 l -40,-60"
                style="fill:none;stroke:#000000;stroke-width:2.5;stroke-opacity:1;marker-end:url(#arrow_head)">
            </path>
        </g>
        <g
            id="circuit_large">
            <g
                style="fill:none;stroke:#000000;stroke-width:3">
                <path d="m 0,0 v -110 h 360 m 10,0 h 150 v 110"></path>
                <use xlink:href="#ps" x="331" y="-110" transform="rotate(-90,361,-110)"></use>
            </g>
            <g
                style="fill:none;stroke:#000000;stroke-width:2;stroke-dasharray: 1 1;fill-opacity:0.5">
                <path d="m 320,-110 v 70 h 40 m 10,0 h 40 v -70"></path>
                <use xlink:href="#ps" x="340" y="-40" transform="rotate(90,370,-40)"></use>
            </g>
        </g>
        <g
            id="body">
            <use xlink:href="#box" x="0" y="0"></use>
            <use xlink:href="#n_side1" x="240" y="8"></use>
            <use xlink:href="#n_side2" x="8" y="8"></use>
            <use xlink:href="#p_side" x="8" y="8"></use>
            <use xlink:href="#depletion_zone1" x="210" y="8"></use>
            <use xlink:href="#depletion_zone2" x="738" y="8"></use>
            <use xlink:href="#dep_inc1" x="179" y="8" transform="scale(1.09)"></use>
            <use xlink:href="#dep_inc1" x="158" y="8" transform="scale(1.18)"></use>
            <use xlink:href="#dep_inc1" x="138" y="8" transform="scale(1.26)"></use>
            <use xlink:href="#dep_inc2" x="738" y="8" transform="rotate(1,738,8)"></use>
            <use xlink:href="#dep_inc2" x="738" y="8" transform="rotate(6,738,8)"></use>
            <use xlink:href="#dep_inc2" x="738" y="8" transform="rotate(12,738,8)"></use>
            <use xlink:href="#terminal" x="120" y="-10"></use>
            <use xlink:href="#terminal" x="380" y="-10"></use>
            <use xlink:href="#terminal" x="640" y="-10"></use>
            <use xlink:href="#circuit_small" x="135" y="0"></use>
            <use xlink:href="#circuit_large" x="135" y="0"></use>
            <use xlink:href="#point" x="120" y="150" fill="#ff0000"></use>
            <use xlink:href="#point" x="150" y="150" fill="#ff0000"></use>
            <use xlink:href="#point" x="180" y="150" fill="#ff0000"></use>
            <use xlink:href="#point" x="120" y="180" fill="#ff0000"></use>
            <use xlink:href="#point" x="150" y="180" fill="#ff0000"></use>
            <use xlink:href="#point" x="180" y="180" fill="#ff0000"></use>
            <use xlink:href="#point" x="120" y="210" fill="#ff0000"></use>
            <use xlink:href="#point" x="150" y="210" fill="#ff0000"></use>
            <use xlink:href="#point" x="180" y="210" fill="#ff0000"></use>
            <path
                d="m 270,120 h 250"
                style="fill:none;stroke:#ff0000;stroke-width:8;marker-start:url(#arrow_head);marker-end:url(#arrow_head)">
            </path>
            <path
                d="m 295,150 h 200"
                style="opacity:0.5;fill:none;stroke:#ff0000;stroke-width:5;marker-start:url(#arrow_head);marker-end:url(#arrow_head)">
            </path>
            <path
                d="m 320,180 h 150"
                style="opacity:0.3;fill:none;stroke:#ff0000;stroke-width:5;marker-start:url(#arrow_head);marker-end:url(#arrow_head)">
            </path>
            <path
                d="m 580,170 v -60"
                style="fill:none;stroke:#000000;stroke-width:2;marker-end:url(#arrow_head)">
            </path>
            <path
                d="m 30,40 c 80,40 160,40 240,0"
                style="fill:none;stroke:#000000;stroke-width:2;stroke-dasharray:1 2">
            </path>
            <use xlink:href="#point" x="30" y="40" fill="#000000"></use>
            <use xlink:href="#point" x="270" y="40" fill="#000000"></use>
        </g>
        <rect
            id="leg_p_side"
            x="0"
            y="0"
            width="30"
            height="30"
            style="fill:#ff0000;fill-opacity:0.2;stroke:none">
        </rect>
        <rect
            id="leg_n_side"
            x="0"
            y="0"
            width="30"
            height="30"
            style="fill:#00ffff;fill-opacity:0.2;stroke:none">
        </rect>
        <rect
            id="leg_dep_zone"
            x="0"
            y="0"
            width="30"
            height="30"
            style="fill:#ffff00;fill-opacity:0.5;stroke:none">
        </rect>
        <g
            id="legend">
            <use xlink:href="#leg_p_side" x="0" y="0"></use>
            <use xlink:href="#leg_n_side" x="80" y="0"></use>
            <use xlink:href="#leg_dep_zone" x="151" y="0"></use>
            <use xlink:href="#neutral_atom" x="262" y="15"></use>
            <use xlink:href="#pos_ion" x="352" y="15"></use>
            <use xlink:href="#neg_ion" x="442" y="15"></use>
            <use xlink:href="#point" x="532" y="15" fill="#0000ff"></use>
            <use xlink:href="#point" x="612" y="15" fill="#ff0000"></use>
            <text
                font-family="Ubuntu"
                font-size="12"
                font-weight="norm"
                fill="#000000">
                <tspan x="30" y="20">P-type</tspan>
                <tspan x="110" y="20">N-type</tspan>
                <tspan x="181" y="10">Depletion</tspan>
                <tspan x="195" y="23">Zone</tspan>
                <tspan x="277" y="10">Neutral</tspan>
                <tspan x="282" y="23">Atom</tspan>
                <tspan x="367" y="10">Positive</tspan>
                <tspan x="377" y="23">Ion</tspan>
                <tspan x="457" y="10">Negative</tspan>
                <tspan x="473" y="23">Ion</tspan>
                <tspan x="537" y="19">Hole</tspan>
                <tspan x="627" y="10">Free</tspan>
                <tspan x="617" y="23">Electron</tspan>
            </text>
        </g>
    </defs>
    <g
        id="page1">
        <g
            id="layer1"
            style="display:inline">
            <rect
                x="0"
                y="0"
                width="800"
                height="600"
                fill="white">
            </rect>
        </g>
        <g
            id="layer2"
            style="display:inline">
            <use xlink:href="#headline" x="200" y="40"></use>
            <use xlink:href="#body" x="6" y="220"></use>
            <use xlink:href="#title_1" x="50" y="200"></use>
            <use xlink:href="#title_2" x="260" y="90"></use>
            <use xlink:href="#legend" x="70" y="555"></use>
        </g>
    </g> <!--page1-->
</svg>