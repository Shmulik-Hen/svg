<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    id="svg1"
    version="1.1"
    viewBox="0 0 800 600"
    width="800"
    height="600"
    preserveAspectRatio="xMidYMid"
    fill-rule="evenodd"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:svg="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <text
            id="headline"
            font-family="Ubuntu"
            font-size="28"
            font-weight="bold"
            fill="#000000">
            <tspan>P-type Lattice - Positively Charged</tspan>
        </text>
        <circle
            id="hole"
            cx="0"
            cy="0"
            r="5"
            style="fill:#0000ff;fill-opacity:1;stroke:none">
        </circle>
        <circle
            id="electron"
            cx="0"
            cy="0"
            r="5"
            style="fill:#ff0000;fill-opacity:1;stroke:none">
        </circle>
        <circle
            id="atom"
            cx="10"
            cy="0"
            r="30"
            style="fill:none;stroke:#000000;stroke-width:2;stroke-opacity:1">
        </circle>
        <text
            id="silicon_label"
            font-family="Ubuntu"
            font-size="22"
            font-weight="norm"
            fill="#000000">
            <tspan x="0" y="5">Si⁰</tspan>
        </text>
        <text
            id="boron_label"
            font-family="Ubuntu"
            font-size="22"
            font-weight="norm"
            fill="#000000">
            <tspan x="0" y="5">B⁰</tspan>
        </text>
        <g
            id="silicon_atom">
            <use xlink:href="#atom"></use>
            <use xlink:href="#silicon_label"></use>
        </g>
        <g
            id="boron_atom">
            <use xlink:href="#atom"></use>
            <use xlink:href="#hole" x="40"></use>
            <use xlink:href="#boron_label"></use>
        </g>
        <circle
            id="ion"
            cx="0"
            cy="0"
            r="15"
            style="fill:none;stroke:#000000;stroke-width:2;stroke-opacity:1">
        </circle>
        <path
            id="covalent_bond_h"
            d="m 0,0 h 40"
            style="fill:none;stroke:#000000;stroke-width:2;stroke-opacity:1">
        </path>
        <path
            id="covalent_bond_v"
            d="m 0,0 v 40"
            style="fill:none;stroke:#000000;stroke-width:2;stroke-opacity:1">
        </path>
        <g
            id="si_atoms">
            <use xlink:href="#silicon_atom" x="0" y="0"></use>
            <use xlink:href="#silicon_atom" x="110" y="0"></use>
            <use xlink:href="#silicon_atom" x="220" y="0"></use>
            <use xlink:href="#silicon_atom" x="330" y="0"></use>
            <use xlink:href="#silicon_atom" x="440" y="0"></use>
            <use xlink:href="#silicon_atom" x="550" y="0"></use>
            <use xlink:href="#silicon_atom" x="660" y="0"></use>
        </g>
        <g
            id="si_atoms_odd">
            <use xlink:href="#silicon_atom" x="0" y="0"></use>
            <use xlink:href="#silicon_atom" x="220" y="0"></use>
            <use xlink:href="#silicon_atom" x="440" y="0"></use>
            <use xlink:href="#silicon_atom" x="660" y="0"></use>
        </g>
        <g
            id="si_atoms_even">
            <use xlink:href="#silicon_atom" x="110" y="0"></use>
            <use xlink:href="#silicon_atom" x="330" y="0"></use>
            <use xlink:href="#silicon_atom" x="550" y="0"></use>
        </g>
        <g
            id="boron_atoms_odd">
            <use xlink:href="#boron_atom" x="110" y="0"></use>
            <use xlink:href="#boron_atom" x="330" y="0"></use>
            <use xlink:href="#boron_atom" x="550" y="0"></use>
        </g>
        <g
            id="boron_atoms_even">
            <use xlink:href="#boron_atom" x="0" y="0"></use>
            <use xlink:href="#boron_atom" x="220" y="0"></use>
            <use xlink:href="#boron_atom" x="440" y="0"></use>
            <use xlink:href="#boron_atom" x="660" y="0"></use>
        </g>
        <g
            id="cov_bonds_h">
            <use xlink:href="#covalent_bond_h" x="-110" y="0"></use>
            <use xlink:href="#covalent_bond_h" x="0" y="0"></use>
            <use xlink:href="#covalent_bond_h" x="110" y="0"></use>
            <use xlink:href="#covalent_bond_h" x="220" y="0"></use>
            <use xlink:href="#covalent_bond_h" x="330" y="0"></use>
            <use xlink:href="#covalent_bond_h" x="440" y="0"></use>
            <use xlink:href="#covalent_bond_h" x="550" y="0"></use>
            <use xlink:href="#covalent_bond_h" x="660" y="0"></use>
        </g>
        <g
            id="cov_bonds_h_odd">
            <use xlink:href="#covalent_bond_h" x="-65" y="0"></use>
            <use xlink:href="#covalent_bond_h" x="45" y="0"></use>
            <use xlink:href="#covalent_bond_h" x="265" y="0"></use>
            <use xlink:href="#covalent_bond_h" x="485" y="0"></use>
            <use xlink:href="#covalent_bond_h" x="705" y="0"></use>
        </g>
        <g
            id="cov_bonds_h_even">
            <use xlink:href="#covalent_bond_h" x="-65" y="0"></use>
            <use xlink:href="#covalent_bond_h" x="155" y="0"></use>
            <use xlink:href="#covalent_bond_h" x="375" y="0"></use>
            <use xlink:href="#covalent_bond_h" x="595" y="0"></use>
        </g>
        <g
            id="cov_bonds_v">
            <use xlink:href="#covalent_bond_v" x="0" y="-105"></use>
            <use xlink:href="#covalent_bond_v" x="110" y="-105"></use>
            <use xlink:href="#covalent_bond_v" x="220" y="-105"></use>
            <use xlink:href="#covalent_bond_v" x="330" y="-105"></use>
            <use xlink:href="#covalent_bond_v" x="440" y="-105"></use>
            <use xlink:href="#covalent_bond_v" x="550" y="-105"></use>
            <use xlink:href="#covalent_bond_v" x="660" y="-105"></use>
            <use xlink:href="#covalent_bond_v" x="660" y="-105"></use>
        </g>
        <g
            id="p_lattice">
            <use xlink:href="#si_atoms_odd" x="0" y="0"></use>
            <use xlink:href="#si_atoms_even" x="0" y="105"></use>
            <use xlink:href="#si_atoms_odd" x="0" y="210"></use>
            <use xlink:href="#si_atoms_even" x="0" y="315"></use>
            <use xlink:href="#boron_atoms_odd" x="0" y="0"></use>
            <use xlink:href="#boron_atoms_even" x="0" y="105"></use>
            <use xlink:href="#boron_atoms_odd" x="0" y="210"></use>
            <use xlink:href="#boron_atoms_even" x="0" y="315"></use>
            <use xlink:href="#cov_bonds_h_odd" x="0" y="0"></use>
            <use xlink:href="#cov_bonds_h_even" x="0" y="105"></use>
            <use xlink:href="#cov_bonds_h_odd" x="0" y="210"></use>
            <use xlink:href="#cov_bonds_h_even" x="0" y="315"></use>
            <use xlink:href="#cov_bonds_v" x="10" y="32.5"></use>
            <use xlink:href="#cov_bonds_v" x="10" y="137.5"></use>
            <use xlink:href="#cov_bonds_v" x="10" y="242.5"></use>
            <use xlink:href="#cov_bonds_v" x="10" y="347.5"></use>
            <use xlink:href="#cov_bonds_v" x="10" y="452.5"></use>
        </g>
        <g
            id="body">
            <use xlink:href="#p_lattice" x="50" y="50"></use>
        </g>
        <g
            id="legend">
            <use xlink:href="#silicon_atom" x="30" y="50"></use>
            <use xlink:href="#boron_atom" x="240" y="50"></use>
            <use xlink:href="#covalent_bond_h" x="530" y="50"></use>
            <text
                font-family="Ubuntu"
                font-size="16"
                font-weight="norm"
                fill="#000000">
                <tspan x="75" y="50">Silicon atom</tspan>
                <tspan x="75" y="65">4 Valent electrons</tspan>
                <tspan x="295" y="40">Boron atom - Acceptor</tspan>
                <tspan x="295" y="55">3 Valent electrons -</tspan>
                <tspan x="295" y="70">a missing electron="Hole"</tspan>
                <tspan x="580" y="55">Covalent bond</tspan>
            </text>
        </g>
    </defs>
    <g
        id="page1">
        <g
            id="layer1"
            style="display:inline">
            <rect
                x="0"
                y="0"
                width="800"
                height="600"
                fill="white">
            </rect>
        </g>
        <g
            id="layer2"
            style="display:inline">
            <use xlink:href="#headline" x="170" y="40"></use>
            <use xlink:href="#body" x="30" y="90" transform="scale(0.95)"></use>
            <use xlink:href="#legend" x="30" y="500"></use>
        </g>
    </g> <!--page1-->
</svg>