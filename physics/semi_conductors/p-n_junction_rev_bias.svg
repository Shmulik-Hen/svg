<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    id="svg1"
    version="1.1"
    viewBox="0 0 800 600"
    width="800"
    height="600"
    preserveAspectRatio="xMidYMid"
    fill-rule="evenodd"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:svg="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <marker
            id="arrow_head"
            style="overflow:visible"
            viewBox="0 0 4 6"
            markerWidth="4"
            markerHeight="6"
            refX="left"
            refY="center"
            orient="auto-start-reverse"
            preserveAspectRatio="xMidYMid">
            <path
                style="fill:none;stroke:context-stroke;stroke-width:1;stroke-linecap:butt"
                d="M -3,-3 L 0,0 L -3,3">
            </path>
        </marker>
        <text
            id="headline"
            font-family="Ubuntu"
            font-size="28"
            font-weight="bold"
            fill="#000000">
            <tspan>Single Junction - Diode in Reverse Bias</tspan>
        </text>
        <text
            id="title_1"
            font-family="Ubuntu"
            font-size="14"
            font-weight="bold"
            fill="#000000">
            <tspan x="350" y="0">Depletion</tspan>
            <tspan x="370" y="25">Zone</tspan>
            <tspan x="175" y="20">Potential</tspan>
            <tspan x="170" y="40">Difference</tspan>
        </text>
        <text
            id="title_2"
            font-family="Ubuntu"
            font-size="14"
            font-weight="bold"
            fill="#000000">
            <tspan x="280" y="0">No current!</tspan>
        </text>
        <circle
            id="hole"
            cx="0"
            cy="0"
            r="5"
            style="fill:#0000ff;fill-opacity:1;stroke:none">
        </circle>
        <circle
            id="electron"
            cx="0"
            cy="0"
            r="5"
            style="fill:#ff0000;fill-opacity:1;stroke:none">
        </circle>
        <circle
            id="atom"
            cx="10"
            cy="0"
            r="30"
            style="fill:none;stroke:#000000;stroke-width:2;stroke-opacity:1">
        </circle>
        <text
            id="neutral_atom_label"
            font-family="Ubuntu"
            font-size="18"
            font-weight="norm"
            fill="#000000">
            <tspan x="-5" y="6">0</tspan>
        </text>
        <text
            id="boron_ion_label"
            font-family="Ubuntu"
            font-size="22"
            font-weight="norm"
            fill="#000000">
            <tspan x="0" y="5">B⁻</tspan>
        </text>
        <text
            id="phosphorus_ion_label"
            font-family="Ubuntu"
            font-size="22"
            font-weight="norm"
            fill="#000000">
            <tspan x="0" y="5">P⁺</tspan>
        </text>
        <g
            id="neutral_atom">
            <use xlink:href="#ion"></use>
            <use xlink:href="#neutral_atom_label"></use>
        </g>
        <g
            id="boron_ion">
            <use xlink:href="#atom"></use>
            <use xlink:href="#boron_ion_label"></use>
        </g>
        <g
            id="phosphorus_ion">
            <use xlink:href="#atom"></use>
            <use xlink:href="#phosphorus_ion_label"></use>
        </g>
        <circle
            id="ion"
            cx="0"
            cy="0"
            r="15"
            style="fill:none;stroke:#000000;stroke-width:2;stroke-opacity:1">
        </circle>
        <path
            id="pos_charge"
            d="m 0,-13 v 28 m -13,-14.5 h 28"
            style="fill:none;stroke:#0000ff;stroke-width:2;stroke-opacity:1">
        </path>
        <path
            id="neg_charge"
            d="m -14,0 h 28"
            style="fill:none;stroke:#ff0000;stroke-width:2;stroke-opacity:1">
        </path>
        <g
            id="pos_ion">
            <use xlink:href="#ion"></use>
            <use xlink:href="#pos_charge"></use>
        </g>
        <g
            id="neg_ion">
            <use xlink:href="#ion"></use>
            <use xlink:href="#neg_charge"></use>
        </g>
        <g
            id="pos_ions">
            <use xlink:href="#pos_ion" x="15" y="30"></use>
            <use xlink:href="#pos_ion" x="105" y="30"></use>
            <use xlink:href="#pos_ion" x="195" y="30"></use>
            <use xlink:href="#pos_ion" x="285" y="30"></use>
            <use xlink:href="#pos_ion" x="60" y="80"></use>
            <use xlink:href="#pos_ion" x="150" y="80"></use>
            <use xlink:href="#pos_ion" x="240" y="80"></use>
        </g>
        <g
            id="neutral_atoms">
            <use xlink:href="#neutral_atom" x="0" y="30"></use>
            <use xlink:href="#neutral_atom" x="90" y="30"></use>
            <use xlink:href="#neutral_atom" x="180" y="30"></use>
            <use xlink:href="#neutral_atom" x="45" y="80"></use>
            <use xlink:href="#neutral_atom" x="135" y="80"></use>
            <use xlink:href="#neutral_atom" x="225" y="80"></use>
        </g>
        <g
            id="neg_ions">
            <use xlink:href="#neg_ion" x="15" y="30"></use>
            <use xlink:href="#neg_ion" x="105" y="30"></use>
            <use xlink:href="#neg_ion" x="195" y="30"></use>
            <use xlink:href="#neg_ion" x="285" y="30"></use>
            <use xlink:href="#neg_ion" x="60" y="80"></use>
            <use xlink:href="#neg_ion" x="150" y="80"></use>
            <use xlink:href="#neg_ion" x="240" y="80"></use>
        </g>
        <g
            id="dep_pos_ions">
            <use xlink:href="#pos_ion" x="0" y="0"></use>
            <use xlink:href="#pos_ion" x="0" y="40"></use>
            <use xlink:href="#pos_ion" x="0" y="80"></use>
            <use xlink:href="#pos_ion" x="0" y="120"></use>
            <use xlink:href="#pos_ion" x="0" y="160"></use>
            <use xlink:href="#pos_ion" x="0" y="200"></use>
            <use xlink:href="#pos_ion" x="0" y="240"></use>
            <use xlink:href="#pos_ion" x="0" y="280"></use>
        </g>
        <g
            id="dep_neg_ions">
            <use xlink:href="#neg_ion" x="0" y="0"></use>
            <use xlink:href="#neg_ion" x="0" y="40"></use>
            <use xlink:href="#neg_ion" x="0" y="80"></use>
            <use xlink:href="#neg_ion" x="0" y="120"></use>
            <use xlink:href="#neg_ion" x="0" y="160"></use>
            <use xlink:href="#neg_ion" x="0" y="200"></use>
            <use xlink:href="#neg_ion" x="0" y="240"></use>
            <use xlink:href="#neg_ion" x="0" y="280"></use>
        </g>
        <g
            id="free_electrons">
            <use xlink:href="#electron" x="95" y="0"></use>
            <use xlink:href="#electron" x="185" y="0"></use>
            <use xlink:href="#electron" x="275" y="0"></use>
            <use xlink:href="#electron" x="50" y="50"></use>
            <use xlink:href="#electron" x="140" y="50"></use>
            <use xlink:href="#electron" x="230" y="50"></use>
        </g>
        <g
            id="holes">
            <use xlink:href="#hole" x="80" y="0"></use>
            <use xlink:href="#hole" x="170" y="0"></use>
            <use xlink:href="#hole" x="260" y="0"></use>
            <use xlink:href="#hole" x="35" y="50"></use>
            <use xlink:href="#hole" x="125" y="50"></use>
            <use xlink:href="#hole" x="215" y="50"></use>
        </g>
        <rect
            id="box"
            x="0"
            y="0"
            width="780"
            height="350"
            style="fill:none;stroke:#000000;stroke-width:8">
        </rect>
        <rect
            id="terminal"
            x="0"
            y="0"
            width="20"
            height="150"
            style="fill:#000000;stroke:#000000;stroke-width:5;stroke-linecap:round;stroke-linejoin:round">
        </rect>
        <rect
            id="n_side"
            x="0"
            y="0"
            width="277"
            height="346"
            style="fill:#00ffff;fill-opacity:0.2;stroke:none">
        </rect>
        <rect
            id="p_side"
            x="0"
            y="0"
            width="275"
            height="346"
            style="fill:#ff0000;fill-opacity:0.2;stroke:none">
        </rect>
        <rect
            id="depletion_zone"
            x="0"
            y="0"
            width="220"
            height="346"
            style="fill:#ffff00;fill-opacity:0.3;stroke:none">
        </rect>
        <path
            id="barrier"
            d="m 0,0 v 440"
            style="fill:none;stroke:#000000;stroke-width:5;stroke-opacity:0.3;stroke-dasharray:4 4">
        </path>
        <g
            id="potential">
            <path
                d="m 0,0 v -56 h 135 m 0,-20 v 40 m 10,-33 v 25 m 0,-12.5 h 135 v 56"
                style="fill:none;stroke:#000000;stroke-width:5;stroke-opacity:1;stroke-dasharray:2 2">
            </path>
            <use xlink:href="#pos_charge" x="240" y="-130" transform="scale(0.50)"></use>
            <use xlink:href="#neg_charge" x="320" y="-130" transform="scale(0.50)"></use>
        </g>
        <g
            id="circuit">
            <path
                d="m 0,0 h -100 v 350 h 500 m 0,-20 v 40 m 20,-60 v 80 m 0,-40 h 500 v -350 h -100"
                style="fill:none;stroke:#000000;stroke-width:3">
            </path>
            <use xlink:href="#neg_charge" x="500" y="430" transform="scale(0.75)"></use>
            <use xlink:href="#pos_charge" x="600" y="430" transform="scale(0.75)"></use>
        </g>
        <path
            id="charge_move_long"
            d="m 0,0 c -30,15 -50,15 -250,15"
            style="fill:none;stroke:#000000;stroke-width:3;stroke-opacity:1;marker-end:url(#arrow_head)">
        </path>
        <path
            id="charge_move"
            d="m 0,0 c -30,15 -50,15 -230,15"
            style="fill:none;stroke:#000000;stroke-width:3;stroke-opacity:1">
        </path>
        <path
            id="charge_move_short"
            d="m 0,0 c -30,15 -50,15 -210,15"
            style="fill:none;stroke:#000000;stroke-width:3;stroke-opacity:1">
        </path>
        <g
            id="hole_move_long">
            <use xlink:href="#charge_move_long" x="0" y="0"></use>
            <use xlink:href="#hole" x="-255" y="15"></use>
        </g>
        <g
            id="hole_move">
            <use xlink:href="#charge_move" x="0" y="0"></use>
            <use xlink:href="#hole" x="-250" y="15"></use>
        </g>
        <g
            id="hole_move_short">
            <use xlink:href="#charge_move_short" x="0" y="0"></use>
            <use xlink:href="#hole" x="-245" y="15"></use>
        </g>
        <g
            id="electron_move_long">
            <use xlink:href="#charge_move_long" transform="scale(-1,1)"></use>
            <use xlink:href="#electron" x="255" y="15"></use>
        </g>
        <g
            id="electron_move">
            <use xlink:href="#charge_move" transform="scale(-1,1)"></use>
            <use xlink:href="#electron" x="250" y="15"></use>
        </g>
        <g
            id="electron_move_short">
            <use xlink:href="#charge_move_short" transform="scale(-1,1)"></use>
            <use xlink:href="#electron" x="245" y="15"></use>
        </g>
        <g
            id="body">
            <use xlink:href="#box" x="10" y="100"></use>
            <use xlink:href="#n_side" x="509" y="100"></use>
            <use xlink:href="#p_side" x="14" y="100"></use>
            <use xlink:href="#depletion_zone" x="289" y="100"></use>
            <use xlink:href="#barrier" x="400" y="100"></use>
            <use xlink:href="#potential" x="260" y="100"></use>
            <use xlink:href="#terminal" x="-9" y="200"></use>
            <use xlink:href="#terminal" x="789" y="200"></use>
            <use xlink:href="#circuit" x="-11" y="275"></use>
            <path d="M 120 -15 L 259 45" style="stroke:#000000;stroke-width:2;marker-end:url(#arrow_head)"></path>
            <path d="M 289 455 L 289 -70" style="stroke:#000000;stroke-width:2;stroke-opacity:1;stroke-dasharray:4 7"></path>
            <path d="M 509 455 L 509 -70" style="stroke:#000000;stroke-width:2;stroke-opacity:1;stroke-dasharray:4 7"></path>
            <path d="M 370 -15 H 290" style="stroke:#000000;stroke-width:5;marker-end:url(#arrow_head)"></path>
            <path d="M 420 -15 H 505" style="stroke:#000000;stroke-width:5;marker-end:url(#arrow_head)"></path>
            <path d="M 315 500 H 395" style="stroke:#000000;stroke-width:5;marker-end:url(#arrow_head)"></path>
            <use xlink:href="#neutral_atoms" x="40" y="120"></use>
            <use xlink:href="#neutral_atoms" x="40" y="220"></use>
            <use xlink:href="#neutral_atoms" x="40" y="320"></use>
            <use xlink:href="#neutral_atoms" x="535" y="120"></use>
            <use xlink:href="#neutral_atoms" x="535" y="220"></use>
            <use xlink:href="#neutral_atoms" x="535" y="320"></use>
            <use xlink:href="#holes" x="5" y="150"></use>
            <use xlink:href="#holes" x="5" y="250"></use>
            <use xlink:href="#holes" x="5" y="350"></use>
            <use xlink:href="#free_electrons" x="485" y="150"></use>
            <use xlink:href="#free_electrons" x="485" y="250"></use>
            <use xlink:href="#free_electrons" x="485" y="350"></use>
            <use xlink:href="#dep_neg_ions" x="370" y="130"></use>
            <use xlink:href="#dep_neg_ions" x="320" y="130"></use>
            <use xlink:href="#dep_pos_ions" x="425" y="130"></use>
            <use xlink:href="#dep_pos_ions" x="475" y="130"></use>
            <use xlink:href="#hole_move_long" x="220" y="260"></use>
            <use xlink:href="#hole_move" x="187" y="260"></use>
            <use xlink:href="#hole_move_short" x="154" y="260"></use>
            <use xlink:href="#electron_move_long" x="600" y="260"></use>
            <use xlink:href="#electron_move" x="625" y="260"></use>
            <use xlink:href="#electron_move_short" x="650" y="260"></use>
        </g>
        <g
            id="legend">
            <use xlink:href="#p_side" x="0" y="350" transform="scale(0.1)"></use>
            <use xlink:href="#n_side" x="800" y="350" transform="scale(0.1)"></use>
            <use xlink:href="#depletion_zone" x="1040" y="360" transform="scale(0.15,0.1)"></use>
            <use xlink:href="#neutral_atom" x="270" y="50"></use>
            <use xlink:href="#pos_ion" x="360" y="50"></use>
            <use xlink:href="#neg_ion" x="450" y="50"></use>
            <use xlink:href="#hole" x="540" y="50"></use>
            <use xlink:href="#electron" x="620" y="50"></use>
            <text
                font-family="Ubuntu"
                font-size="12"
                font-weight="norm"
                fill="#000000">
                <tspan x="35" y="55">P-type</tspan>
                <tspan x="115" y="55">N-type</tspan>
                <tspan x="190" y="50">Depletion</tspan>
                <tspan x="200" y="63">Zone</tspan>
                <tspan x="290" y="50">Neutral</tspan>
                <tspan x="295" y="63">Atom</tspan>
                <tspan x="380" y="50">Positive</tspan>
                <tspan x="395" y="63">Ion</tspan>
                <tspan x="470" y="50">Negative</tspan>
                <tspan x="485" y="63">Ion</tspan>
                <tspan x="550" y="55">Hole</tspan>
                <tspan x="640" y="50">Free</tspan>
                <tspan x="630" y="63">Electron</tspan>
            </text>
        </g>
    </defs>
    <g
        id="page1">
        <g
            id="layer1"
            style="display:inline">
            <rect
                x="0"
                y="0"
                width="800"
                height="600"
                fill="white">
            </rect>
        </g>
        <g
            id="layer2"
            style="display:inline">
            <use xlink:href="#headline" x="130" y="40"></use>
            <use xlink:href="#body" x="230" y="200" transform="scale(0.6)"></use>
            <use xlink:href="#title_1" x="0" y="70"></use>
            <use xlink:href="#title_2" x="60" y="450"></use>
            <use xlink:href="#legend" x="30" y="500"></use>
        </g>
    </g> <!--page1-->
</svg>