<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    id="svg1"
    version="1.1"
    viewBox="0 0 800 600"
    width="800"
    height="600"
    preserveAspectRatio="xMidYMid"
    fill-rule="evenodd"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:svg="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <marker
            id="arrow_head"
            style="overflow:visible"
            viewBox="0 0 4 6"
            markerWidth="4"
            markerHeight="6"
            refX="left"
            refY="center"
            orient="auto-start-reverse"
            preserveAspectRatio="xMidYMid">
            <path
                style="fill:none;stroke:context-stroke;stroke-width:1;stroke-linecap:butt"
                d="M -3,-3 L 0,0 L -3,3">
            </path>
        </marker>
        <text
            id="headline"
            font-family="Ubuntu"
            font-size="40"
            font-weight="bold"
            fill="#0000ff">
            <tspan>Covalent Bonds</tspan>
        </text>
        <circle
            id="nucleus"
            cx="0"
            cy="0"
            r="20"
            style="fill:none;stroke:#0000ff;stroke-width:2;stroke-opacity:1">
        </circle>
        <circle
            id="orbital"
            cx="0"
            cy="0"
            r="40"
            style="fill:none;stroke:#000000;stroke-width:1;stroke-opacity:1;stroke-dasharray:5,5">
        </circle>
        <circle
            id="electron"
            cx="0"
            cy="0"
            r="3"
            style="fill-opacity:1;stroke:none">
        </circle>
        <circle
            id="hole"
            cx="0"
            cy="0"
            r="6"
            style="fill:#ffffff;fill-opacity:1;stroke:#000000;stroke-width:1;stroke-opacity:1">
        </circle>
        <g
            id="cov_electron">
            <use xlink:href="#electron" fill="#000000"></use>
        </g>
        <g
            id="free_electron">
            <use xlink:href="#electron" fill="#ff0000"></use>
        </g>
        <g
            id="atom">
            <use xlink:href="#nucleus"></use>
            <use xlink:href="#orbital"></use>
        </g>
        <text
            id="silicon_label"
            font-family="Ubuntu"
            font-size="22"
            font-weight="norm"
            fill="#000000">
            <tspan>Si⁰</tspan>
        </text>
        <text
            id="boron_label"
            font-family="Ubuntu"
            font-size="22"
            font-weight="norm"
            fill="#000000">
            <tspan>B⁰</tspan>
        </text>
        <text
            id="phosphorus_label"
            font-family="Ubuntu"
            font-size="22"
            font-weight="norm"
            fill="#000000">
            <tspan>P⁰</tspan>
        </text>
        <g
            id="silicon_atom">
            <use xlink:href="#atom"></use>
            <use xlink:href="#silicon_label" x="-12" y="7"></use>
        </g>
        <g
            id="boron_atom">
            <use xlink:href="#atom"></use>
            <use xlink:href="#boron_label" x="-12" y="7"></use>
        </g>
        <g
            id="phosphorus_atom">
            <use xlink:href="#atom"></use>
            <use xlink:href="#phosphorus_label" x="-12" y="7"></use>
        </g>
        <g
            id="p_type">
            <use xlink:href="#silicon_atom" x="0" y="-5"></use>
            <use xlink:href="#boron_atom" x="5" y="70"></use>
            <use xlink:href="#silicon_atom" x="-70" y="70"></use>
            <use xlink:href="#silicon_atom" x="5" y="145"></use>
            <use xlink:href="#silicon_atom" x="75" y="70"></use>
            <use xlink:href="#cov_electron" x="-11" y="-43"></use>
            <use xlink:href="#cov_electron" x="17" y="-42"></use>
            <use xlink:href="#cov_electron" x="-11" y="33"></use>
            <use xlink:href="#cov_electron" x="17" y="33"></use>
            <use xlink:href="#cov_electron" x="-108" y="56"></use>
            <use xlink:href="#cov_electron" x="-32.5" y="56"></use>
            <use xlink:href="#hole" x="40" y="50"></use>
            <use xlink:href="#cov_electron" x="112" y="56"></use>
            <use xlink:href="#cov_electron" x="-108" y="85"></use>
            <use xlink:href="#cov_electron" x="-32.5" y="85"></use>
            <use xlink:href="#cov_electron" x="40" y="90"></use>
            <use xlink:href="#cov_electron" x="110" y="90"></use>
            <use xlink:href="#cov_electron" x="-8" y="107.5"></use>
            <use xlink:href="#cov_electron" x="20" y="107.55"></use>
            <use xlink:href="#cov_electron" x="-8" y="183"></use>
            <use xlink:href="#cov_electron" x="20" y="183"></use>
        </g>
        <g
            id="n_type">
            <use xlink:href="#silicon_atom" x="0" y="-5"></use>
            <use xlink:href="#phosphorus_atom" x="5" y="70"></use>
            <use xlink:href="#silicon_atom" x="-70" y="70"></use>
            <use xlink:href="#silicon_atom" x="5" y="145"></use>
            <use xlink:href="#silicon_atom" x="75" y="70"></use>
            <use xlink:href="#cov_electron" x="-11" y="-43"></use>
            <use xlink:href="#cov_electron" x="17" y="-42"></use>
            <use xlink:href="#cov_electron" x="-11" y="33"></use>
            <use xlink:href="#cov_electron" x="17" y="33"></use>
            <use xlink:href="#cov_electron" x="-108" y="56"></use>
            <use xlink:href="#cov_electron" x="-32.5" y="56"></use>
            <use xlink:href="#cov_electron" x="40" y="50"></use>
            <use xlink:href="#cov_electron" x="112" y="56"></use>
            <use xlink:href="#cov_electron" x="-108" y="85"></use>
            <use xlink:href="#cov_electron" x="-32.5" y="85"></use>
            <use xlink:href="#cov_electron" x="40" y="90"></use>
            <use xlink:href="#cov_electron" x="110" y="90"></use>
            <use xlink:href="#cov_electron" x="-8" y="107.5"></use>
            <use xlink:href="#cov_electron" x="20" y="107.55"></use>
            <use xlink:href="#free_electron" x="31" y="100"></use>
            <use xlink:href="#cov_electron" x="-8" y="183"></use>
            <use xlink:href="#cov_electron" x="20" y="183"></use>
        </g>
        <g
            id="legend">
            <use xlink:href="#cov_electron" x="5" y="10" transform="scale(5)"></use>
            <use xlink:href="#hole" x="55" y="10" transform="scale(5)"></use>
            <use xlink:href="#free_electron" x="120" y="10" transform="scale(5)"></use>
            <text
                font-family="Ubuntu"
                font-size="20"
                font-weight="bold"
                fill="#000000">
                <tspan x="50" y="58">Covalent Electron</tspan>
                <tspan x="315" y="58">Missing Electron - a "Hole"</tspan>
                <tspan x="620" y="58">Extra Electron</tspan>
            </text>
        </g>
    </defs>
    <g
        id="page1">
        <g
            id="layer1"
            style="display:inline">
            <rect
                id="white_background"
                x="0"
                y="0"
                width="800"
                height="600"
                fill="white">
            </rect>
        </g>
        <g
            id="layer2"
            style="display:inline">
            <use xlink:href="#headline" x="250" y="60"></use>
            <use xlink:href="#p_type" x="115" y="120" transform="scale(1.65)"></use>
            <use xlink:href="#n_type" x="365" y="120" transform="scale(1.65)"></use>
            <use xlink:href="#legend" x="30" y="500"></use>
            <text
                font-family="Ubuntu"
                font-size="28"
                font-weight="bold"
                fill="#000000">
                <tspan x="150" y="100">P-type</tspan>
                <tspan x="555" y="100">N-type</tspan>
            </text>
            <use xlink:href="#electron" fill="#c000c0" x="150" y="100" transform="scale(2)"></use>
            <path
                style="fill:none;stroke:#c000c0;stroke-width:2;stroke-linecap:butt;marker-end:url(#arrow_head)"
                d="M 300,200 l -37,70">
            </path>
            <use xlink:href="#electron" fill="#c000c0" x="360" y="210" transform="scale(2)"></use>
            <path
                style="fill:none;stroke:#c000c0;stroke-width:2;stroke-linecap:butt;marker-end:url(#arrow_head)"
                d="M 720,420 l -62,-53">
            </path>
        </g>
    </g> <!--page1-->
</svg>