<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    id="svg1"
    version="1.1"
    viewBox="0 0 800 600"
    width="800"
    height="600"
    preserveAspectRatio="xMidYMid"
    fill-rule="evenodd"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:svg="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <marker
            id="arrow_head"
            style="overflow:visible"
            viewBox="0 0 4 6"
            markerWidth="4"
            markerHeight="6"
            refX="left"
            refY="center"
            orient="auto-start-reverse"
            preserveAspectRatio="xMidYMid">
            <path
                style="fill:context-fill;stroke:context-stroke"
                d="M -6,-2 L 0,0 L -6,2">
            </path>
        </marker>
        <text
            id="headline"
            font-family="Ubuntu"
            font-size="28"
            font-weight="bold"
            fill="#000000">
            <tspan x="0" y="0">Junction Field Effect Transistor</tspan>
        </text>
        <text
            id="title_1"
            font-family="Ubuntu"
            font-size="24"
            font-weight="bold"
            fill="#0000ff">
            <tspan>Parallel Cross Section</tspan>
        </text>
        <text
            id="title_2"
            font-family="Ubuntu"
            font-size="22"
            font-weight="bold"
            fill="#000000">
            <tspan x="0" y="0">N-Channel</tspan>
            <tspan x="400" y="0">P-Channel</tspan>
        </text>
        <circle
            id="point"
            cx="0"
            cy="0"
            r="5"
            style="fill-opacity:1;stroke:none">
        </circle>
        <circle
            id="circumference"
            x="0"
            y="0"
            r="180"
            style="fill:none;stroke:#000000;stroke-width:4;stroke-opacity:1">
        </circle>
        <circle
            id="n_gate"
            x="0"
            y="0"
            r="178"
            style="fill:#00ffff;fill-opacity:0.2;stroke:none">
        </circle>
        <circle
            id="n_chan"
            x="0"
            y="0"
            r="110"
            style="fill:#00ffff;fill-opacity:0.2;stroke:none">
        </circle>
        <circle
            id="p_gate"
            x="0"
            y="0"
            r="178"
            style="fill:#ff0000;fill-opacity:0.2;stroke:none">
        </circle>
        <circle
            id="p_chan"
            x="0"
            y="0"
            r="110"
            style="fill:#ff0000;fill-opacity:0.2;stroke:none">
        </circle>
        <circle
            id="depletion_zone"
            x="0"
            y="0"
            r="130"
            style="fill:#ffff00;fill-opacity:0.2;stroke:none">
        </circle>
        <circle
            id="blank1"
            x="0"
            y="0"
            r="130"
            style="fill:#ffffff;fill-opacity:1;stroke:none">
        </circle>
        <circle
            id="blank2"
            x="0"
            y="0"
            r="110"
            style="fill:#ffffff;fill-opacity:1;stroke:none">
        </circle>
        <rect
            id="terminal1"
            x="0"
            y="0"
            width="55"
            height="10"
            style="fill:#000000;stroke:#000000;stroke-width:5;stroke-linecap:round;stroke-linejoin:round">
        </rect>
        <circle
            id="terminal2"
            x="0"
            y="0"
            r="30"
            style="fill:#000000;fill-opacity:1;stroke:none">
        </circle>
        <g
            id="jfet_n">
            <use xlink:href="#circumference" x="0" y="0"></use>
            <use xlink:href="#p_gate" x="0" y="0"></use>
            <use xlink:href="#blank1" x="0" y="0"></use>
            <use xlink:href="#depletion_zone" x="0" y="0"></use>
            <use xlink:href="#blank2" x="0" y="0"></use>
            <use xlink:href="#n_chan" x="0" y="0"></use>
            <use xlink:href="#terminal1" x="-27.5" y="-187"></use>
            <use xlink:href="#terminal2" x="0" y="0"></use>
            <use xlink:href="#point" x="0" y="-90" fill="#ff0000"></use>
            <use xlink:href="#point" x="45" y="-78" fill="#ff0000"></use>
            <use xlink:href="#point" x="78" y="-45" fill="#ff0000"></use>
            <use xlink:href="#point" x="90" y="0" fill="#ff0000"></use>
            <use xlink:href="#point" x="78" y="45" fill="#ff0000"></use>
            <use xlink:href="#point" x="45" y="78" fill="#ff0000"></use>
            <use xlink:href="#point" x="0" y="90" fill="#ff0000"></use>
            <use xlink:href="#point" x="-45" y="78" fill="#ff0000"></use>
            <use xlink:href="#point" x="-78" y="45" fill="#ff0000"></use>
            <use xlink:href="#point" x="-90" y="0" fill="#ff0000"></use>
            <use xlink:href="#point" x="-78" y="-45" fill="#ff0000"></use>
            <use xlink:href="#point" x="-45" y="-78" fill="#ff0000"></use>
        </g>
        <g
            id="jfet_p">
            <use xlink:href="#circumference" x="0" y="0"></use>
            <use xlink:href="#n_gate" x="0" y="0"></use>
            <use xlink:href="#blank1" x="0" y="0"></use>
            <use xlink:href="#depletion_zone" x="0" y="0"></use>
            <use xlink:href="#blank2" x="0" y="0"></use>
            <use xlink:href="#p_chan" x="0" y="0"></use>
            <use xlink:href="#terminal1" x="-27.5" y="-187"></use>
            <use xlink:href="#terminal2" x="0" y="0"></use>
            <use xlink:href="#point" x="0" y="-90" fill="#0000ff"></use>
            <use xlink:href="#point" x="45" y="-78" fill="#0000ff"></use>
            <use xlink:href="#point" x="78" y="-45" fill="#0000ff"></use>
            <use xlink:href="#point" x="90" y="0" fill="#0000ff"></use>
            <use xlink:href="#point" x="78" y="45" fill="#0000ff"></use>
            <use xlink:href="#point" x="45" y="78" fill="#0000ff"></use>
            <use xlink:href="#point" x="0" y="90" fill="#0000ff"></use>
            <use xlink:href="#point" x="-45" y="78" fill="#0000ff"></use>
            <use xlink:href="#point" x="-78" y="45" fill="#0000ff"></use>
            <use xlink:href="#point" x="-90" y="0" fill="#0000ff"></use>
            <use xlink:href="#point" x="-78" y="-45" fill="#0000ff"></use>
            <use xlink:href="#point" x="-45" y="-78" fill="#0000ff"></use>
        </g>
        <rect
            id="leg_p_side"
            x="0"
            y="0"
            width="30"
            height="30"
            style="fill:#ff0000;fill-opacity:0.2;stroke:none">
        </rect>
        <rect
            id="leg_n_side"
            x="0"
            y="0"
            width="30"
            height="30"
            style="fill:#00ffff;fill-opacity:0.2;stroke:none">
        </rect>
        <rect
            id="leg_dep_zone"
            x="0"
            y="0"
            width="30"
            height="30"
            style="fill:#ffff00;fill-opacity:0.5;stroke:none">
        </rect>
        <g
            id="legend">
            <use xlink:href="#leg_p_side" x="0" y="0"></use>
            <use xlink:href="#leg_n_side" x="80" y="0"></use>
            <use xlink:href="#leg_dep_zone" x="151" y="0"></use>
            <use xlink:href="#terminal1" x="270" y="15"></use>
            <use xlink:href="#terminal2" x="780" y="40" transform="scale(0.5)"></use>
            <use xlink:href="#point" x="532" y="15" fill="#0000ff"></use>
            <use xlink:href="#point" x="612" y="15" fill="#ff0000"></use>
            <text
                font-family="Ubuntu"
                font-size="12"
                font-weight="norm"
                fill="#000000">
                <tspan x="30" y="20">P-type</tspan>
                <tspan x="110" y="20">N-type</tspan>
                <tspan x="181" y="10">Depletion</tspan>
                <tspan x="195" y="23">Zone</tspan>
                <tspan x="330" y="23">Gate</tspan>
                <tspan x="407" y="25">Source/Drain</tspan>
                <tspan x="537" y="19">Hole</tspan>
                <tspan x="627" y="15">Free</tspan>
                <tspan x="617" y="25">Electron</tspan>
            </text>
        </g>
    </defs>
    <g
        id="page1">
        <g
            id="layer1"
            style="display:inline">
            <rect
                x="0"
                y="0"
                width="800"
                height="600"
                fill="white">
            </rect>
        </g>
        <g
            id="layer2"
            style="display:inline">
            <use xlink:href="#headline" x="200" y="40"></use>
            <use xlink:href="#jfet_n" x="200" y="350"></use>
            <use xlink:href="#jfet_p" x="595" y="350"></use>
            <use xlink:href="#title_1" x="280" y="75"></use>
            <use xlink:href="#title_2" x="140" y="130"></use>
            <use xlink:href="#legend" x="70" y="555"></use>
        </g>
    </g> <!--page1-->
</svg>