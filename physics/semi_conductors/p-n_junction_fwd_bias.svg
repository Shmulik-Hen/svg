<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    id="svg1"
    version="1.1"
    viewBox="0 0 800 600"
    width="800"
    height="600"
    preserveAspectRatio="xMidYMid"
    fill-rule="evenodd"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:svg="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <marker
            id="arrow_head"
            style="overflow:visible"
            viewBox="0 0 4 6"
            markerWidth="4"
            markerHeight="6"
            refX="left"
            refY="center"
            orient="auto-start-reverse"
            preserveAspectRatio="xMidYMid">
            <path
                style="fill:none;stroke:context-stroke;stroke-width:1;stroke-linecap:butt"
                d="M -3,-3 L 0,0 L -3,3">
            </path>
        </marker>
        <text
            id="headline"
            font-family="Ubuntu"
            font-size="28"
            font-weight="bold"
            fill="#000000">
            <tspan>Single Junction - Diode in Forward Bias</tspan>
        </text>
        <text
            id="title_1"
            font-family="Ubuntu"
            font-size="18"
            font-weight="bold"
            fill="#000000">
            <tspan x="5" y="57">Potential</tspan>
            <tspan x="0" y="77">Difference</tspan>
            <tspan x="200" y="78">Depletion Zone</tspan>
        </text>
        <text
            id="title_2"
            font-family="Ubuntu"
            font-size="24"
            font-weight="bold"
            fill="#0000ff">
            <tspan>Lateral Cross Section</tspan>
        </text>
        <text
            id="title_3"
            font-family="Ubuntu"
            font-size="18"
            font-weight="bold"
            fill="#000000">
            <tspan>Current!!!</tspan>
        </text>
        <text
            id="bias"
            font-family="Ubuntu"
            font-size="42"
            font-weight="bold"
            fill="#000000">
            <tspan>+</tspan>
            <tspan x="770">_</tspan>
        </text>
        <circle
            id="hole"
            cx="0"
            cy="0"
            r="5"
            style="fill:#0000ff;fill-opacity:1;stroke:none">
        </circle>
        <circle
            id="electron"
            cx="0"
            cy="0"
            r="5"
            style="fill:#ff0000;fill-opacity:1;stroke:none">
        </circle>
        <text
            id="neutral_atom_label"
            font-family="Ubuntu"
            font-size="18"
            font-weight="norm"
            fill="#000000">
            <tspan x="-5" y="6">0</tspan>
        </text>
        <g
            id="neutral_atom">
            <use xlink:href="#ion"></use>
            <use xlink:href="#neutral_atom_label"></use>
        </g>
        <circle
            id="ion"
            cx="0"
            cy="0"
            r="15"
            style="fill:none;stroke:#000000;stroke-width:2;stroke-opacity:1">
        </circle>
        <path
            id="pos_charge"
            d="m 0,-13 v 28 m -13,-14.5 h 28"
            style="fill:none;stroke:#0000ff;stroke-width:2;stroke-opacity:1">
        </path>
        <path
            id="neg_charge"
            d="m -14,0 h 28"
            style="fill:none;stroke:#ff0000;stroke-width:2;stroke-opacity:1">
        </path>
        <g
            id="pos_ion">
            <use xlink:href="#ion"></use>
            <use xlink:href="#pos_charge"></use>
        </g>
        <g
            id="neg_ion">
            <use xlink:href="#ion"></use>
            <use xlink:href="#neg_charge"></use>
        </g>
        <g
            id="neutral_atoms">
            <use xlink:href="#neutral_atom" x="0" y="30"></use>
            <use xlink:href="#neutral_atom" x="90" y="30"></use>
            <use xlink:href="#neutral_atom" x="180" y="30"></use>
            <use xlink:href="#neutral_atom" x="270" y="30"></use>
            <use xlink:href="#neutral_atom" x="45" y="80"></use>
            <use xlink:href="#neutral_atom" x="135" y="80"></use>
            <use xlink:href="#neutral_atom" x="225" y="80"></use>
        </g>
        <g
            id="dep_pos_ions">
