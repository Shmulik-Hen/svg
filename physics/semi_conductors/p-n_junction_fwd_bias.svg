    <g
        id="page1">
        <g
            id="layer1"
            style="display:inline">
            <rect
                x="0"
                y="0"
                width="800"
                height="600"
                fill="white">
            </rect>
        </g>
        <g
            id="layer2"
            style="display:inline">
            <use xlink:href="#headline" x="130" y="40"></use>
            <use xlink:href="#body" x="45" y="110" transform="scale(0.9,0.9)"></use>
            <use xlink:href="#bias" x="5" y="350"></use>
            <use xlink:href="#title_1" x="140" y="90"></use>
            <use xlink:href="#title_2" x="280" y="75"></use>
            <use xlink:href="#title_3" x="490" y="530"></use>
            <use xlink:href="#legend" x="70" y="555"></use>
        </g>
    </g> <!--page1-->
</svg>