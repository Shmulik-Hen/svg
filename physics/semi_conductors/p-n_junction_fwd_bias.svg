            <use xlink:href="#p_side" x="14" y="100"></use>
            <use xlink:href="#depletion_zone" x="353.98" y="100"></use>
            <use xlink:href="#barrier" x="400" y="100"></use>
            <use xlink:href="#potential" x="260" y="100"></use>
            <use xlink:href="#terminal" x="-9" y="200"></use>
            <use xlink:href="#terminal" x="789" y="200"></use>
            <path d="m 190 60 l 63 10" style="stroke:#000000;stroke-width:2;marker-end:url(#arrow_head)"></path>
            <path d="m 354 10 v 450" style="stroke:#000000;stroke-width:2;stroke-opacity:1;stroke-dasharray:4 7"></path>
            <path d="m 441 10 v 450" style="stroke:#000000;stroke-width:2;stroke-opacity:1;stroke-dasharray:4 7"></path>
            <path d="m 525 20 h -80" style="stroke:#000000;stroke-width:4;marker-end:url(#arrow_head)"></path>
            <path d="m 270 20 h 85" style="stroke:#000000;stroke-width:4;marker-end:url(#arrow_head)"></path>
            <path d="m 300 470 h 180" style="stroke:#000000;stroke-width:4;marker-end:url(#arrow_head)"></path>
            <path d="m 120 120 h 380" style="stroke:#0000ff;stroke-width:3;marker-end:url(#arrow_head)"></path>
            <path d="m 120 175 h 380" style="stroke:#0000ff;stroke-width:3;marker-end:url(#arrow_head)"></path>
            <path d="m 120 225 h 380" style="stroke:#0000ff;stroke-width:3;marker-end:url(#arrow_head)"></path>
            <path d="m 120 280 h 380" style="stroke:#0000ff;stroke-width:3;marker-end:url(#arrow_head)"></path>
            <path d="m 120 325h 380" style="stroke:#0000ff;stroke-width:3;marker-end:url(#arrow_head)"></path>
            <path d="m 120 380 h 380" style="stroke:#0000ff;stroke-width:3;marker-end:url(#arrow_head)"></path>
            <path d="m 120 435 h 380" style="stroke:#0000ff;stroke-width:3;marker-end:url(#arrow_head)"></path>
            <path d="m 680 150 h -400" style="stroke:#ff0000;stroke-width:3;marker-end:url(#arrow_head)"></path>
            <path d="m 680 200 h -400" style="stroke:#ff0000;stroke-width:3;marker-end:url(#arrow_head)"></path>
            <path d="m 680 250 h -400" style="stroke:#ff0000;stroke-width:3;marker-end:url(#arrow_head)"></path>
            <path d="m 680 300 h -400" style="stroke:#ff0000;stroke-width:3;marker-end:url(#arrow_head)"></path>
            <path d="m 680 350 h -400" style="stroke:#ff0000;stroke-width:3;marker-end:url(#arrow_head)"></path>
            <path d="m 680 400 h -400" style="stroke:#ff0000;stroke-width:3;marker-end:url(#arrow_head)"></path>
            <path d="m 680 435 h -400" style="stroke:#ff0000;stroke-width:3;marker-end:url(#arrow_head)"></path>
            <use xlink:href="#neutral_atoms" x="40" y="120"></use>
            <use xlink:href="#neutral_atoms" x="40" y="220"></use>
            <use xlink:href="#neutral_atoms" x="40" y="320"></use>
            <use xlink:href="#neutral_atoms" x="490" y="120"></use>
            <use xlink:href="#neutral_atoms" x="490" y="220"></use>
            <use xlink:href="#neutral_atoms" x="490" y="320"></use>
            <use xlink:href="#holes" x="5" y="150"></use>
            <use xlink:href="#holes" x="5" y="250"></use>
            <use xlink:href="#holes" x="5" y="350"></use>
            <use xlink:href="#free_electrons" x="440" y="150"></use>
            <use xlink:href="#free_electrons" x="440" y="250"></use>
            <use xlink:href="#free_electrons" x="440" y="350"></use>
            <use xlink:href="#dep_neg_ions" x="375" y="130"></use>
            <use xlink:href="#dep_pos_ions" x="420" y="130"></use>
        </g>
        <rect
            id="leg_p_side"
            x="0"
            y="0"
            width="30"
            height="30"
            style="fill:#ff0000;fill-opacity:0.2;stroke:none">
        </rect>
        <rect
            id="leg_n_side"
            x="0"
            y="0"
            width="30"
            height="30"
            style="fill:#00ffff;fill-opacity:0.2;stroke:none">
        </rect>
        <rect
            id="leg_dep_zone"
            x="0"
            y="0"
            width="30"
            height="30"
            style="fill:#ffff00;fill-opacity:0.5;stroke:none">
        </rect>
        <g
            id="legend">
            <use xlink:href="#leg_p_side" x="0" y="0"></use>
            <use xlink:href="#leg_n_side" x="80" y="0"></use>
            <use xlink:href="#leg_dep_zone" x="151" y="0"></use>
            <use xlink:href="#neutral_atom" x="262" y="15"></use>
            <use xlink:href="#pos_ion" x="352" y="15"></use>
            <use xlink:href="#neg_ion" x="442" y="15"></use>
            <use xlink:href="#hole" x="532" y="15"></use>
            <use xlink:href="#electron" x="612" y="15"></use>
            <text
                font-family="Ubuntu"
                font-size="12"
                font-weight="norm"
                fill="#000000">
                <tspan x="30" y="20">P-type</tspan>
                <tspan x="110" y="20">N-type</tspan>
                <tspan x="181" y="10">Depletion</tspan>
                <tspan x="195" y="23">Zone</tspan>
                <tspan x="277" y="10">Neutral</tspan>
                <tspan x="282" y="23">Atom</tspan>
                <tspan x="367" y="10">Positive</tspan>
                <tspan x="377" y="23">Ion</tspan>
                <tspan x="457" y="10">Negative</tspan>
                <tspan x="473" y="23">Ion</tspan>
                <tspan x="537" y="19">Hole</tspan>
                <tspan x="627" y="10">Free</tspan>
                <tspan x="617" y="23">Electron</tspan>
            </text>
        </g>
