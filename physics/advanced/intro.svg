<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    id="svg1"
    version="1.1"
    viewBox="0 0 800 600"
    width="800"
    height="600"
    preserveAspectRatio="xMidYMid"
    fill-rule="evenodd"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:svg="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
    </defs>
    <g
        id="page1">
        <g
            id="layer1"
            style="display:inline">
            <rect
                id="white_background"
                x="0"
                y="0"
                width="800"
                height="600"
                fill="white">
            </rect>
        </g>
        <g
            id="layer2"
            style="display:inline">
            <text
                font-family="Ubuntu"
                font-size="48"
                font-weight="bold"
                fill="#0000ff">
                <tspan x="30" y="160">Physics behind Semi-Conductors</tspan>
            </text>
            <text
                font-family="Ubuntu"
                font-size="30"
                font-weight="norm"
                fill="#0060a0">
                <tspan x="60" y="240">To understand what's behind the most important</tspan>
                <tspan x="60" y="280">components in Electronics - Semi-Conductors,</tspan>
                <tspan x="60" y="320">we need to take a deeper dive into the structure</tspan>
                <tspan x="60" y="360">of atoms and energy levels, internal structure of</tspan>
                <tspan x="60" y="400">the materials involved, their types, their</tspan>
                <tspan x="60" y="440">interactions and behaviors.</tspan>
            </text>
        </g>
    </g> <!--page1-->
