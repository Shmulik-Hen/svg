<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    id="svg1"
    version="1.1"
    viewBox="0 0 800 600"
    width="800"
    height="600"
    preserveAspectRatio="xMidYMid"
    fill-rule="evenodd"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:svg="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <text
            id="headline"
            font-family="Ubuntu"
            font-size="28"
            font-weight="bold"
            fill="#000000">
            <tspan>Bands - Semi-Conductor (doped: n-type)</tspan>
        </text>
        <text
            id="cond_label"
            font-family="Ubuntu"
            font-size="20"
            font-weight="bold"
            fill="#000000">
            <tspan>Conduction band</tspan>
        </text>
        <text
            id="val_label"
            font-family="Ubuntu"
            font-size="20"
            font-weight="bold"
            fill="#000000">
            <tspan>Valence band</tspan>
        </text>
        <text
            id="gap_label"
            font-family="Ubuntu"
            font-size="20"
            font-weight="bold"
            fill="#000000">
            <tspan>Band gap</tspan>
        </text>
        <text
            id="fermi_label"
            font-family="Ubuntu"
            font-size="20"
            font-weight="bold"
            fill="#000000">
            <tspan>Fermi level (Fe)</tspan>
        </text>
        <text
            id="donor_label"
            font-family="Ubuntu"
            font-size="20"
            font-weight="bold"
            fill="#000000">
            <tspan>Donor level</tspan>
        </text>
        <path
            id="orbit"
            d="m 0,0 a 2000,2000 0 0 1 800,0">
        </path>
        <g
            id="conduction_band"
            style="fill:none;stroke:#ff0000;stroke-width:1">
            <use xlink:href="#orbit" x="0" y="00"></use>
            <use xlink:href="#orbit" x="0" y="05"></use>
            <use xlink:href="#orbit" x="0" y="10"></use>
            <use xlink:href="#orbit" x="0" y="15"></use>
            <use xlink:href="#orbit" x="0" y="20"></use>
            <use xlink:href="#orbit" x="0" y="25"></use>
            <use xlink:href="#orbit" x="0" y="30"></use>
            <use xlink:href="#orbit" x="0" y="35"></use>
            <use xlink:href="#orbit" x="0" y="40"></use>
            <use xlink:href="#orbit" x="0" y="45"></use>
            <use xlink:href="#orbit" x="0" y="50"></use>
            <use xlink:href="#orbit" x="0" y="55"></use>
            <use xlink:href="#orbit" x="0" y="60"></use>
            <use xlink:href="#orbit" x="0" y="65"></use>
            <use xlink:href="#orbit" x="0" y="70"></use>
            <use xlink:href="#orbit" x="0" y="75"></use>
            <use xlink:href="#orbit" x="0" y="80"></use>
            <use xlink:href="#orbit" x="0" y="85"></use>
            <use xlink:href="#orbit" x="0" y="90"></use>
            <use xlink:href="#orbit" x="0" y="95"></use>
            <use xlink:href="#orbit" x="0" y="110"></use>
        </g>
        <g
            id="valence_band"
            style="fill:none;stroke:#0000ff;stroke-width:1">
            <use xlink:href="#orbit" x="0" y="00"></use>
            <use xlink:href="#orbit" x="0" y="05"></use>
            <use xlink:href="#orbit" x="0" y="10"></use>
            <use xlink:href="#orbit" x="0" y="15"></use>
            <use xlink:href="#orbit" x="0" y="20"></use>
            <use xlink:href="#orbit" x="0" y="25"></use>
            <use xlink:href="#orbit" x="0" y="30"></use>
            <use xlink:href="#orbit" x="0" y="35"></use>
            <use xlink:href="#orbit" x="0" y="40"></use>
            <use xlink:href="#orbit" x="0" y="45"></use>
            <use xlink:href="#orbit" x="0" y="50"></use>
            <use xlink:href="#orbit" x="0" y="55"></use>
            <use xlink:href="#orbit" x="0" y="60"></use>
            <use xlink:href="#orbit" x="0" y="65"></use>
            <use xlink:href="#orbit" x="0" y="70"></use>
            <use xlink:href="#orbit" x="0" y="75"></use>
            <use xlink:href="#orbit" x="0" y="80"></use>
            <use xlink:href="#orbit" x="0" y="85"></use>
            <use xlink:href="#orbit" x="0" y="90"></use>
            <use xlink:href="#orbit" x="0" y="95"></use>
        </g>
        <g
            id="fermi_level"
            style="fill:none;stroke:#000000;stroke-width:2">
            <use xlink:href="#orbit" x="0" y="00"></use>
        </g>
        <g
            id="gap_size"
            style="fill:none;stroke:#000000;stroke-width:1">
            <path d="m 0,0 v 73 m -10,-73 h 20 m -20,73 h 20"></path>
        </g>
    </defs>
    <g
        id="page1">
        <g
            id="band1"
            style="display:inline">
            <rect
                id="white_background"
                x="0"
                y="0"
                width="800"
                height="600"
                fill="white">
            </rect>
        </g>
        <g
            id="band2"
            style="display:inline">
            <use xlink:href="#headline" x="140" y="40"></use>
            <use xlink:href="#cond_label" x="290" y="165"></use>
            <use xlink:href="#gap_label" x="410" y="350"></use>
            <use xlink:href="#val_label" x="320" y="480"></use>
            <use xlink:href="#fermi_label" x="80" y="180"></use>
            <use xlink:href="#donor_label" x="560" y="180"></use>
            <use xlink:href="#gap_size" x="400" y="292.7"></use>
            <use xlink:href="#conduction_band" y="220"></use>
            <use xlink:href="#valence_band" y="410"></use>
            <use xlink:href="#fermi_level" y="324"></use>
            <line x1="130" y1="185" x2="250" y2="288" style="stroke:#000000;stroke-width:1"></line>
            <line x1="620" y1="185" x2="550" y2="296" style="stroke:#000000;stroke-width:1"></line>
        </g>
    </g> <!--page1-->
</svg>