<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    id="svg1"
    version="1.1"
    viewBox="0 0 800 600"
    width="800"
    height="600"
    preserveAspectRatio="xMidYMid"
    fill-rule="evenodd"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:svg="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
    </defs>
    <g
        id="page1">
        <g
            id="layer1"
            style="display:inline">
            <rect
                id="white_background"
                x="0"
                y="0"
                width="800"
                height="600"
                fill="white">
            </rect>
        </g> <!--layer1-->
        <g
            id="layer2"
            style="display:inline">
            <text
                font-family="Ubuntu"
                font-size="36"
                font-weight="bold"
                fill="#0000ff">
                <tspan x="30" y="60">Basic terms in Semi-Conductors (5)</tspan>
            </text>
            <text
                font-family="Ubuntu"
                font-size="29"
                font-weight="norm"
                fill="#0060a0">
                <tspan x="30" y="110" font-weight="bold">P-N Junction</tspan>
                <tspan x="30" y="140">A junction is created by fusing P-type and N-type</tspan>
                <tspan x="30" y="170">semiconductors closely together, by growing them on</tspan>
                <tspan x="30" y="200">the same substrate (usually silicon-oxide). This allows</tspan>
                <tspan x="30" y="230">for the movement of charge carriers across the junction.</tspan>
                <tspan x="30" y="260">Initially, both the extrinsic s-c and the dopants</tspan>
                <tspan x="30" y="290">are in electrical equilibrium.</tspan>
                <tspan x="30" y="330" font-weight="bold">Diffusion</tspan>
                <tspan x="30" y="360">Due to the proximity of the two majority carrier types,</tspan>
                <tspan x="30" y="390">electrons from the N-side diffuse into the P-side, while</tspan>
                <tspan x="30" y="420">holes from the P-side diffuse into the N-side, creating</tspan>
                <tspan x="30" y="450">a concentration gradient. This leaves behind immobile</tspan>
                <tspan x="30" y="480">ions at the junction, locked in the lattice. The N-side is</tspan>
                <tspan x="30" y="510">left with a layer of positive ions, and the P-side is left</tspan>
                <tspan x="30" y="540">with a layer of negative ions. Since this area is void of</tspan>
                <tspan x="30" y="570">any charge carriers, it forms the</tspan>
                <tspan x="447" y="570" font-weight="bold">Depletion Region.</tspan>
            </text>
        </g> <!--layer2-->
    </g> <!--page1-->
</svg>