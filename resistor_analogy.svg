<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    id="svg1"
    version="1.1"
    viewBox="0px 0px 800px 600px"
    width="800px"
    height="600px"
    preserveAspectRatio="xMidYMid"
    fill-rule="evenodd"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:svg="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <path
            id="divider"
            d="m 0,40 v 600"
            style="fill:none;fill-opacity:1;stroke:#000000;stroke-width:5;stroke-opacity:1;stroke-dasharray:5,5">
        </path> <!--divider-->
        <g
            id="headline">
            <text
                font-family="Ubuntu"
                font-size="28"
                font-weight="bold"
                fill="#000000">
                <tspan x="0" y="0">Analogy: Resistor </tspan>
            </text>
            <text
                font-family="Ubuntu"
                font-size="28"
                font-weight="bold"
                fill="#000000">
                <tspan x="235" y="0">=</tspan>
            </text>
            <text
                font-family="Ubuntu"
                font-size="28"
                font-weight="bold"
                fill="#000000">
                <tspan x="260" y="0">Pipe narrowing</tspan>
            </text>
        </g> <!--headline-->
        <text
            id="pipe_text"
            font-family="Ubuntu"
            font-size="24"
            font-weight="bold"
            fill="#000000">
            <tspan>Pipe</tspan>
        </text> <!--pipe_text-->
        <text
            id="narrow_text"
            font-family="Ubuntu"
            font-size="24"
            font-weight="bold"
            fill="#000000">
            <tspan>Narrow</tspan>
        </text> <!--narrow_text-->
        <text
            id="wire_text"
            font-family="Ubuntu"
            font-size="24"
            font-weight="bold"
            fill="#000000">
            <tspan>Wire</tspan>
        </text> <!--wire_text-->
        <text
            id="resistor_text"
            font-family="Ubuntu"
            font-size="24"
            font-weight="bold"
            fill="#000000">
            <tspan>Resistor</tspan>
        </text> <!--resistor_text-->
        <text
            id="bulb_text"
            font-family="Ubuntu"
            font-size="24"
            font-weight="bold"
            fill="#000000">
            <tspan>Bulb</tspan>
        </text> <!--bulb_text-->
        <g
            id="pipe_top">
            <path
                d="m 0,0 h 140 v 255"
                style="fill:none;fill-opacity:1;stroke:#000000;stroke-width:5;stroke-opacity:1">
            </path>
            <path
                d="m 0,60 h 80 v 195"
                style="fill:none;fill-opacity:1;stroke:#000000;stroke-width:5;stroke-opacity:1">
            </path>
        </g> <!--pipe_top-->
        <g
            id="pipe_bottom">
            <path
                d="m -2.5,0 h 22.5 v 40 h -20 v 180"
                style="fill:none;fill-opacity:1;stroke:#000000;stroke-width:5;stroke-opacity:1">
            </path>
            <path
                d="m 62.5,0 h -22.5 v 40 h 20 v 180"
                style="fill:none;fill-opacity:1;stroke:#000000;stroke-width:5;stroke-opacity:1">
            </path>
        </g> <!--pipe_bottom-->
        <polyline
            id="water_top"
            points="0,2.5 137.5,2.5 137.5,255 82.5,255 82.5,175 82.5,57.5 0,57.5"
            style="fill:#0000ff;fill-opacity:0.4;stroke:none;stroke-width:1;stroke-opacity:1">
        </polyline> <!--water_top-->
        <polyline
            id="water_bottom"
            points="22.5,0 38,0 38,250 22.5,250"
            style="fill:#0000ff;fill-opacity:0.4;stroke:none;stroke-width:1;stroke-opacity:1">
        </polyline> <!--water_bottom-->
        <g
            id="full_pipe_top">
            <use xlink:href="#pipe_top"></use>
            <use xlink:href="#water_top"></use>
        </g> <!--full_pipe_top-->
        <g
            id="full_pipe_bottom">
            <use xlink:href="#pipe_bottom"></use>
            <use xlink:href="#water_bottom"></use>
        </g> <!--full_pipe_bottom-->
        <g
            id="circuit">
            <path
                id="wire"
                d="m 0,0 v 110 m 0,60 v 110 m 0,60 v 110"
                style="fill:none;fill-opacity:1;stroke:#000000;stroke-width:5;stroke-opacity:1">
            </path>
        </g> <!--circuit-->
        <circle
            id="contact_point"
            cx="0"
            cy="0"
            r="5"
            style="fill:none;fill-opacity:1;stroke:#000000;stroke-width:5;stroke-opacity:1">
        </circle> <!--contact_point-->
        <circle
            id="bulb_shape"
            cx="0"
            cy="0"
            r="30"
            style="fill:none;fill-opacity:1;stroke:#000000;stroke-width:5;stroke-opacity:1">
        </circle> <!--bulb_shape-->
        <circle
            id="bulb_light"
            cx="0"
            cy="0"
            r="40"
            style="fill:#e4f40b;fill-opacity:1;stroke:none;stroke-width:1;stroke-opacity:1">
        </circle> <!--bulb_light-->
        <path
            id="bulb_line"
            d="m 0,0 l 60,0"
            style="fill:none;fill-opacity:1;stroke:#000000;stroke-width:5;stroke-opacity:1">
        </path> <!--bulb_line-->
        <g
            id="bulb">
            <use xlink:href="#bulb_light" x="0" y="0"></use>
            <use xlink:href="#bulb_shape" x="0" y="0"></use>
            <use xlink:href="#bulb_line" x="-30" y="0" transform="rotate(45)"></use>
            <use xlink:href="#bulb_line" x="-30" y="0" transform="rotate(-45)"></use>
        </g> <!--bulb-->
        <path
            id="symbol"
            d="m 0,0 h 15
               l 2,-10 l 4,20 l 4,-20 l 4,20
               l 4,-20 l 4,20 l 4,-20 l 4,20
               l 4,-20 l 4,20 l 2,-10 h 15"
            transform="rotate(90) scale(1.2,1.2)"
            style="fill:none;fill-opacity:1;stroke:#000000;stroke-width:1;stroke-opacity:1">
        </path> <!--symbol-->
        <text
            id="symbol_letter"
            font-family="Ubuntu"
            font-size="20"
            font-weight="bold"
            fill="#000000">
            <tspan>R</tspan>
        </text> <!--symbol_letter-->
    </defs>
    <g
        id="page1">
        <g
            id="layer1"
            style="display:inline">
            <rect
                id="white_background"
                x="0"
                y="0"
                width="800"
                height="600"
                fill="white">
            </rect>
        </g> <!--layer1-->
        <g
            id="layer2"
            style="display:inline">
            <use xlink:href="#divider" x="400"></use>
            <use xlink:href="#headline" x="150" y="30"></use>
            <use xlink:href="#pipe_text" x="110" y="70"></use>
            <use xlink:href="#narrow_text" x="240" y="355"></use>
            <use xlink:href="#wire_text" x="570" y="70"></use>
            <use xlink:href="#resistor_text" x="480" y="240"></use>
            <use xlink:href="#bulb_text" x="500" y="420"></use>
            <use xlink:href="#full_pipe_top" x="80" y="80"></use>
            <use xlink:href="#full_pipe_bottom" x="160" y="335"></use>
            <use xlink:href="#circuit" x="600" y="100"></use>
            <use xlink:href="#bulb" x="600" y="410" opacity="0.4"></use>
            <use xlink:href="#symbol" x="600" y="197"></use>
            <use xlink:href="#symbol_letter" x="620" y="250"></use>
        </g> <!--layer2-->
    </g> <!--page1-->
</svg>