<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    id="svg1"
    version="1.1"
    viewBox="0px 0px 800px 600px"
    width="800px"
    height="600px"
    preserveAspectRatio="xMidYMid"
    fill-rule="evenodd"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:svg="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <path
            id="divider"
            d="m 0,40 v 600"
            style="fill:none;fill-opacity:1;stroke:#000000;stroke-width:5;stroke-opacity:1;stroke-dasharray:5,5">
        </path> <!--divider-->
        <g
            id="headline">
            <text
                font-family="Ubuntu"
                font-size="28"
                font-weight="bold"
                fill="#000000">
                <tspan x="0" y="0">Analogy: Resistor </tspan>
            </text>
            <text
                font-family="Ubuntu"
                font-size="28"
                font-weight="bold"
                fill="#000000">
                <tspan x="235" y="0">=</tspan>
            </text>
            <text
                font-family="Ubuntu"
                font-size="28"
                font-weight="bold"
                fill="#000000">
                <tspan x="260" y="0">Pipe narrowing</tspan>
            </text>
        </g> <!--headline-->
        <text
            id="pipe_text"
            font-family="Ubuntu"
            font-size="24"
            font-weight="bold"
            fill="#000000">
            <tspan>Pipe</tspan>
        </text> <!--pipe_text-->
        <text
            id="narrow_text"
            font-family="Ubuntu"
            font-size="24"
            font-weight="bold"
            fill="#000000">
            <tspan>Narrow</tspan>
        </text> <!--narrow_text-->
        <text
            id="wire_text"
            font-family="Ubuntu"
            font-size="24"
            font-weight="bold"
            fill="#000000">
            <tspan>Wire</tspan>
        </text> <!--wire_text-->
        <text
            id="resistor_text"
            font-family="Ubuntu"
            font-size="24"
            font-weight="bold"
            fill="#000000">
            <tspan>Resistor</tspan>
        </text> <!--resistor_text-->
        <text
            id="bulb_text"
            font-family="Ubuntu"
            font-size="24"
            font-weight="bold"
            fill="#000000">
            <tspan>Bulb</tspan>
        </text> <!--bulb_text-->
        <g
            id="pipe">
            <path
                d="m 0,0 v 197 a 8,8 0 0 0 8,8 h 33 a 8,8 0 0 1 8,8 v 50"
                style="fill:none;fill-opacity:1;stroke:#000000;stroke-width:10;stroke-opacity:1;stroke-linejoin:round">
            </path>
            <path
                d="m 150,0 v 197 a 8,8 0 0 1 -8,8 h -33 a 8,8 0 0 0 -8,8 v 50"
                style="fill:none;fill-opacity:1;stroke:#000000;stroke-width:10;stroke-opacity:1">
            </path>
        </g> <!--pipe-->
        <polyline
            id="water_top"
            points="0,0 145.5,0 145.5,203 0,203"
            style="fill:#0000ff;fill-opacity:0.4;stroke:none;stroke-width:1;stroke-opacity:1">
        </polyline> <!--water_top-->
        <polyline
            id="water_bottom"
            points="50,0 100,0 100,310 50,310"
            style="fill:#0000ff;fill-opacity:0.4;stroke:none;stroke-width:1;stroke-opacity:1">
        </polyline> <!--water_bottom-->
        <g
            id="full_pipe_top">
            <use xlink:href="#pipe"></use>
            <use xlink:href="#water_top" x="2"></use>
        </g> <!--full_pipe_top-->
        <g
            id="full_pipe_bottom">
            <use xlink:href="#pipe" transform="scale(1,-1)"></use>
            <use xlink:href="#water_bottom" y="-297"></use>
        </g> <!--full_pipe_bottom-->
        <circle
            id="contact_point"
            cx="0"
            cy="0"
            r="5"
            style="fill:none;fill-opacity:1;stroke:#000000;stroke-width:5;stroke-opacity:1">
        </circle> <!--contact_point-->
        <g
            id="circuit">
            <path
                id="wire"
                d="m 0,0 v 90 m 0,100 v 90 m 0,60 v 110"
                style="fill:none;fill-opacity:1;stroke:#000000;stroke-width:5;stroke-opacity:1">
            </path>
            <use xlink:href="#contact_point" x="0" y="95"></use>
            <use xlink:href="#contact_point" x="0" y="185"></use>
        </g> <!--circuit-->
        <circle
            id="bulb_shape"
            cx="0"
            cy="0"
            r="30"
            style="fill:none;fill-opacity:1;stroke:#000000;stroke-width:5;stroke-opacity:1">
        </circle> <!--bulb_shape-->
        <circle
            id="bulb_light"
            cx="0"
            cy="0"
            r="40"
            style="fill:#e4f40b;fill-opacity:1;stroke:none;stroke-width:1;stroke-opacity:1">
        </circle> <!--bulb_light-->
        <path
            id="bulb_line"
            d="m 0,0 l 60,0"
            style="fill:none;fill-opacity:1;stroke:#000000;stroke-width:5;stroke-opacity:1">
        </path> <!--bulb_line-->
        <g
            id="bulb">
            <use xlink:href="#bulb_light" x="0" y="0" opacity="0.3"></use>
            <use xlink:href="#bulb_shape" x="0" y="0"></use>
            <use xlink:href="#bulb_line" x="-30" y="0" transform="rotate(45)"></use>
            <use xlink:href="#bulb_line" x="-30" y="0" transform="rotate(-45)"></use>
        </g> <!--bulb-->
        <path
            id="symbol"
            d="m 0,0 h 15
               l 2,-10 l 4,20 l 4,-20 l 4,20
               l 4,-20 l 4,20 l 4,-20 l 4,20
               l 4,-20 l 4,20 l 2,-10 h 15"
            transform="rotate(90) scale(1.2,1.2)"
            style="fill:none;fill-opacity:1;stroke:#000000;stroke-width:2;stroke-opacity:1">
        </path> <!--symbol-->
        <text
            id="symbol_letter"
            font-family="Ubuntu"
            font-size="20"
            font-weight="bold"
            fill="#000000">
            <tspan>R</tspan>
        </text> <!--symbol_letter-->
        <text
            id="pos_chrg"
            font-family="Ubuntu"
            font-size="26"
            font-weight="bold"
            fill="#0000ff">
            <tspan x="0" y="0">+</tspan>
            <tspan x="20" y="0">+</tspan>
            <tspan x="40" y="0">+</tspan>
            <tspan x="60" y="0">+</tspan>
            <tspan x="80" y="0">+</tspan>
            <tspan x="100" y="0">+</tspan>
            <tspan x="120" y="0">+</tspan>
            <tspan x="0" y="22">+</tspan>
            <tspan x="20" y="22">+</tspan>
            <tspan x="40" y="22">+</tspan>
            <tspan x="60" y="22">+</tspan>
            <tspan x="80" y="22">+</tspan>
            <tspan x="100" y="22">+</tspan>
            <tspan x="120" y="22">+</tspan>
            <tspan x="0" y="44">+</tspan>
            <tspan x="20" y="44">+</tspan>
            <tspan x="40" y="44">+</tspan>
            <tspan x="60" y="44">+</tspan>
            <tspan x="80" y="44">+</tspan>
            <tspan x="100" y="44">+</tspan>
            <tspan x="120" y="44">+</tspan>
        </text> <!--pos_chrg-->
        <text
            id="neg_chrg"
            font-family="Ubuntu"
            font-size="30"
            font-weight="bold"
            fill="#ff0000">
            <tspan x="0" y="0">_</tspan>
            <tspan x="20" y="0">_</tspan>
            <tspan x="40" y="0">_</tspan>
            <tspan x="60" y="0">_</tspan>
            <tspan x="80" y="0">_</tspan>
            <tspan x="100" y="0">_</tspan>
            <tspan x="120" y="0">_</tspan>
            <tspan x="10" y="20">_</tspan>
            <tspan x="30" y="20">_</tspan>
            <tspan x="50" y="20">_</tspan>
            <tspan x="70" y="20">_</tspan>
            <tspan x="90" y="20">_</tspan>
            <tspan x="110" y="20">_</tspan>
            <tspan x="0" y="40">_</tspan>
            <tspan x="20" y="40">_</tspan>
            <tspan x="40" y="40">_</tspan>
            <tspan x="60" y="40">_</tspan>
            <tspan x="80" y="40">_</tspan>
            <tspan x="100" y="40">_</tspan>
            <tspan x="120" y="40">_</tspan>
        </text> <!--neg_chrg-->
    </defs>
    <g
        id="page1">
        <g
            id="layer1"
            style="display:inline">
            <rect
                id="white_background"
                x="0"
                y="0"
                width="800"
                height="600"
                fill="white">
            </rect>
        </g> <!--layer1-->
        <g
            id="layer2"
            style="display:inline">
            <use xlink:href="#divider" x="400"></use>
            <use xlink:href="#headline" x="150" y="30"></use>
            <use xlink:href="#pipe_text" x="110" y="70"></use>
            <use xlink:href="#narrow_text" x="240" y="355"></use>
            <use xlink:href="#wire_text" x="570" y="70"></use>
            <use xlink:href="#resistor_text" x="480" y="240"></use>
            <use xlink:href="#bulb_text" x="500" y="420"></use>
            <use xlink:href="#full_pipe_top" x="80" y="80"></use>
            <use xlink:href="#full_pipe_bottom" x="80" y="580"></use>
            <use xlink:href="#bulb" x="600" y="410"></use>
            <use xlink:href="#circuit" x="600" y="100"></use>
            <use xlink:href="#symbol" x="600" y="197.5"></use>
            <use xlink:href="#symbol_letter" x="620" y="250"></use>
            <use xlink:href="#pos_chrg" x="610" y="120"></use>
            <use xlink:href="#pos_chrg" x="620" y="130"></use>
            <use xlink:href="#neg_chrg" x="610" y="500"></use>
            <use xlink:href="#pos_chrg" x="680" y="340" transform="scale(0.9)"></use>
        </g> <!--layer2-->
    </g> <!--page1-->
</svg>